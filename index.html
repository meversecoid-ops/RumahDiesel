<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dispatch Board — Sistem Inventory &amp; Sales Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --steel-900:#111A24;
  --steel-800:#1A2531;
  --steel-700:#27364a;
  --steel-500:#5b6c80;
  --paper:#EDF0F3;
  --card:#ffffff;
  --line:#D8DEE5;
  --amber:#F2A100;
  --amber-dk:#B87A00;
  --signal:#0E7C86;
  --alert:#D0342C;
  --ok:#1E874B;
  --ink:#16202B;
  --muted:#6A7A8A;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:0}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal)}
::selection{background:var(--amber);color:#111}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:214px;flex:0 0 214px;background:var(--steel-900);color:#B9C6D4;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 16px 14px;border-bottom:1px solid #24313f}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .chip{width:26px;height:26px;border-radius:3px;background:var(--amber);color:#111A24;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:16px}
.brand h1{color:#fff;font-size:17px;line-height:1}
.brand small{display:block;color:#6E8298;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;letter-spacing:.16em;color:#5A6D80;padding:12px 10px 5px;text-transform:uppercase;font-family:"Barlow Condensed";font-weight:600}
.nav button{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:none;border:0;color:#B9C6D4;padding:8px 10px;border-radius:var(--r);font-size:13.5px;
}
.nav button:hover{background:#1E2A38;color:#fff}
.nav button.on{background:var(--amber);color:#101822;font-weight:600}
.nav button .ic{width:18px;text-align:center;opacity:.9}
.nav button .badge{margin-left:auto;background:var(--alert);color:#fff;font-size:11px;border-radius:20px;padding:0 6px;font-family:"IBM Plex Mono"}
.nav button.on .badge{background:#101822}
.railfoot{padding:10px 12px;border-top:1px solid #24313f;font-size:11px;color:#5A6D80}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--steel-800);color:#fff;padding:0 18px;height:54px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.topbar .ttl{font-family:"Barlow Condensed";font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.topbar .sub{color:#8FA1B4;font-size:12px;border-left:1px solid #3A4A5C;padding-left:14px}
.spacer{flex:1}
.bell{position:relative;background:#24313f;border:0;color:#fff;width:36px;height:34px;border-radius:var(--r);font-size:16px}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--alert);font-size:10.5px;border-radius:20px;padding:1px 5px;font-family:"IBM Plex Mono"}
.me{display:flex;align-items:center;gap:9px;background:#24313f;padding:5px 10px;border-radius:var(--r)}
.me .av{width:26px;height:26px;border-radius:3px;background:var(--signal);display:grid;place-items:center;font-weight:700;font-size:12px}
.me .nm{font-size:12.5px;line-height:1.15}
.me .rl{font-size:10px;color:#8FA1B4;letter-spacing:.1em;text-transform:uppercase}
.linkbtn{background:none;border:0;color:#8FA1B4;font-size:12px;text-decoration:underline}
.linkbtn:hover{color:#fff}

.wrap{padding:18px;max-width:1240px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card>.hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>.hd h3{font-size:15px}
.card>.bd{padding:14px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

.kpi{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--steel-700);border-radius:var(--r);padding:12px 14px}
.kpi .lb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:"Barlow Condensed";font-weight:600}
.kpi .vl{font-family:"IBM Plex Mono";font-size:26px;font-weight:600;line-height:1.25;margin-top:2px}
.kpi .ft{font-size:11.5px;color:var(--muted)}
.kpi.amber{border-left-color:var(--amber)} .kpi.alert{border-left-color:var(--alert)} .kpi.ok{border-left-color:var(--ok)} .kpi.sig{border-left-color:var(--signal)}

.btn{background:var(--steel-800);color:#fff;border:1px solid var(--steel-800);padding:7px 13px;border-radius:var(--r);font-size:13px;font-weight:500}
.btn:hover{background:var(--steel-700)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#111A24;font-weight:600}
.btn.pri:hover{background:#ffb418}
.btn.gh{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.gh:hover{background:#F4F7F9}
.btn.dgr{background:#fff;color:var(--alert);border-color:#EBC3C0}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:"Barlow Condensed";font-weight:600}
input.i,select.i,textarea.i{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
input[type=number].i{font-family:"IBM Plex Mono"}

table{width:100%;border-collapse:collapse}
th{font-family:"Barlow Condensed";font-weight:600;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EDF1F4;vertical-align:middle}
tbody tr:hover{background:#F7F9FB}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}

.tag{display:inline-block;font-family:"Barlow Condensed";font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid}
.t-baru{background:#FFF4DB;border-color:#EBCF8E;color:#8A5B00}
.t-diproses{background:#E4F0FB;border-color:#A9CCEA;color:#17537F}
.t-keluar{background:#EAF6EE;border-color:#A8D8BC;color:#166C3D}
.t-dikirim{background:#EDEAFB;border-color:#BDB4EA;color:#453092}
.t-selesai{background:#EDF0F3;border-color:#CBD3DB;color:#465768}
.t-batal{background:#FBEAE8;border-color:#E9BAB5;color:#9C2A22}
.t-flat{background:#F1F4F7;border-color:var(--line);color:var(--muted)}
.t-lunas{background:#EAF6EE;border-color:#A8D8BC;color:#166C3D}
.t-belum{background:#FBEAE8;border-color:#E9BAB5;color:#9C2A22}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-family:"Barlow Condensed";font-size:17px;color:var(--ink);letter-spacing:.05em;text-transform:uppercase}

/* stepper / signature element */
.dispatch{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.dispatch .st{flex:1;padding:9px 12px;border-right:1px solid var(--line);position:relative;background:#F7F9FB}
.dispatch .st:last-child{border-right:0}
.dispatch .st .k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-family:"Barlow Condensed";font-weight:600}
.dispatch .st .v{font-family:"IBM Plex Mono";font-size:12.5px;margin-top:2px;color:#9AA8B6}
.dispatch .st.done{background:#fff}
.dispatch .st.done .v{color:var(--ink)}
.dispatch .st.done .k{color:var(--ok)}
.dispatch .st.now{background:#FFF8E6}
.dispatch .st.now .k{color:var(--amber-dk)}
.dispatch .st.now:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:1px solid var(--line);margin-left:5px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl li.hi:before{background:var(--amber);border-color:var(--amber)}
.tl .w{font-weight:600;font-size:13px}
.tl .m{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono"}

.notif{position:absolute;right:16px;top:52px;width:340px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 34px rgba(16,26,36,.2);z-index:60;overflow:hidden}
.notif .h{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.notif .it{padding:10px 12px;border-bottom:1px solid #EDF1F4;cursor:pointer}
.notif .it:hover{background:#F7F9FB}
.notif .it.un{background:#FFFBF0}
.notif .it .t{font-size:12.8px}
.notif .it .d{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono";margin-top:2px}

#modalWrap{position:fixed;inset:0;background:rgba(17,26,36,.55);z-index:100;display:grid;place-items:start center;padding:26px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:820px;border:1px solid var(--line)}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px;max-height:70vh;overflow:auto}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#F7F9FB}
.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);line-height:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:var(--steel-900);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);border-left:3px solid var(--amber)}
.tst.bad{border-left-color:var(--alert)}
.tst.good{border-left-color:var(--ok)}

/* ---------- login / public ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:900px){.gate{grid-template-columns:1fr}.gate .left{display:none}}
.gate .left{background:var(--steel-900);color:#fff;padding:38px 42px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;
  background-image:repeating-linear-gradient(135deg,#151F2B 0 22px,#121A24 22px 44px);overflow-y:auto;max-height:100vh}
.gate .left h2{font-size:37px;line-height:1.02;color:#fff;letter-spacing:.02em}
.gate .left p{color:#93A5B7;max-width:44ch}
.gate .left .sub{color:#E3EAF1;font-size:15.5px;max-width:44ch;margin:10px 0 0}
.gate .left .spirit{border-left:3px solid var(--amber);padding:2px 0 2px 14px;margin:18px 0 0;color:#AFC0D1;font-size:13px;max-width:46ch}
.quotebox{border:1px solid #2C3B4C;border-radius:var(--r);padding:14px 16px;background:#16202C}
.quotebox q{quotes:none;display:block;color:#fff;font-size:14.5px;line-height:1.45}
.chain{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chain span{font-family:"IBM Plex Mono";font-size:11px;color:#C4D0DC;background:#1E2A38;border:1px solid #2C3B4C;
  border-radius:2px;padding:4px 9px}
.chain b{color:var(--amber);font-weight:400;align-self:center}
.closing{font-family:"Barlow Condensed";font-size:19px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);
  border-top:1px solid #2C3B4C;padding-top:14px;margin-top:16px}
.flowlist{list-style:none;padding:0;margin:22px 0 0}
.flowlist li{display:flex;gap:12px;padding:9px 0;border-top:1px solid #24313f;font-size:13px;color:#C4D0DC}
.flowlist li b{font-family:"IBM Plex Mono";color:var(--amber);font-size:12px;padding-top:2px}
.gate .right{padding:42px;display:flex;flex-direction:column;justify-content:center;max-width:560px}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px;background:#fff}
.tabs button{flex:1;border:0;background:#fff;padding:9px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--steel-800);color:#fff;font-weight:600}
.userpick{display:grid;gap:6px;max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);padding:6px;background:#fff}
.userpick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:7px 9px;border-radius:var(--r);width:100%}
.userpick button:hover{background:#F4F7F9}
.userpick button.on{border-color:var(--amber);background:#FFF8E6}
.userpick .av{width:28px;height:28px;border-radius:3px;background:var(--steel-700);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.userpick .n{font-size:13px;font-weight:600}
.userpick .r{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---------- charts & analysis ---------- */
.chart{width:100%;height:auto;display:block}
.chart .ax{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:#8A98A7}
.chart .axb{font-family:"Barlow Condensed",sans-serif;font-size:11px;fill:#5B6C7D;letter-spacing:.06em;text-transform:uppercase}
.chart rect:hover{opacity:.82}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:5px 13px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--steel-800);color:#fff;font-weight:600}
.delta{font-family:"IBM Plex Mono";font-size:12px;font-weight:600}
.delta.up{color:var(--ok)} .delta.dn{color:var(--alert)} .delta.fl{color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mtable td{font-size:13px}
.mtable td.k{color:var(--muted);width:52%}
.mtable td.v{text-align:right;font-family:"IBM Plex Mono";font-weight:600}
.verdict{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:14px 16px;background:#fff}
.verdict h3{font-size:19px}
.verdict.layak{border-left-color:var(--ok);background:#F2FAF5}
.verdict.hati{border-left-color:var(--amber);background:#FFFBF0}
.verdict.tidak{border-left-color:var(--alert);background:#FDF4F3}
.verdict p{margin:6px 0 0;font-size:13px}
.stackbar{display:flex;height:26px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.stackbar div{display:grid;place-items:center;font-size:10.5px;color:#fff;font-family:"IBM Plex Mono"}
.hint{font-size:11.5px;color:var(--muted)}

/* ---------- unggah bukti ---------- */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;background:#F9FBFC;position:relative}
.drop.wajib{border-color:#E9BAB5;background:#FDF6F5}
.drop.ada{border-style:solid;border-color:#A8D8BC;background:#F3FAF6;text-align:left;padding:11px}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{font-size:22px;color:var(--muted)}
.drop .t{font-size:13px;font-weight:600;margin-top:4px}
.buktirow{display:flex;gap:11px;align-items:center}
.buktithumb{width:52px;height:52px;border-radius:3px;object-fit:cover;border:1px solid var(--line);background:#fff;flex:0 0 52px}
.buktithumb.pdf{display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:13px;color:var(--alert)}
.buktibig{max-width:100%;border:1px solid var(--line);border-radius:var(--r)}

/* ---------- setup & sinkronisasi ---------- */
.setup{min-height:100vh;display:grid;place-items:center;padding:26px 14px;
  background:var(--steel-900);background-image:repeating-linear-gradient(135deg,#151F2B 0 22px,#121A24 22px 44px)}
.setupcard{width:100%;max-width:640px}
.steps{margin:0 0 16px;padding-left:20px}
.steps li{margin-bottom:12px;font-size:13.5px}
.codebox{position:relative;margin-top:8px}
.codebox pre{background:#111A24;color:#C6D3E0;padding:13px 14px;border-radius:var(--r);overflow:auto;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;margin:0}
.codebox .copy{position:absolute;top:8px;right:8px}
.syncwrap{display:inline-flex;align-items:center;gap:6px;background:#24313f;color:#B9C6D4;
  padding:5px 10px;border-radius:var(--r);font-size:11.5px;font-family:"IBM Plex Mono"}
.syncwrap i{width:7px;height:7px;border-radius:50%;display:block}

/* ---------- printed documents ---------- */
#printArea{display:none}
.doc{background:#fff;color:#000;font-family:"IBM Plex Sans",sans-serif;font-size:12px}
.doc .dhead{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.doc h2{font-size:22px;letter-spacing:.06em}
.doc .co{font-size:11px;line-height:1.4}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc th,.doc td{border:1px solid #000;padding:5px 7px;font-size:11.5px}
.doc th{background:#eee;color:#000;text-transform:uppercase;font-size:10.5px}
.doc .sign{display:flex;gap:40px;margin-top:26px;font-size:11px;text-align:center}
.doc .sign div{flex:1}
.doc .sign .ln{margin-top:52px;border-top:1px solid #000;padding-top:3px}
.doc .kv{font-family:"IBM Plex Mono";font-size:11.5px}
.label{width:100mm;border:2px solid #000;margin:0 auto;font-family:"IBM Plex Sans",sans-serif;font-size:11px;background:#fff;color:#000}
.label .lrow{border-bottom:1px solid #000}
.label .lrow:last-child{border-bottom:0}
.label .lcour{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#000;color:#fff}
.label .lbig{font-family:"Barlow Condensed";font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.label .lawb{font-family:"IBM Plex Mono";font-size:17px;font-weight:600;letter-spacing:.14em;margin-top:2px}
.label .lgrid{display:flex}
.label .lgrid>div{flex:1;padding:8px 10px;font-size:10.5px;line-height:1.4}
.label .lgrid>div:first-child{border-right:1px solid #000;font-size:11.5px}
.label .lk{font-family:"Barlow Condensed";font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#444;margin-bottom:2px}
.label .litem{width:100%;border-collapse:collapse}
.label .litem td{border-top:1px solid #ccc;padding:4px 10px;font-size:10.5px}
.label .lfoot{display:flex;justify-content:space-between;padding:5px 10px;font-size:9px;color:#333}
.label .bars{height:36px;justify-content:center}
.bars{display:flex;gap:1px;height:44px;align-items:flex-end;margin:8px 0 3px}
.bars i{display:block;background:#000;height:100%}
.perf{border-top:1px dashed #000;margin:9px 0}
.previewbox{background:#5C6B7A;padding:20px;border-radius:var(--r);overflow:auto}
.previewbox .doc{padding:22px;max-width:780px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.previewbox .label{background:#fff}

@media print{
  body{background:#fff}
  .shell,#toast,#modalWrap,.gate{display:none !important}
  #printArea{display:block !important}
  #printArea .doc{padding:0}
  @page{size:A4;margin:14mm}
}

/* Isi bila ingin kredensial ditanam permanen. Kunci anon memang bersifat publik —

   menyembunyikan kunci ini. */
const BAKED={url:"", key:""};
/* Site key Cloudflare Turnstile. Kosongkan bila captcha belum diaktifkan di Supabase. */

  return null;
}
const base=()=>CFG.url.replace(/\/+$/,"");
function authHeader(){
  return {apikey:CFG.key, "Content-Type":"application/json",
    Authorization:"Bearer "+((SESS&&SESS.access_token)||CFG.key)};
}
function pesanRapi(status,teks){
  try{ const j=JSON.parse(teks);
    if(j.message) return j.message;
    if(j.error_description) return j.error_description;
    if(j.msg) return j.msg;
  }catch(e){}
  if(status===401||status===403) return "Anda tidak berhak melakukan tindakan ini.";
  if(status===404) return "Tabel atau fungsi belum dibuat di database.";
  return "Kesalahan server ("+status+").";
}
async function api(path,opt={},ulang){
  const r=await fetch(base()+path,{...opt,headers:{...authHeader(),...(opt.headers||{})}});
  if(r.status===401&&!ulang&&SESS&&SESS.refresh_token){
    if(await perbaruiSesi()) return api(path,opt,true);
  }
  if(!r.ok) throw new Error(pesanRapi(r.status, await r.text().catch(()=>"")));
  if(r.status===204) return null;
  const t=await r.text().catch(()=>"");          /* balasan kosong itu wajar untuk POST/PATCH */
  if(!t.trim()) return null;
  try{ return JSON.parse(t); }catch(e){ return null; }
}

  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||"Email atau kata sandi salah.");
  SESS=j; try{ localStorage.setItem(SESKEY,JSON.stringify(j)); }catch(e){}
}
async function perbaruiSesi(){
  try{
    const r=await fetch(base()+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
      headers:{apikey:CFG.key,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:SESS.refresh_token})});
    if(!r.ok) return false;
    SESS=await r.json(); localStorage.setItem(SESKEY,JSON.stringify(SESS)); return true;
  }catch(e){ return false; }
}
async function keluarSesi(){
  try{ await fetch(base()+"/auth/v1/logout",{method:"POST",headers:authHeader()}); }catch(e){}

/* ============ bukti pemesanan ============ */
const BUCKET="bukti-pesanan", MAXFILE=10*1024*1024;
function kompresGambar(file){
  return new Promise((res,rej)=>{
    if(!file.type.startsWith("image/")) return res(file);
    const fr=new FileReader(), img=new Image();
    fr.onerror=()=>rej(new Error("File tidak terbaca."));
    fr.onload=()=>{ img.src=fr.result; };
    img.onerror=()=>rej(new Error("File bukan gambar yang valid."));
    img.onload=()=>{
      const max=1400; let w=img.width, h=img.height;
      const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error("Gagal memproses gambar.")),"image/jpeg",0.72);
    };
    fr.readAsDataURL(file);
  });
}
const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();
  f.onload=()=>res(f.result); f.onerror=()=>rej(new Error("Gagal membaca file.")); f.readAsDataURL(b);});
async function unggahBukti(file){
  if(file.size>MAXFILE) throw new Error("Ukuran file maksimal 10 MB.");
  const blob=await kompresGambar(file);
  const ext=blob.type==="application/pdf"?"pdf":(blob.type==="image/jpeg"?"jpg":(file.name.split(".").pop()||"dat"));
  const meta={nama:file.name,tipe:blob.type,ukuran:blob.size,ts:now(),oleh:ME?ME.nama:"-"};
  const path="so/"+Date.now()+"-"+uid().slice(0,6)+"."+ext;
  const r=await fetch(base()+"/storage/v1/object/"+BUCKET+"/"+path,{method:"POST",
    headers:{apikey:CFG.key,Authorization:"Bearer "+((SESS&&SESS.access_token)||CFG.key),
      "Content-Type":blob.type||"application/octet-stream"},body:blob});
  if(!r.ok){ const t=await r.text().catch(()=>"");
    throw new Error(r.status===404?"Bucket bukti-pesanan belum dibuat di Supabase.":"Gagal unggah ("+r.status+") "+t.slice(0,120)); }
  return {...meta,url:base()+"/storage/v1/object/public/"+BUCKET+"/"+path};
}

const ymd=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function rpShort(n){const a=Math.abs(n);
  if(a>=1e9)return "Rp "+(n/1e9).toFixed(1).replace(".",",")+" M";
  if(a>=1e6)return "Rp "+(n/1e6).toFixed(1).replace(".",",")+" jt";
  if(a>=1e3)return "Rp "+Math.round(n/1e3)+" rb";
  return "Rp "+Math.round(n);}
function periodKey(d,per){const x=new Date(d);
  if(per==="bulan")return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");
  if(per==="minggu"){const t=new Date(x);t.setDate(t.getDate()-((t.getDay()+6)%7));return ymd(t);}
  return ymd(x);}
function periodLabel(d,per){const x=new Date(d);
  if(per==="bulan")return BLN[x.getMonth()]+" "+String(x.getFullYear()).slice(2);
  if(per==="minggu")return x.getDate()+" "+BLN[x.getMonth()];
  return x.getDate()+"/"+(x.getMonth()+1);}
function lastPeriods(per,n){const out=[],base=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(base);
    if(per==="bulan"){d.setDate(1);d.setMonth(base.getMonth()-i);}
    else if(per==="minggu"){d.setDate(base.getDate()-i*7);d.setDate(d.getDate()-((d.getDay()+6)%7));}
    else d.setDate(base.getDate()-i);
    out.push({key:periodKey(d,per),label:periodLabel(d,per),v:0,hpp:0,n:0});}
  return out;}
const orderHPP=o=>o.items.reduce((a,it)=>{const p=prod(it.productId);return a+(p?p.beli*it.qty:0)},0);
function revSeries(per){
  const n=per==="hari"?30:12, arr=lastPeriods(per,n), map={};
  arr.forEach(b=>map[b.key]=b);
  DB.orders.filter(o=>o.status!=="BATAL").forEach(o=>{
    const b=map[periodKey(o.tanggal,per)]; if(!b)return;
    b.v+=o.sub; b.hpp+=orderHPP(o); b.n++;});
  return arr;}
function revByStore(days){
  const lim=Date.now()-days*86400000, m={};
  DB.orders.filter(o=>o.status!=="BATAL"&&new Date(o.tanggal).getTime()>=lim).forEach(o=>{
    m[o.storeId]=m[o.storeId]||{v:0,laba:0,n:0};
    m[o.storeId].v+=o.sub; m[o.storeId].laba+=o.sub-orderHPP(o); m[o.storeId].n++;});
  return DB.stores.map(s=>({s,...(m[s.id]||{v:0,laba:0,n:0})})).sort((a,b)=>b.v-a.v);}
function topProducts(days,limit){
  const lim=Date.now()-days*86400000, m={};
  DB.orders.filter(o=>o.status!=="BATAL"&&new Date(o.tanggal).getTime()>=lim).forEach(o=>o.items.forEach(it=>{
    m[it.productId]=m[it.productId]||{qty:0,v:0,laba:0};
    const p=prod(it.productId); m[it.productId].qty+=it.qty; m[it.productId].v+=it.qty*it.harga;
    m[it.productId].laba+=it.qty*(it.harga-(p?p.beli:0));}));
  return Object.keys(m).map(id=>({p:prod(id)||{nama:"—",sku:""},...m[id]}))
    .sort((a,b)=>b.v-a.v).slice(0,limit||6);}

/* --- SVG charts --- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const m=v/e;
  const s=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10;return s*e;}
function chartBars(items,color,accent){
  const W=760,H=250,PL=76,PR=12,PT=14,PB=38, iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...items.map(i=>i.v))), bw=iw/Math.max(1,items.length);
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=max*(1-i/4);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#E5EAEF"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(v)}</text>`;}
  const step=Math.ceil(items.length/13);
  let b="";
  items.forEach((it,i)=>{const h=ih*(it.v/max),x=PL+i*bw+bw*0.18,w=bw*0.64,y=PT+ih-h;
    const last=i===items.length-1;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,it.v>0?1.5:0).toFixed(1)}" fill="${last&&accent?accent:color}" rx="1"><title>${esc(it.label)} — ${rp(it.v)} · ${it.n} order</title></rect>`;
    if(items.length<=13||i%step===0||last)
      b+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(it.label)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${b}</svg>`;}
function chartLines(labels,series){
  const W=760,H=260,PL=76,PR=12,PT=14,PB=48, iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));
  const X=i=>PL+(labels.length<2?iw/2:iw*i/(labels.length-1)), Y=v=>PT+ih-ih*(v/max);
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4;
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#E5EAEF"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(max*(1-i/4))}</text>`;}
  const step=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)
    g+=`<text x="${X(i).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(l)}</text>`;});
  let p="";
  series.forEach(s=>{const d=s.vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    if(s.fill) p+=`<path d="${d} L${X(s.vals.length-1).toFixed(1)} ${PT+ih} L${X(0).toFixed(1)} ${PT+ih} Z" fill="${s.color}" opacity=".10"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.8:2.4}" ${s.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${p}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;}
function chartCum(vals,labels){
  const W=760,H=240,PL=76,PR=12,PT=14,PB=38, iw=W-PL-PR, ih=H-PT-PB;
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0), span=niceMax(Math.max(mx,-mn)||1);
  const zero=PT+ih*(span/(span*2)), sc=ih/(span*2), bw=iw/vals.length;
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=span*(1-i/2);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${Math.abs(v)<1e-6?"#9AA8B6":"#E5EAEF"}"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(v)}</text>`;}
  let b="";
  vals.forEach((v,i)=>{const h=Math.abs(v)*sc,x=PL+i*bw+bw*0.2,w=bw*0.6,y=v>=0?zero-h:zero;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${v>=0?"#1E874B":"#D0342C"}" rx="1"><title>${esc(labels[i])}: ${rp(v)}</title></rect>`;
    if(i%Math.ceil(vals.length/12)===0||i===vals.length-1)
      b+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(labels[i])}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${b}</svg>`;}

/* --- kelayakan usaha --- */
function feasibDefaults(){
  const b=revSeries("bulan").slice(-4,-1);
  const avg=b.length?b.reduce((a,x)=>a+x.v,0)/b.length:180000000;
  const hpp=b.length?b.reduce((a,x)=>a+x.hpp,0)/b.length:0;
  const margin=avg>0?Math.round((1-hpp/avg)*1000)/10:25;
  return {investasi:Math.round(avg*2.5/1e7)*1e7||450000000, fixed:Math.round(avg*margin/100*0.55/1e6)*1e6||45000000,
    margin:margin||25, rev0:Math.round(avg/1e6)*1e6||180000000, growth:2,
    horizon:36, disc:12, pajak:22, hariKerja:26};
}
function feasibCalc(f){
  const dm=Math.pow(1+f.disc/100,1/12)-1, cf=[-f.investasi];
  const rows=[];
  let rev=f.rev0;
  for(let m=0;m<f.horizon;m++){
    const laba=rev*f.margin/100, ebt=laba-f.fixed, tax=ebt>0?ebt*f.pajak/100:0, net=ebt-tax;
    rows.push({m,rev,hpp:rev-laba,laba,ebt,net,biaya:(rev-laba)+f.fixed});
    cf.push(net); rev*=1+f.growth/100;
  }
  const npv=cf.reduce((a,c,i)=>a+c/Math.pow(1+dm,i),0);
  const pv=cf.slice(1).reduce((a,c,i)=>a+c/Math.pow(1+dm,i+1),0);
  const cum=[]; let s=-f.investasi; cf.slice(1).forEach(c=>{s+=c;cum.push(s)});
  let payback=null;
  for(let i=0;i<cum.length;i++) if(cum[i]>=0){const prev=i?cum[i-1]:-f.investasi;
    payback=i+(prev<0?(-prev)/(cum[i]-prev):0); break;}
  const npvAt=r=>cf.reduce((a,c,i)=>a+c/Math.pow(1+r,i),0);
  let irr=null;
  if(npvAt(0)>0){let lo=0,hi=1;
    while(npvAt(hi)>0&&hi<10)hi*=2;
    if(npvAt(hi)<=0){for(let i=0;i<160;i++){const mid=(lo+hi)/2; if(npvAt(mid)>0)lo=mid;else hi=mid;} irr=(lo+hi)/2;}}
  const irrY=irr==null?null:(Math.pow(1+irr,12)-1)*100;
  const bepBulan=f.margin>0?f.fixed/(f.margin/100):Infinity;
  const totalRev=rows.reduce((a,r)=>a+r.rev,0), totalNet=rows.reduce((a,r)=>a+r.net,0);
  let verdict,vc,alasan;
  if(npv>0&&irrY!=null&&irrY>f.disc&&payback!=null&&payback<=f.horizon*0.6){verdict="LAYAK DIJALANKAN";vc="layak";
    alasan="NPV positif, IRR di atas biaya modal, dan modal kembali sebelum "+Math.ceil(f.horizon*0.6)+" bulan.";}
  else if(npv>0){verdict="LAYAK BERSYARAT";vc="hati";
    alasan="Proyeksi menguntungkan, tetapi pengembalian modal lambat sehingga sensitif jika omzet meleset.";}
  else {verdict="BELUM LAYAK";vc="tidak";
    alasan="Nilai sekarang arus kas lebih kecil dari investasi. Perlu menaikkan omzet, menaikkan margin, atau memangkas biaya tetap.";}
  return {rows,cum,npv,pv,irrY,payback,bepBulan,bepHari:bepBulan/f.hariKerja,totalRev,totalNet,
    pi:f.investasi>0?pv/f.investasi:0,roi:f.investasi>0?totalNet/f.investasi*100:0,verdict,vc,alasan,dm};
}

  const baru=os.filter(o=>o.status==="PR_GUDANG").length;
  const proses=os.filter(o=>o.status==="APPROVED").length;
  const cek=os.filter(o=>o.status==="CEK_MANAJER").length;
  const belumBayar2=os.filter(o=>["MENUNGGU_BAYAR","DITOLAK_MANAJER"].includes(o.status)).length;
  const today=new Date().toISOString().slice(0,10);
  const keluarHariIni=DB.moves.filter(m=>m.tipe==="KELUAR"&&m.ts.slice(0,10)===today).reduce((a,m)=>a+m.qty,0);
  const kritis=DB.products.filter(p=>totalStok(p)<=p.min);

    <div class="kpi alert"><div class="lb">Stok kritis</div><div class="vl num">${kritis.length}</div><div class="ft">di bawah stok minimum</div></div>
    <div class="kpi ok"><div class="lb">Qty keluar hari ini</div><div class="vl num">${nf(keluarHariIni)}</div><div class="ft">${fdate(now())}</div></div>
  </div>
  ${ME.role==="owner"?revenueBlock():""}
  <div class="grid g2">
    <div class="card"><div class="hd"><h3>Pesanan terbaru</h3><button class="btn gh sm" style="margin-left:auto" onclick="app.go('orders')">Lihat semua</button></div>
      <div class="tw">${recent.length?`<table><thead><tr><th>No. SO</th><th>Toko</th><th>Pelanggan</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>
      ${recent.map(o=>`<tr onclick="app.detail('${o.id}')" style="cursor:pointer"><td class="mono">${esc(o.noSO)}</td><td>${esc(store(o.storeId).nama)}</td><td>${esc(o.cust.nama)}</td><td class="r mono">${rp(o.total)}</td><td>${tag(o.status)}</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty"><div class="big">Belum ada pesanan</div><p>Buat sales order pertama dari menu di kiri.</p></div>`}</div></div>
    <div class="card"><div class="hd"><h3>Perlu segera restock</h3></div>
      <div class="tw">${kritis.length?`<table><thead><tr><th>Barang</th><th class="r">Total stok</th><th class="r">Min</th><th class="r">Pusat</th></tr></thead><tbody>
      ${kritis.slice(0,8).map(p=>`<tr><td><b>${esc(p.nama)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(p.sku)}</div></td>
      <td class="r mono" style="color:var(--alert);font-weight:600">${nf(totalStok(p))}</td><td class="r mono">${nf(p.min)}</td><td class="r mono">${nf(p.pusat)}</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty"><div class="big">Stok aman</div><p>Semua barang di atas batas minimum.</p></div>`}</div></div>

function revenueBlock(){
  const per=UI.filter.per||"hari";
  const ser=revSeries(per);
  const curr=ser[ser.length-1], prev=ser[ser.length-2]||{v:0};
  const d=prev.v?((curr.v-prev.v)/prev.v*100):0;
  const dCls=d>0.5?"up":d<-0.5?"dn":"fl", dTxt=(d>0?"▲ ":d<0?"▼ ":"■ ")+Math.abs(d).toFixed(1)+"%";
  const win=ser.reduce((a,x)=>a+x.v,0), winHpp=ser.reduce((a,x)=>a+x.hpp,0), winN=ser.reduce((a,x)=>a+x.n,0);
  const marginPct=win?((win-winHpp)/win*100):0;
  const nama={hari:"Hari ini",minggu:"Minggu ini",bulan:"Bulan ini"}[per];
  const sblm={hari:"kemarin",minggu:"minggu lalu",bulan:"bulan lalu"}[per];
  const rentang={hari:"30 hari terakhir",minggu:"12 minggu terakhir",bulan:"12 bulan terakhir"}[per];
  const byStore=revByStore(per==="hari"?30:per==="minggu"?84:365);
  const maxS=Math.max(1,...byStore.map(x=>x.v));
  const top=topProducts(per==="hari"?30:90,6);
  const seg=(v,l)=>`<button class="${per===v?"on":""}" onclick="app.setPer('${v}')">${l}</button>`;
  return `
  <div class="card" style="margin-bottom:14px">
    <div class="hd"><h3>Revenue</h3>
      <span class="hint">${rentang} · di luar PPN &amp; ongkir, pesanan batal tidak dihitung</span>
      <div class="seg" style="margin-left:auto">${seg("hari","Harian")}${seg("minggu","Mingguan")}${seg("bulan","Bulanan")}</div></div>
    <div class="bd">
      <div class="grid g4" style="margin-bottom:16px">
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Barlow Condensed';font-weight:600">${nama}</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(curr.v)}</div>
          <div class="delta ${dCls}">${dTxt} <span style="color:var(--muted);font-weight:400">vs ${sblm} (${rp(prev.v)})</span></div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Barlow Condensed';font-weight:600">Total ${rentang}</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(win)}</div>
          <div class="hint">${nf(winN)} order</div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Barlow Condensed';font-weight:600">Laba kotor</div>
          <div class="mono" style="font-size:25px;font-weight:600;color:var(--ok)">${rp(win-winHpp)}</div>
          <div class="hint">margin ${marginPct.toFixed(1)}% · HPP ${rpShort(winHpp)}</div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Barlow Condensed';font-weight:600">Rata-rata per order</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(winN?win/winN:0)}</div>
          <div class="hint">${(winN/Math.max(1,ser.length)).toFixed(1)} order per ${per}</div></div>
      </div>
      ${chartBars(ser,"#27364a","#F2A100")}
    </div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="hd"><h3>Revenue per toko</h3><span class="hint" style="margin-left:auto">${per==="hari"?"30 hari":per==="minggu"?"12 minggu":"12 bulan"}</span></div><div class="bd">
      ${byStore.map((x,i)=>`<div style="margin-bottom:11px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <b>${esc(x.s.nama)}</b><span class="mono" style="font-size:12.5px">${rp(x.v)} · laba ${rpShort(x.laba)}</span></div>
        <div style="height:9px;background:#EDF1F4;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${(x.v/maxS*100).toFixed(1)}%;background:${["#F2A100","#0E7C86","#27364a","#5b6c80","#9AA8B6"][i]||"#9AA8B6"}"></div></div>
        <div class="hint">${x.n} order · kontribusi ${(win?x.v/byStore.reduce((a,y)=>a+y.v,0)*100:0).toFixed(1)}%</div></div>`).join("")}
    </div></div>
    <div class="card"><div class="hd"><h3>Barang penyumbang omzet terbesar</h3></div>
      <div class="tw"><table><thead><tr><th>Barang</th><th class="r">Qty</th><th class="r">Omzet</th><th class="r">Laba kotor</th></tr></thead><tbody>
      ${top.length?top.map(t=>`<tr><td><b>${esc(t.p.nama)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(t.p.sku)}</div></td>
        <td class="r mono">${nf(t.qty)}</td><td class="r mono">${rp(t.v)}</td><td class="r mono" style="color:var(--ok)">${rp(t.laba)}</td></tr>`).join("")
        :`<tr><td colspan="4"><div class="empty">Belum ada penjualan.</div></td></tr>`}
      </tbody></table></div></div>
  </div>`;
}

function pAnalisis(){
  const f=DB.feasib||feasibDefaults();
  const c=feasibCalc(f);
  const labels=c.rows.map(r=>"B"+(r.m+1));
  const field=(k,l,suf,step)=>`<label class="f"><span>${l}</span>
    <div class="row" style="flex-wrap:nowrap"><input class="i mono" type="number" step="${step||1}" value="${f[k]}" onchange="app.feasSet('${k}',this.value)">
    ${suf?`<span class="hint" style="white-space:nowrap">${suf}</span>`:""}</div></label>`;
  const bepMonth=c.rows.findIndex(r=>r.rev>=c.bepBulan);
  const strukturBiaya=[{l:"HPP barang",v:c.rows[0].hpp,c:"#27364a"},{l:"Biaya tetap",v:f.fixed,c:"#0E7C86"},
    {l:"Laba bersih",v:Math.max(0,c.rows[0].net),c:"#1E874B"}];
  const tb=strukturBiaya.reduce((a,x)=>a+x.v,0)||1;
  const skenario=[-20,-10,0,10,20].map(p=>{const g={...f,rev0:f.rev0*(1+p/100)};const r=feasibCalc(g);
    return {p,npv:r.npv,pb:r.payback,irr:r.irrY,v:r.verdict};});
  return `
  <div class="verdict ${c.vc}" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h3>${c.verdict}</h3><p>${esc(c.alasan)}</p></div>
      <div style="text-align:right"><div class="hint">NPV ${f.horizon} bulan</div>
        <div class="mono" style="font-size:24px;font-weight:600">${rp(c.npv)}</div></div></div>
  </div>
  <div class="grid" style="grid-template-columns:320px 1fr;gap:14px">
    <div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Asumsi</h3>
        <button class="btn gh sm" style="margin-left:auto" onclick="app.feasReset()">Ambil dari data</button></div><div class="bd">
        ${field("investasi","Investasi awal","Rp",1000000)}
        ${field("rev0","Omzet bulan pertama","Rp",1000000)}
        ${field("growth","Pertumbuhan omzet","% / bulan",0.5)}
        ${field("margin","Margin kotor","%",0.5)}
        ${field("fixed","Biaya tetap per bulan","Rp",1000000)}
        ${field("pajak","Pajak penghasilan","%",1)}
        ${field("disc","Biaya modal (discount rate)","% / tahun",0.5)}
        ${field("horizon","Horizon proyeksi","bulan",6)}
        ${field("hariKerja","Hari kerja per bulan","hari",1)}
        <p class="hint" style="margin:0">Nilai awal diambil dari rata-rata 3 bulan penjualan nyata di sistem. Ubah sesuai rencana Anda — grafik langsung menyesuaikan.</p>
      </div></div>
      <div class="card"><div class="hd"><h3>Indikator kelayakan</h3></div><div class="bd" style="padding:4px 0">
        <table class="mtable"><tbody>
        ${[["NPV (nilai sekarang bersih)",rp(c.npv)],
           ["IRR (per tahun)",c.irrY==null?"—":c.irrY.toFixed(1)+"%"],
           ["Profitability Index",c.pi.toFixed(2)+"×"],
           ["Payback period",c.payback==null?"> "+f.horizon+" bulan":c.payback.toFixed(1)+" bulan"],
           ["ROI total "+f.horizon+" bulan",c.roi.toFixed(0)+"%"],
           ["BEP omzet per bulan",rp(c.bepBulan)],
           ["BEP omzet per hari kerja",rp(c.bepHari)],
           ["Tercapai pada bulan ke-",bepMonth<0?"belum tercapai":bepMonth+1]]
          .map(r=>`<tr><td class="k">${r[0]}</td><td class="v">${r[1]}</td></tr>`).join("")}
        </tbody></table></div></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Proyeksi omzet vs total biaya</h3>
        <span class="hint" style="margin-left:auto">titik potong = break even</span></div><div class="bd">
        ${chartLines(labels,[
          {name:"Omzet",color:"#0E7C86",vals:c.rows.map(r=>r.rev),fill:true},
          {name:"Total biaya (HPP + tetap)",color:"#D0342C",vals:c.rows.map(r=>r.biaya)},
          {name:"BEP omzet",color:"#F2A100",vals:c.rows.map(()=>c.bepBulan),dash:true}])}
      </div></div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Arus kas kumulatif</h3>
        <span class="hint" style="margin-left:auto">merah = modal belum kembali</span></div><div class="bd">
        ${chartCum(c.cum,labels)}
        <p class="hint" style="margin:8px 0 0">Batang berubah hijau saat akumulasi arus kas melewati nol — itulah titik modal kembali${c.payback!=null?" (bulan ke-"+c.payback.toFixed(1)+")":""}.</p>
      </div></div>
      <div class="grid g2">
        <div class="card"><div class="hd"><h3>Struktur biaya bulan pertama</h3></div><div class="bd">
          <div class="stackbar">${strukturBiaya.map(x=>`<div style="width:${(x.v/tb*100).toFixed(1)}%;background:${x.c}">${x.v/tb>0.12?(x.v/tb*100).toFixed(0)+"%":""}</div>`).join("")}</div>
          <div class="legend">${strukturBiaya.map(x=>`<span><i style="background:${x.c}"></i>${x.l} — ${rpShort(x.v)}</span>`).join("")}</div>
          <p class="hint" style="margin:10px 0 0">Dari setiap ${rpShort(c.rows[0].rev)} omzet bulan pertama.</p>
        </div></div>
        <div class="card"><div class="hd"><h3>Uji sensitivitas omzet</h3></div>
          <div class="tw"><table><thead><tr><th>Skenario</th><th class="r">NPV</th><th class="r">IRR</th><th class="r">Balik modal</th></tr></thead><tbody>
          ${skenario.map(s=>`<tr style="${s.p===0?"background:#FFF8E6":""}"><td><b>${s.p>0?"+":""}${s.p}%</b>${s.p===0?" <span class='hint'>(dasar)</span>":""}</td>
            <td class="r mono" style="color:${s.npv>=0?"var(--ok)":"var(--alert)"}">${rpShort(s.npv)}</td>
            <td class="r mono">${s.irr==null?"—":s.irr.toFixed(0)+"%"}</td>
            <td class="r mono">${s.pb==null?"> "+f.horizon+" bln":s.pb.toFixed(1)+" bln"}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Menguji apa yang terjadi bila omzet meleset dari rencana. Bila skenario −20% masih positif, rencana relatif tahan guncangan.</p></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px"><div class="hd"><h3>Proyeksi laba-rugi ringkas</h3>
        <span class="hint" style="margin-left:auto">per 6 bulan</span></div>
        <div class="tw"><table><thead><tr><th>Periode</th><th class="r">Omzet</th><th class="r">HPP</th><th class="r">Laba kotor</th><th class="r">Biaya tetap</th><th class="r">Laba bersih</th></tr></thead><tbody>
        ${Array.from({length:Math.ceil(f.horizon/6)},(_,i)=>{const g=c.rows.slice(i*6,i*6+6);
          const S=k=>g.reduce((a,r)=>a+r[k],0);
          return `<tr><td><b>Bulan ${i*6+1}–${Math.min(i*6+6,f.horizon)}</b></td>
            <td class="r mono">${rp(S("rev"))}</td><td class="r mono">${rp(S("hpp"))}</td>
            <td class="r mono">${rp(S("laba"))}</td><td class="r mono">${rp(f.fixed*g.length)}</td>
            <td class="r mono" style="color:${S("net")>=0?"var(--ok)":"var(--alert)"};font-weight:600">${rp(S("net"))}</td></tr>`}).join("")}
        </tbody></table></div>
        <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Model ini menyederhanakan: penyusutan, modal kerja, dan piutang belum dihitung terpisah. Gunakan sebagai alat bantu diskusi, bukan pengganti studi kelayakan formal.</p></div>
      </div>
    </div>
  </div>`;
}

function pInventory(){
  const q=(UI.filter.q||"").toLowerCase();
  const list=DB.products.filter(p=>!q||p.nama.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q));
  const cols=DB.stores;
  return `<div class="card">
    <div class="hd"><h3>Stok barang</h3>
      <input class="i" style="max-width:260px;margin-left:auto" placeholder="Cari nama atau SKU…" value="${esc(UI.filter.q||"")}" oninput="app.setQ(this.value)">
      ${can("editStok")?`<button class="btn pri" onclick="app.newProduct()">Tambah barang</button>`:""}
    </div>
    <div class="tw"><table><thead><tr><th>Barang</th><th>Kategori</th><th class="r">Gudang Utama</th>
      ${cols.map(s=>`<th class="r">${esc(s.kode)}</th>`).join("")}
      <th class="r">Total</th><th class="r">Min</th><th class="r">Harga jual</th><th class="r">Bottom</th>${can("editStok")?"<th></th>":""}</tr></thead><tbody>
    ${!DB.products.length?`<tr><td colspan="${cols.length+8}"><div class="empty"><div class="big">Belum ada barang</div>
      <p>${can("editStok")?"Klik Tambah barang di kanan atas untuk mulai mengisi master data.":"Menunggu admin gudang mengisi master data."}</p></div></td></tr>`:""}
    ${list.map(p=>{const t=totalStok(p),low=t<=p.min;return `<tr>
      <td><b>${esc(p.nama)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(p.sku)} · ${esc(p.sat)}</div></td>
      <td><span class="tag t-flat">${esc(p.kat)}</span></td>
      <td class="r mono" style="font-weight:600">${nf(p.pusat)}</td>
      ${cols.map(s=>`<td class="r mono" style="color:var(--muted)">${nf((p.toko||{})[s.id]||0)}</td>`).join("")}
      <td class="r mono" style="font-weight:700;${low?"color:var(--alert)":""}">${nf(t)}</td>
      <td class="r mono" style="color:var(--muted)">${nf(p.min)}</td>
      <td class="r mono">${rp(p.jual)}</td>
      <td class="r mono" style="color:var(--muted)">${p.bottom?rp(p.bottom):"—"}</td>
      ${can("editStok")?`<td class="r"><button class="btn gh sm" onclick="app.editProduct('${p.id}')">Ubah</button></td>`:""}
    </tr>`}).join("")}
    </tbody></table>${list.length?"":`<div class="empty"><div class="big">Tidak ditemukan</div><p>Ubah kata kunci pencarian.</p></div>`}</div>

        ${d.bukti?`<div class="drop ada"><div class="buktirow">

      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Pembayaran</h3></div><div class="bd">

    <div class="hd"><h3>${esc(o.noPR||o.noSO)}</h3>${tag(o.status)}
      <span class="tag t-lunas">${esc(BAYAR[o.bayarTipe]||"—")} · ${esc((o.invoice||{}).no||"")}</span>

      ${o.items.map(it=>{const p=prod(it.productId),a=avail(p,o.sumber);return `<tr><td><b>${esc(p.nama)}</b> <span class="mono" style="color:var(--muted);font-size:11px">${esc(p.sku)}</span></td>

function pKredit(){
  const rows=DB.customers.map(c=>({c,k:kreditCust(c.id)})).filter(x=>x.k.piutang>0)
    .sort((a,b)=>b.k.overdue-a.k.overdue||b.k.piutang-a.k.piutang);
  const tot=rows.reduce((a,x)=>a+x.k.piutang,0), totOd=rows.reduce((a,x)=>a+x.k.overdue,0);
  const now=Date.now();
  const umur=[[0,30,"0–30 hari"],[31,60,"31–60 hari"],[61,90,"61–90 hari"],[91,99999,"di atas 90 hari"]];
  const ember=umur.map(u=>({l:u[2],v:0}));
  const perToko={};
  rows.forEach(x=>x.k.list.forEach(o=>{
    const h=o.tempoBayar?Math.floor((now-new Date(o.tempoBayar).getTime())/86400000):0;
    const i=umur.findIndex(u=>h>=u[0]&&h<=u[1]); if(i>-1) ember[i].v+=sisaTagihan(o);
    perToko[o.storeId]=(perToko[o.storeId]||0)+sisaTagihan(o); }));
  const maxE=Math.max(1,...ember.map(e=>e.v));
  return `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi sig"><div class="lb">Total piutang berjalan</div><div class="vl num">${rp(tot)}</div>
      <div class="ft">${rows.length} pelanggan</div></div>
    <div class="kpi alert"><div class="lb">Tunggakan jatuh tempo</div><div class="vl num">${rp(totOd)}</div>
      <div class="ft">${tot?(totOd/tot*100).toFixed(0):0}% dari total piutang</div></div>
    <div class="kpi amber"><div class="lb">Pelanggan menunggak</div><div class="vl num">${rows.filter(x=>x.k.overdue>0).length}</div>
      <div class="ft">dari ${DB.customers.length} pelanggan</div></div>
    <div class="kpi ok"><div class="lb">Faktur belum lunas</div><div class="vl num">${rows.reduce((a,x)=>a+x.k.faktur,0)}</div>
      <div class="ft">lintas seluruh toko</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="hd"><h3>Umur piutang</h3></div><div class="bd">
      ${ember.map((e,i)=>`<div style="margin-bottom:11px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px"><b>${e.l}</b><span class="mono">${rp(e.v)}</span></div>
        <div style="height:9px;background:#EDF1F4;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${(e.v/maxE*100).toFixed(1)}%;background:${["#1E874B","#F2A100","#D0342C","#8A1F17"][i]}"></div></div>
      </div>`).join("")}
      <p class="hint" style="margin:0">Dihitung dari selisih tanggal jatuh tempo dengan hari ini.</p>
    </div></div>
    <div class="card"><div class="hd"><h3>Piutang per toko</h3></div><div class="bd">
      ${DB.stores.map(st=>{const v=perToko[st.id]||0;
        return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0F3F6">
          <span>${esc(st.nama)}</span><b class="mono">${v?rp(v):"—"}</b></div>`}).join("")}
      <p class="hint" style="margin:10px 0 0">Piutang mengikuti toko yang menerbitkan pesanan, tetapi limitnya dihitung per pelanggan lintas toko.</p>
    </div></div>
  </div>
  <div class="card"><div class="hd"><h3>Rincian per pelanggan</h3></div>
    <div class="tw">${rows.length?`<table><thead><tr><th>Pelanggan</th><th>Tipe</th><th class="r">Limit</th>
      <th class="r">Piutang</th><th class="r">Tunggakan</th><th class="r">Sisa limit</th><th>Faktur</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td><b>${esc(x.c.nama)}</b><div class="mono hint">${esc(x.c.kode)}</div></td>
      <td><span class="tag t-flat">${esc(TIPECUST[x.c.tipe]||x.c.tipe)}</span></td>
      <td class="r mono">${x.c.creditLimit?rp(x.c.creditLimit):"—"}</td>
      <td class="r mono">${rp(x.k.piutang)}</td>
      <td class="r mono" style="${x.k.overdue?"color:var(--alert);font-weight:600":""}">${x.k.overdue?rp(x.k.overdue)+" · "+x.k.hari+" hari":"—"}</td>
      <td class="r mono" style="${x.c.creditLimit&&x.k.piutang>x.c.creditLimit?"color:var(--alert)":""}">${x.c.creditLimit?rp(x.c.creditLimit-x.k.piutang):"tanpa limit"}</td>
      <td style="font-size:12px">${x.k.list.map(o=>`<div><a href="#" onclick="app.detail('${o.id}');return false">${esc(o.noSO)}</a>
        <span class="mono hint">${rp(sisaTagihan(o))}</span>
        <button class="btn gh sm" onclick="app.formPelunasan('${o.id}')">Lunasi</button></div>`).join("")}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><div class="big">Tidak ada piutang berjalan</div>
      <p>Semua transaksi kredit sudah lunas.</p></div>`}</div></div>`;
}

function pLaporan(){
  const from=UI.filter.from||"", to=UI.filter.to||"";
  let mv=DB.moves.filter(m=>m.tipe==="KELUAR");
  if(from) mv=mv.filter(m=>m.ts.slice(0,10)>=from);
  if(to) mv=mv.filter(m=>m.ts.slice(0,10)<=to);
  const per={}; mv.forEach(m=>{const k=m.oleh; const p=prod(m.productId)||{beli:0,jual:0};
    per[k]=per[k]||{qty:0,nilai:0,trx:0}; per[k].qty+=m.qty; per[k].nilai+=m.qty*(p.jual||0); per[k].trx++;});
  const keys=Object.keys(per).sort((a,b)=>per[b].nilai-per[a].nilai);
  const nama=k=>k==="HQ"?"Gudang Utama":store(k).nama;
  const max=Math.max(1,...keys.map(k=>per[k].nilai));

function pasangCaptcha(){
  const box=$("#capbox");
  if(!TURNSTILE_SITEKEY||!box||box.dataset.siap) return;
  const jalan=()=>{ const b=$("#capbox");
    if(!window.turnstile||!b||b.dataset.siap) return;
    b.dataset.siap="1";
    try{
      window.turnstile.render(b,{sitekey:TURNSTILE_SITEKEY,callback:t=>{CAPTCHA=t;},
        "expired-callback":()=>{CAPTCHA=null;},
        "error-callback":()=>{ CAPTCHA=null;
          toast("Verifikasi keamanan gagal dimuat. Periksa site key dan domain di Cloudflare Turnstile.","bad"); }});
    }catch(e){ b.dataset.siap=""; toast("Captcha gagal dipasang: "+e.message,"bad"); }
  };
  if(window.turnstile) return jalan();
  if(!document.getElementById("tsjs")){
    const sc=document.createElement("script"); sc.id="tsjs";
    sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    sc.async=true; sc.onload=jalan; document.head.appendChild(sc);
  }
}

/* ============ modal ============ */
function modal(title,body,footer){
  $("#modalHost").innerHTML=`<div id="modalWrap" onclick="if(event.target.id==='modalWrap')app.closeModal()">
    <div class="modal"><div class="mh"><h3>${title}</h3><button class="x" onclick="app.closeModal()">×</button></div>
    <div class="mb">${body}</div><div class="mf">${footer||'<button class="btn gh" onclick="app.closeModal()">Tutup</button>'}</div></div></div>`;
  applyBil($("#modalHost")); applyBil($("#printArea"));
}

  /* --- koneksi & sesi --- */
  async connect(){
    const url=(($("#cfgUrl")||{}).value||"").trim(), key=(($("#cfgKey")||{}).value||"").trim();
    if(!/^https:\/\/.+/.test(url)||key.length<20){ toast("Isi Project URL dan kunci anon dengan lengkap.","bad"); return; }
    CFG={url,key}; try{ localStorage.setItem(CFGKEY,JSON.stringify(CFG)); }catch(e){}
    render();
  },
  gantiKoneksi(){ try{ localStorage.removeItem(CFGKEY); localStorage.removeItem(SESKEY); }catch(e){}
    CFG=null; SESS=null; ME=null; DB=null; clearInterval(POLLER); renderSetup(); },
  async login(){
    const email=(($("#inEmail")||{}).value||"").trim(), pw=($("#inPass")||{}).value||"";
    if(!email||!pw){ toast("Email dan kata sandi wajib diisi.","bad"); return; }
    if(TURNSTILE_SITEKEY&&!CAPTCHA){ toast("Selesaikan verifikasi keamanan dulu.","bad"); return; }
    const b=$("#btnMasuk"); if(b){ b.disabled=true; b.textContent="Memeriksa…"; }
    try{
      await masuk(email,pw,CAPTCHA);
      await loadAll(); startPoll(); UI.page="dashboard"; render();
      toast("Selamat datang, "+ME.nama+".","good");
    }catch(e){
      CAPTCHA=null; toast(e.message,"bad");
      SESS=null; try{localStorage.removeItem(SESKEY);}catch(x){}
      render();
    }
  },
  async logout(){ await keluarSesi(); UI={page:"dashboard",filter:{},notifOpen:false,draft:null}; render(); },

  /* --- notifikasi --- */

    act(()=>rpc("mark_notif_read")).then(()=>{
      if(oid&&order(oid)) app.detail(oid); else { UI.notifOpen=false; render(); } }); },

        bayar_tipe:d.bayarTipe, top_hari:d.bayarTipe==="FULL"?null:(+d.topHari||30),
        dp_nominal:d.bayarTipe==="DP"?(+d.dpNominal||0):0}});
    }).then(ok=>{ if(!ok||!baru)return; UI.draft=null;
      toast("Sales order "+baru.no_so+" tersimpan — Level "+baru.level+".","good");
      app.detail(baru.id); setTimeout(()=>app.formBayar(baru.id),350); });
  },

    act(()=>rpc("submit_payment",{p_id:id,p_bukti:bukti,p_ket:ket}),
      "Bukti pembayaran dikirim ke Manajer Toko.").then(()=>{ UI.bayar=null; }); },
  setujuiManajer(id){ const o=order(id); if(!o)return;
    if(!confirm("Setujui pembayaran "+o.noSO+" sebesar "+rp(o.total)+"?\n\nPastikan uang benar-benar sudah masuk ke rekening perusahaan."))return;
    act(()=>rpc("manager_approve",{p_id:id}),"Pembayaran diverifikasi. Invoice sah terbit."); },
  formTolak(id){ const o=order(id); if(!o)return;
    modal("Kembalikan ke admin toko — "+esc(o.noSO),
      `<p style="margin-top:0">Tuliskan apa yang perlu diperbaiki. Alasan ini muncul di layar admin toko.</p>
       <label class="f"><span>Alasan penolakan</span><textarea class="i" id="tAlasan" rows="3"
         placeholder="Contoh: nominal transfer Rp 4.900.000 tidak sesuai total tagihan Rp 4.928.400"></textarea></label>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button>
       <button class="btn dgr" onclick="app.tolakManajer('${id}')">Kembalikan</button>`); },
  tolakManajer(id){ const a=(($("#tAlasan")||{}).value||"").trim();
    if(a.length<5){ toast("Tuliskan alasannya lebih jelas.","bad"); return; }
    this.closeModal();
    act(()=>rpc("manager_reject",{p_id:id,p_alasan:a}),"Pesanan dikembalikan ke admin toko."); },
  teruskanPR(id){ act(()=>rpc("forward_to_warehouse",{p_id:id}),
    "Diteruskan ke gudang sebagai Purchase Request."); },

  /* --- gudang --- */
  approve(id){ act(()=>rpc("approve_order",{p_id:id}),"Pesanan disetujui. Stok berkurang otomatis."); },
  formKirim(id){ const o=order(id); if(!o)return;
    modal("Input data pengiriman — "+esc(o.noSO),
      `<div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Kurir pengirim</span><select class="i" id="kKur">
          ${KURIR.map(k=>`<option value="${k.k}" ${o.kurir===k.k?"selected":""}>${esc(k.n)}</option>`).join("")}</select></label>
        <label class="f"><span>Nomor resi dari kurir / e-commerce</span>
          <input class="i mono" id="kAwb" placeholder="Salin persis dari aplikasi kurir" value="${esc(o.noAwb||"")}"></label></div>
       <label class="f"><span>Catatan pengiriman (opsional)</span><input class="i" id="kKet" value="${esc(o.ketKirim||"")}" placeholder="Contoh: 2 koli, diambil pukul 15.00"></label>
       <div style="background:#F7F9FB;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px">
         <div class="hint" style="margin-bottom:5px">Isi paket yang akan tercetak di label</div>
         ${o.items.map(it=>{const p=prod(it.productId)||{};return `<div class="row" style="justify-content:space-between;font-size:12.5px;padding:2px 0">
           <span>${esc(p.nama||"—")}</span><b class="mono">${nf(it.qty)} ${esc(p.sat||"")}</b></div>`}).join("")}
         <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-size:12.5px">
           <b>Total</b><b class="mono">${nf(totalQty(o))} pcs</b></div></div>
       <p class="hint">Nomor resi dibuat oleh kurir, bukan oleh sistem ini.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.simpanKirim('${id}')">Simpan &amp; cetak label</button>`); },
  simpanKirim(id){
    const k=($("#kKur")||{}).value, awb=(($("#kAwb")||{}).value||"").trim(), ket=($("#kKet")||{}).value||"";
    if(k!=="INTERNAL"&&awb.length<6){ toast("Nomor resi belum diisi dengan benar.","bad"); return; }
    this.closeModal();
    act(()=>rpc("ship_order",{p_id:id,p_kurir:k,p_awb:awb,p_ket:ket}))
      .then(ok=>{ if(!ok)return; toast("Data pengiriman tersimpan.","good");
        setTimeout(()=>app.printDoc("label",id),350); });
  },
  lacakKurir(id){ const o=order(id); if(!o)return; const k=kurir(o.kurir);
    const buka=()=>{ if(k.web) window.open(k.web,"_blank","noopener"); else toast("Kurir internal — tidak ada situs pelacakan.","bad"); };
    if(navigator.clipboard&&o.noAwb){ navigator.clipboard.writeText(o.noAwb)
      .then(()=>{ toast("Resi "+o.noAwb+" disalin. Tempel di situs "+k.n+".","good"); buka(); }).catch(buka); }
    else buka(); },
  selesai(id){ act(()=>rpc("complete_order",{p_id:id}),"Pesanan ditandai selesai."); },
  batal(id){ const o=order(id); if(!o)return;
    if(!confirm("Batalkan "+o.noSO+"? Stok yang sudah keluar tidak dikembalikan otomatis."))return;
    act(()=>rpc("cancel_order",{p_id:id}),"Pesanan dibatalkan."); },

  /* --- invoice --- */
  terbitkanInvoice(id){ act(()=>rpc("issue_invoice",{p_id:id}),"Invoice diterbitkan."); },
  lunas(id){ act(()=>rpc("mark_paid",{p_id:id}),"Invoice ditandai lunas."); },
  shareLink(id){ const o=order(id);
    modal("Bagikan invoice online",
      `<p>Pelanggan cukup membuka halaman ini, pilih tab <b>Cek invoice</b>, lalu memasukkan nomor berikut.</p>
       <div class="row" style="gap:10px;margin:12px 0"><input class="i mono" readonly value="${esc(o.invoice.no)}" onclick="this.select()"></div>`,
      `<button class="btn gh" onclick="app.closeModal()">Tutup</button><button class="btn pri" onclick="app.closeModal();app.printDoc('inv','${id}')">Cetak PDF sekarang</button>`); },

  /* --- master barang --- */
  newProduct(){ this.editProduct(null); },
  editProduct(id){ const p=id?prod(id):{sku:"",nama:"",kat:"",sat:"pcs",beli:0,jual:0,min:0,pusat:0};
    modal(id?"Ubah barang":"Tambah barang",
      `<div class="grid g2" style="gap:0 14px">
        <label class="f"><span>SKU</span><input class="i mono" id="pSku" value="${esc(p.sku)}"></label>
        <label class="f"><span>Kategori</span><input class="i" id="pKat" value="${esc(p.kat)}"></label></div>
       <label class="f"><span>Nama barang</span><input class="i" id="pNama" value="${esc(p.nama)}"></label>
       <div class="grid g4" style="gap:0 14px">
        <label class="f"><span>Satuan</span><input class="i" id="pSat" value="${esc(p.sat)}"></label>
        <label class="f"><span>Harga beli</span><input class="i" id="pBeli" type="number" value="${p.beli}"></label>
        <label class="f"><span>Harga jual (price list)</span><input class="i" id="pJual" type="number" value="${p.jual}"></label>
        <label class="f"><span>Harga bottom</span><input class="i" id="pBottom" type="number" value="${p.bottom||0}"></label></div>
       <label class="f"><span>Stok minimum</span><input class="i" id="pMin" type="number" value="${p.min}"></label>
       ${id?`<p class="hint" style="margin:0">Stok tidak diubah dari sini. Gunakan menu Barang Masuk / Keluar agar tercatat di riwayat mutasi.</p>`
        :`<label class="f"><span>Stok awal di gudang utama</span><input class="i" id="pPusat" type="number" value="0"></label>
          <p class="hint" style="margin:0">Stok awal dicatat sebagai barang masuk sehingga tetap ada jejaknya.</p>`}`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.saveProduct('${id||""}')">Simpan</button>`); },
  saveProduct(id){
    const g=x=>($("#"+x)||{}).value;
    const nama=(g("pNama")||"").trim(); if(!nama){ toast("Nama barang wajib diisi.","bad"); return; }
    const body={sku:(g("pSku")||"").trim()||("SKU-"+Date.now().toString(36).toUpperCase()),nama,
      kat:g("pKat")||"Umum",sat:g("pSat")||"pcs",beli:+g("pBeli")||0,jual:+g("pJual")||0,
      harga_bottom:+g("pBottom")||0,min_stok:+g("pMin")||0};
    const awal=id?0:(+g("pPusat")||0);
    this.closeModal();
    act(async()=>{
      if(id) await api("/rest/v1/products?id=eq."+id,{method:"PATCH",
        headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
      else{
        const baru=await api("/rest/v1/products",{method:"POST",
          headers:{Prefer:"return=representation"},body:JSON.stringify(body)});
        if(awal>0) await rpc("move_stock",{p_tipe:"MASUK",p_product:baru[0].id,p_qty:awal,
          p_lok:"HQ",p_oleh:"HQ",p_ket:"Stok awal"});
      }
    },"Data barang tersimpan."); },

  /* --- master toko --- */
  editStore(id){ const st=id?store(id):{kode:"",nama:"",alamat:"",telp:""};
    modal(id?"Ubah toko":"Tambah toko",
      `<div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Kode</span><input class="i mono" id="sKode" value="${esc(st.kode)}" placeholder="PLG"></label>
        <label class="f"><span>Nama toko</span><input class="i" id="sNama" value="${esc(st.nama)}"></label></div>
      <label class="f"><span>Alamat</span><input class="i" id="sAlamat" value="${esc(st.alamat||"")}"></label>
      <label class="f"><span>Telepon</span><input class="i" id="sTelp" value="${esc(st.telp||"")}"></label>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.saveStore('${id||""}')">Simpan</button>`); },
  saveStore(id){ const g=x=>($("#"+x)||{}).value;
    const body={kode:(g("sKode")||"").toUpperCase().trim(),nama:(g("sNama")||"").trim(),
      alamat:g("sAlamat")||"",telp:g("sTelp")||""};
    if(!body.nama||!body.kode){ toast("Kode dan nama toko wajib diisi.","bad"); return; }
    this.closeModal();
    act(()=>api(id?"/rest/v1/stores?id=eq."+id:"/rest/v1/stores",{method:id?"PATCH":"POST",
      headers:{Prefer:"return=representation"},body:JSON.stringify(body)}),"Data toko tersimpan."); },

  /* --- master pengguna --- */
  editUser(id){ const u=id?DB.users.find(x=>x.id===id):{id:"",nama:"",email:"",role:"toko",storeId:DB.stores[0]&&DB.stores[0].id};
    const roles=[["owner","Super Admin"],["toko","Admin Toko"],["manajer","Manajer Toko"],
      ["finance","Finance"],["gudang","Admin Gudang"],["sales","Sales Admin"]];
    modal(id?"Ubah pengguna":"Tambah pengguna",
      `${id?"":`<div style="background:#FFF8E6;border-left:3px solid var(--amber);padding:10px 12px;margin-bottom:14px;font-size:12.5px">
        <b>Buat akunnya dulu di Supabase.</b> Buka Authentication → Users → Add user, isi email dan kata sandi,
        centang Auto Confirm User. Salin <b>User UID</b> yang muncul, lalu tempel di kolom pertama di bawah.</div>
        <label class="f"><span>User UID dari Supabase</span><input class="i mono" id="uId" placeholder="00000000-0000-0000-0000-000000000000"></label>`}
       <div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Nama lengkap</span><input class="i" id="uNama" value="${esc(u.nama)}"></label>
        <label class="f"><span>Email</span><input class="i" id="uEmail" value="${esc(u.email||"")}" placeholder="nama@perusahaan.id"></label></div>
       <div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Peran</span><select class="i" id="uRole">
          ${roles.map(r=>`<option value="${r[0]}" ${u.role===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></label>
        <label class="f"><span>Toko penempatan</span><select class="i" id="uStore">
          <option value="">— tidak terikat toko —</option>
          ${DB.stores.map(st=>`<option value="${st.id}" ${u.storeId===st.id?"selected":""}>${esc(st.nama)}</option>`).join("")}</select></label></div>
       <p class="hint" style="margin:0">Admin toko wajib dipilihkan toko penempatan; ia hanya akan melihat pesanan tokonya sendiri.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.saveUser('${id||""}')">Simpan</button>`); },
  saveUser(id){ const g=x=>($("#"+x)||{}).value;
    const nama=(g("uNama")||"").trim(), email=(g("uEmail")||"").trim().toLowerCase(),
      role=g("uRole"), store_id=g("uStore")||null, uid=(g("uId")||"").trim();
    if(!nama){ toast("Nama wajib diisi.","bad"); return; }
    if(role==="toko"&&!store_id){ toast("Admin toko harus dipilihkan toko penempatan.","bad"); return; }
    if(!id&&!/^[0-9a-f-]{36}$/i.test(uid)){ toast("User UID dari Supabase belum benar.","bad"); return; }
    this.closeModal();
    act(()=>api(id?"/rest/v1/profiles?id=eq."+id:"/rest/v1/profiles",{method:id?"PATCH":"POST",
      headers:{Prefer:"return=representation"},
      body:JSON.stringify(id?{nama,email,role,store_id}:{id:uid,nama,email,role,store_id,aktif:true})}),
      "Data pengguna tersimpan."); },
  toggleUser(id){ const u=DB.users.find(x=>x.id===id); if(!u)return;
    if(u.id===ME.id){ toast("Akun sendiri tidak bisa dinonaktifkan.","bad"); return; }
    if(u.aktif&&u.role==="owner"&&DB.users.filter(x=>x.role==="owner"&&x.aktif).length<=1){
      toast("Minimal harus ada satu Super Admin aktif.","bad"); return; }
    act(()=>api("/rest/v1/profiles?id=eq."+id,{method:"PATCH",
      headers:{Prefer:"return=representation"},body:JSON.stringify({aktif:!u.aktif})}),
      "Status pengguna diperbarui."); },

  /* --- mutasi stok --- */
  mvTipeChange(){ const t=$("#mvTipe").value;
    $("#mvLokLabel").textContent = t==="MASUK"?"Masuk ke lokasi": t==="KELUAR"?"Diambil dari lokasi":"Dikirim ke toko"; },
  simpanMutasi(){
    const tipe=$("#mvTipe").value, pid=$("#mvProd").value, qty=Math.max(1,+$("#mvQty").value||0),
      lok=$("#mvLok").value, oleh=$("#mvOleh").value, ket=$("#mvKet").value;
    if(!pid){ toast("Pilih barang dulu.","bad"); return; }
    act(()=>rpc("move_stock",{p_tipe:tipe,p_product:pid,p_qty:qty,p_lok:lok,
      p_oleh:tipe==="TRANSFER"?"HQ":oleh,p_ket:ket||""}),"Mutasi tersimpan. Stok diperbarui."); },

  /* --- kelayakan usaha --- */
  feasSet(k,v){ const f={...(DB.feasib||feasibDefaults())};
    f[k]=Math.max(0,+v||0);
    if(k==="horizon") f.horizon=Math.min(120,Math.max(6,Math.round(f.horizon)));
    DB.feasib=f; render();
    api("/rest/v1/app_settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({id:"feasib",data:f})}).catch(e=>toast(e.message,"bad")); },
  feasReset(){ const f=feasibDefaults(); DB.feasib=f; render();
    api("/rest/v1/app_settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({id:"feasib",data:f})}).then(()=>toast("Asumsi disetel ulang dari data penjualan.","good"))
      .catch(e=>toast(e.message,"bad")); },

  /* --- dokumen --- */
  printDoc(kind,id){ const o=order(id); if(!o)return;
    const html = kind==="so"?docSO(o) : kind==="label"?docLabel(o) : docInv(o);
    const nama = kind==="so"?"Sales Order "+o.noSO : kind==="label"?"Label pengiriman "+(o.noAwb||o.noSO) : "Invoice "+o.invoice.no;
    $("#printArea").innerHTML=html;
    modal(nama,`<div class="previewbox">${html}</div>
      <p class="hint" style="margin:12px 0 0">Pilih <b>Simpan sebagai PDF</b> pada dialog cetak untuk menghasilkan file.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Tutup</button><button class="btn pri" onclick="window.print()">Cetak / simpan PDF</button>`); },
  closeModal(){ $("#modalHost").innerHTML=""; $("#printArea").innerHTML=""; }
};
window.app=app;
document.addEventListener("click",e=>{ if(UI.notifOpen&&!e.target.closest(".notif")&&!e.target.closest(".bell")){ UI.notifOpen=false; render(); } },true);
</script>
</body>
</html>
