<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dispatch Board — Sistem Inventory &amp; Sales Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Merah aksen tunggal, perak sebagai struktur, putih sebagai ruang.
     Merah sengaja dipakai sedikit agar layar tetap tenang dipandang seharian. */
  --red:      #E50112;
  --red-dk:   #B80010;
  --red-soft: #FDECEE;
  --graphite: #23262B;   /* panel gelap: layar masuk & kop dokumen */
  --graphite-2:#31353C;
  --ink:      #16181C;
  --muted:    #6E747E;
  --silver-6: #A8AEB8;
  --line:     #DCE0E6;
  --paper:    #F2F3F5;
  --card:     #ffffff;
  --ok:       #1F7A4D;
  --warn:     #A9741A;
  --alert:    #E50112;
  /* alias agar kode lama tetap hidup */
  --steel-900:#23262B;
  --steel-800:#2B2F35;
  --steel-700:#4A4F58;
  --steel-500:#8A9099;
  --amber:    #E50112;
  --amber-dk: #B80010;
  --signal:   #5B6068;
  /* Swiss: grotesk netral, sudut siku, hierarki dari ukuran dan tebal — bukan dari hiasan */
  --f-disp:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:0px;
  --r-kecil:2px;
  /* Lapisan kaca. Nilai putih dibuat tinggi (0.7+) supaya teks tetap pekat
     terbaca di layar murah dan di gudang yang terang. */
  --glass:        rgba(255,255,255,.72);
  --glass-strong: rgba(255,255,255,.86);
  --glass-dark:   rgba(255,255,255,.07);
  --glass-line:   rgba(255,255,255,.65);
  --glass-edge:   rgba(35,38,43,.09);
  --blur:         blur(16px) saturate(140%);
  --lift:         0 6px 24px rgba(35,38,43,.08), 0 1px 2px rgba(35,38,43,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  background:#F4F5F7;
  color:var(--ink);
  font-size:13.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:var(--f-disp);font-weight:700;letter-spacing:-.015em;text-transform:none;margin:0}
h2{font-weight:800}
.lb,th,.nav .grp,.kpi .lb{text-transform:uppercase;letter-spacing:.14em}
.mono,.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--red-dk)}
::selection{background:var(--red);color:#fff}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.gate{position:relative;z-index:1}
.setup{position:relative;z-index:1}
.rail{
  width:216px;flex:0 0 216px;background:#fff;color:var(--ink);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:16px 16px 14px;border-bottom:1px solid var(--line);position:relative}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .chip{width:28px;height:28px;border-radius:3px;background:var(--red);color:#fff;display:grid;place-items:center}
.brand .chip svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:1.6}
.brand .chip.logo{background:#fff !important;border:1px solid var(--line);padding:2px}
.brand .chip.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.gate .left .logobox{display:inline-block;background:#fff;border-radius:4px;padding:7px 11px;margin-bottom:16px}
.gate .left .logobox img{height:38px;display:block}
.brand h1{color:var(--ink);font-size:17px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav .grp{font-size:10px;letter-spacing:.16em;color:var(--silver-6);padding:13px 10px 5px;text-transform:uppercase;font-family:var(--f-disp);font-weight:600}
.nav button{
  width:100%;display:flex;align-items:center;gap:10px;text-align:left;
  background:none;border:0;color:#484D55;padding:8px 10px;border-radius:var(--r);font-size:13.5px;
}
.nav button:hover{background:#F0F1F4;color:var(--ink)}
.nav button.on{background:var(--red);color:#fff;font-weight:600;border-radius:0}
.nav button .ic{width:18px;text-align:center;color:var(--silver-6)}
.nav button.on .ic{color:#fff}
.nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:0 6px;font-family:"IBM Plex Mono"}
.nav button.on .badge{background:rgba(255,255,255,.28)}
.railfoot{padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--silver-6)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  color:var(--ink);padding:0 20px;height:58px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
}
.topbar .ttl{font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:12px;border-left:1px solid var(--line);padding-left:14px}
.spacer{flex:1}
.bell{position:relative;background:#F2F3F5;border:1px solid var(--line);color:var(--ink);width:36px;height:34px;border-radius:var(--r);font-size:15px}
.bell:hover{background:#E9EBEF}
.bell b{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;font-size:10.5px;border-radius:20px;padding:1px 5px;font-family:"IBM Plex Mono"}
.me{display:flex;align-items:center;gap:9px;background:#F2F3F5;border:1px solid var(--line);padding:4px 10px;border-radius:var(--r)}
.me .av{width:26px;height:26px;border-radius:3px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.me .nm{font-size:12.5px;line-height:1.15}
.me .rl{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.linkbtn{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}
.linkbtn:hover{color:var(--red)}

.wrap{padding:22px;max-width:1320px;width:100%}
.grid{gap:16px}

/* ---------- primitives ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:0}
.card>.hd{padding:13px 16px;border-bottom:1px solid var(--ink);display:flex;align-items:center;gap:10px}
.card>.hd h3{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.card>.bd{padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

.kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--steel-700);
  border-radius:0;padding:14px 16px}
.kpi .lb{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .vl{font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .ft{font-size:11.5px;color:var(--muted)}
.kpi{border-left-color:var(--silver-6)}
.kpi.amber{border-left-color:var(--red)} .kpi.alert{border-left-color:var(--red)} .kpi.ok{border-left-color:var(--ok)} .kpi.sig{border-left-color:var(--graphite)}

.btn{background:#fff;color:var(--ink);border:1px solid var(--ink);padding:7px 14px;border-radius:0;font-size:12.5px;font-weight:600;letter-spacing:-.01em}
.btn:hover{background:var(--ink);color:#fff}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--red-dk);border-color:var(--red-dk)}
.btn.gh{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.gh:hover{background:#fff;border-color:var(--ink);color:var(--ink)}
.btn.dgr{background:#fff;color:var(--red);border-color:#F2C2C6}
.btn.dgr:hover{background:var(--red-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

label.f{display:block;margin-bottom:11px}
label.f>span{display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:var(--f-disp);font-weight:600}
input.i,select.i,textarea.i{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
input.i:focus,select.i:focus,textarea.i:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:var(--red)}
input[type=number].i{font-family:"IBM Plex Mono"}

table{width:100%;border-collapse:collapse}
th{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#FAFAFB}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}

.tag{display:inline-block;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:0;border:1px solid}
.t-baru{background:#FBF3E4;border-color:#E3CFA4;color:#8A6316}
.t-diproses{background:#EFF1F4;border-color:#C6CCD5;color:#3D434C}
.t-keluar{background:#EDF6F0;border-color:#AFD4BE;color:#1F7A4D}
.t-dikirim{background:#F1F2F4;border-color:#C0C6CF;color:#4A4F58}
.t-selesai{background:#F4F5F7;border-color:var(--line);color:var(--muted)}
.t-batal{background:var(--red-soft);border-color:#F2BFC4;color:#B80010}
.t-flat{background:#F4F5F7;border-color:var(--line);color:var(--muted)}
.t-lunas{background:#EDF6F0;border-color:#AFD4BE;color:#1F7A4D}
.t-belum{background:var(--red-soft);border-color:#F2BFC4;color:#B80010}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--f-disp);font-size:17px;color:var(--ink);letter-spacing:.05em;text-transform:uppercase}

/* stepper / signature element */
.dispatch{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.dispatch .st{flex:1;padding:9px 12px;border-right:1px solid var(--line);position:relative;background:#F7F9FB}
.dispatch .st:last-child{border-right:0}
.dispatch .st .k{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-family:var(--f-disp);font-weight:600}
.dispatch .st .v{font-family:"IBM Plex Mono";font-size:12.5px;margin-top:2px;color:#9AA8B6}
.dispatch .st.done{background:#fff}
.dispatch .st.done .v{color:var(--ink)}
.dispatch .st.done .k{color:var(--ok)}
.dispatch .st.now{background:var(--red-soft)}
.dispatch .st.now .k{color:var(--red-dk)}
.dispatch .st.now:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red)}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 22px;border-left:1px solid var(--line);margin-left:5px}
.tl li:last-child{border-left-color:transparent;padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-5px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl li.hi:before{background:var(--red);border-color:var(--red)}
.tl .w{font-weight:600;font-size:13px}
.tl .m{font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono"}

.notif{position:absolute;right:20px;top:58px;width:344px;background:#fff;
  border:1px solid var(--ink);border-radius:0;
  box-shadow:0 12px 32px rgba(35,38,43,.14);z-index:60;overflow:hidden}
.notif .h{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.notif .it{padding:10px 12px;border-bottom:1px solid #EDF1F4;cursor:pointer}
.notif .it:hover{background:#F7F9FB}
.notif .it.un{background:var(--red-soft)}
.notif .it .t{font-size:12.8px}
.notif .it .d{font-size:11px;color:var(--muted);font-family:"IBM Plex Mono";margin-top:2px}

#modalWrap{position:fixed;inset:0;background:rgba(35,38,43,.38);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  z-index:100;display:grid;place-items:start center;padding:26px 14px;overflow-y:auto}
.modal{background:#fff;border-radius:0;width:100%;max-width:840px;border:1px solid var(--ink);
  box-shadow:0 24px 60px rgba(35,38,43,.22)}
.modal .mh{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mb{padding:16px;max-height:70vh;overflow:auto}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#F7F9FB}
.x{margin-left:auto;background:none;border:0;font-size:20px;color:var(--muted);line-height:1}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{background:rgba(35,38,43,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;padding:9px 16px;border-radius:var(--r);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);border-left:3px solid var(--red)}
.tst.bad{border-left-color:var(--alert)}
.tst.good{border-left-color:var(--ok)}

/* ---------- login / public ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
@media(max-width:900px){.gate{grid-template-columns:1fr}.gate .left{display:none}}
.gate .left{background:var(--graphite);color:#fff;padding:38px 42px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;
  overflow-y:auto;max-height:100vh}
.gate .left h2{font-size:37px;line-height:1.02;color:#fff;letter-spacing:.02em}
.gate .left p{color:#A9AEB6;max-width:44ch}
.gate .left .sub{color:#E8EAEE;font-size:15.5px;max-width:44ch;margin:10px 0 0}
.gate .left .spirit{border-left:3px solid var(--red);padding:2px 0 2px 14px;margin:18px 0 0;color:#B4B9C1;font-size:13px;max-width:46ch}
.quotebox{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:15px 17px;
  background:var(--glass-dark);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.quotebox q{quotes:none;display:block;color:#fff;font-size:14.5px;line-height:1.45}
.chain{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chain span{font-family:"IBM Plex Mono";font-size:11px;color:#D4D8DE;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  border-radius:2px;padding:4px 9px}
.chain b{color:var(--red);font-weight:400;align-self:center}
.closing{font-family:var(--f-disp);font-size:19px;letter-spacing:.09em;text-transform:uppercase;color:var(--red);
  border-top:1px solid #3A3E45;padding-top:14px;margin-top:16px}
.flowlist{list-style:none;padding:0;margin:22px 0 0}
.flowlist li{display:flex;gap:12px;padding:9px 0;border-top:1px solid #3A3E45;font-size:13px;color:#C9CDD3}
.flowlist li b{font-family:"IBM Plex Mono";color:var(--red);font-size:12px;padding-top:2px}
.gate .right{padding:42px;display:flex;flex-direction:column;justify-content:center;max-width:560px;width:100%}
.gate .right .glasspane{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);border-radius:12px;padding:28px;box-shadow:var(--lift)}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:0;overflow:hidden;margin-bottom:18px;background:#fff}
.tabs button{flex:1;border:0;background:transparent;padding:9px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--red);color:#fff;font-weight:600}
.userpick{display:grid;gap:6px;max-height:250px;overflow:auto;border:1px solid var(--glass-edge);border-radius:var(--r);padding:6px;background:rgba(255,255,255,.7)}
.userpick button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;padding:7px 9px;border-radius:var(--r);width:100%}
.userpick button:hover{background:#F4F7F9}
.userpick button.on{border-color:var(--red);background:var(--red-soft)}
.userpick .av{width:28px;height:28px;border-radius:3px;background:var(--steel-700);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.userpick .n{font-size:13px;font-weight:600}
.userpick .r{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---------- charts & analysis ---------- */
.chart{width:100%;height:auto;display:block}
.chart .ax{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:#8E949D}
.chart .axb{font-family:var(--f-disp);font-size:11px;fill:#5B6C7D;letter-spacing:.06em;text-transform:uppercase}
.chart rect:hover{opacity:.82}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:5px 13px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--red);color:#fff;font-weight:600}
.delta{font-family:"IBM Plex Mono";font-size:12px;font-weight:600}
.delta.up{color:var(--ok)} .delta.dn{color:var(--alert)} .delta.fl{color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mtable td{font-size:13px}
.mtable td.k{color:var(--muted);width:52%}
.mtable td.v{text-align:right;font-family:"IBM Plex Mono";font-weight:600}
.verdict{border:1px solid var(--line);border-left-width:4px;border-radius:var(--r);padding:14px 16px;background:#fff}
.verdict h3{font-size:19px}
.verdict.layak{border-left-color:var(--ok);background:#F1F8F4}
.verdict.hati{border-left-color:var(--warn);background:#FBF8F1}
.verdict.tidak{border-left-color:var(--red);background:var(--red-soft)}
.verdict p{margin:6px 0 0;font-size:13px}
.stackbar{display:flex;height:26px;border-radius:2px;overflow:hidden;border:1px solid var(--line)}
.stackbar div{display:grid;place-items:center;font-size:10.5px;color:#fff;font-family:"IBM Plex Mono"}
.hint{font-size:11.5px;color:var(--muted)}

/* ---------- unggah bukti ---------- */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;background:#F9FBFC;position:relative}
.drop.wajib{border-color:#F2BFC4;background:var(--red-soft)}
.drop.ada{border-style:solid;border-color:#AFD4BE;background:#F1F8F4;text-align:left;padding:11px}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop .ic{font-size:22px;color:var(--muted)}
.drop .t{font-size:13px;font-weight:600;margin-top:4px}
.buktirow{display:flex;gap:11px;align-items:center}
.buktithumb{width:52px;height:52px;border-radius:3px;object-fit:cover;border:1px solid var(--line);background:#fff;flex:0 0 52px}
.buktithumb.pdf{display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:13px;color:var(--alert)}
.buktibig{max-width:100%;border:1px solid var(--line);border-radius:var(--r)}


/* ---------- gerbang masuk: nozzle & gelembung perusahaan ---------- */
.gerbang{position:fixed;inset:0;z-index:300;background:#F4F5F7;display:flex;flex-direction:column;overflow:auto}

.gerbang::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(900px 540px at 72% 46%, rgba(244,245,247,.86), rgba(244,245,247,.42) 58%, transparent 78%)}
.gerbang>*{position:relative;z-index:1}
.gerbang .atas{border-bottom:1px solid var(--ink);padding:18px 32px;display:flex;align-items:center;gap:14px;background:#fff}
.gerbang .atas .mrk{width:30px;height:30px;background:var(--red);display:grid;place-items:center;padding:5px}
.gerbang .atas .mrk svg{stroke:#fff;fill:none;stroke-width:1.6}
.gerbang .atas h1{font-size:17px;font-weight:800;letter-spacing:-.02em}
.gerbang .atas small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.gerbang .isi{flex:1;display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:0}
@media(max-width:980px){.gerbang .isi{grid-template-columns:1fr}}
.gerbang .kiri{padding:48px 32px;border-right:1px solid var(--line);display:flex;flex-direction:column;
  justify-content:center;background:rgba(255,255,255,.72)}
.gerbang .kiri .rule{width:72px;height:5px;background:var(--red);margin-bottom:24px}
.gerbang .kiri h2{font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.035em}
.gerbang .kiri p{color:var(--muted);max-width:34ch;margin-top:16px;font-size:14px}
.gerbang .kiri .no{font-family:"IBM Plex Mono";font-size:11px;color:var(--silver-6);margin-top:32px;letter-spacing:.1em}
.gerbang .kanan{padding:40px 36px 52px;display:flex;flex-direction:column;justify-content:center}
.gerbang .kanan .nzkop{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:var(--muted)}
.gerbang .kanan .nzkop svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.3}
.gerbang .kanan .nzkop span{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}

/* Kartu perusahaan: persegi panjang seragam, disusun rapi dalam kisi. */
.kartukop{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:720px}
@media(max-width:1180px){.kartukop{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kartukop{grid-template-columns:1fr}}
.kpr{position:relative;background:#fff;border:1px solid var(--line);border-radius:0;
  aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px 14px;cursor:pointer;overflow:hidden;
  opacity:0;transform:translateY(14px);animation:masuk .5s cubic-bezier(.2,.8,.3,1) forwards;
  transition:border-color .16s,box-shadow .16s,transform .16s}
.kpr::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--w);transform:scaleX(0);
  transform-origin:left;transition:transform .2s}
.kpr:hover{border-color:var(--w);transform:translateY(-2px)}
.kpr:hover::before{transform:scaleX(1)}
.kpr img{max-width:72%;max-height:46%;object-fit:contain;display:block}
.kpr .ic{width:30px;height:30px;stroke:var(--w);fill:none;stroke-width:1.5}
.kpr .nm{font-size:13px;font-weight:700;letter-spacing:-.01em;text-align:center;line-height:1.2}
.kpr .kd{font-family:"IBM Plex Mono";font-size:9.5px;color:var(--silver-6);letter-spacing:.16em}
/* Efek neon saat kartu diklik */
.kpr.neon{animation:neon .55s ease-out forwards;border-color:var(--w)}
.kpr.neon::before{transform:scaleX(1)}
@keyframes neon{
  0%{box-shadow:0 0 0 0 var(--w), 0 0 0 0 var(--w) inset; transform:translateY(-2px) scale(1)}
  35%{box-shadow:0 0 26px 5px var(--w), 0 0 42px 10px var(--w), 0 0 0 2px var(--w) inset;
      transform:translateY(-3px) scale(1.035)}
  100%{box-shadow:0 0 14px 2px var(--w), 0 0 0 1px var(--w) inset; transform:translateY(-2px) scale(1.01)}
}
@keyframes masuk{to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){
  .kpr{animation:none;opacity:1;transform:none}
  .kpr.neon{animation:none;box-shadow:0 0 0 2px var(--w)}
}
.gerbang .kaki{border-top:1px solid var(--line);padding:14px 32px;display:flex;gap:16px;align-items:center;
  font-size:11.5px;color:var(--muted);background:#fff}

/* ================= GERBANG & LAYAR MASUK — rancangan DIPO ================= */
:root{ --g2-ink:#15171A; --g2-red:#E8192C; --g2-paper:#F3F4F7; --g2-line:#E5E7EC;
  --g2-r:14px; --g2-rs:10px;
  --g2-sh:0 1px 2px rgba(20,22,26,.04), 0 6px 18px rgba(20,22,26,.07);
  --g2-shh:0 2px 6px rgba(20,22,26,.07), 0 18px 40px rgba(20,22,26,.13); }
.gshell{position:fixed;inset:0;z-index:300;background:#fff;display:flex;flex-direction:column;
  overflow:auto;perspective:1600px}

/* ---------- bilah atas ---------- */
.gtop{background:#fff;border-bottom:1px solid var(--g2-line);display:flex;align-items:center;gap:20px;
  padding:14px 30px;flex:0 0 auto;position:sticky;top:0;z-index:6}
.gtop .dipo{display:flex;align-items:center;gap:10px}
.gtop .dipo .bar{width:4px;height:34px;background:var(--g2-red);border-radius:2px}
.gtop .dipo b{display:block;font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--g2-red);line-height:1}
.gtop .dipo span{display:block;font-size:11px;font-weight:700;color:var(--g2-ink);margin-top:2px}
.gtop .sep{width:1px;height:34px;background:var(--g2-line)}
.gtop h1{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.gtop small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#9499A2;margin-top:3px}
.gtop .kanan{margin-left:auto;display:flex;align-items:center;gap:16px}

/* ---------- lapisan kaca ---------- */
.glass{background:#fff;border:1px solid var(--line)}
.bgfx{display:none}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass,.card,.rail,.topbar,.modal,.notif,.seg,.tabs{background:#fff !important}
}
@media(max-width:820px){ :root{ --blur:blur(10px) saturate(130%) } }

/* ---------- elemen sparepart ---------- */
.spart{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.spart-empty{width:46px;height:46px;margin:0 auto 10px;color:var(--silver-6)}
.spart-wm{position:absolute;pointer-events:none;color:#fff;opacity:.07}
.gate .left{position:relative;overflow:hidden}
.gate .left>*{position:relative;z-index:1}
.brandmark{position:absolute;right:10px;top:14px;width:34px;height:34px;color:var(--red);opacity:.13}

/* ---------- setup & sinkronisasi ---------- */
.setup{min-height:100vh;display:grid;place-items:center;padding:26px 14px;background:var(--graphite)}
.setupcard{width:100%;max-width:640px;background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);
  border-radius:10px;box-shadow:0 26px 70px rgba(0,0,0,.34)}
.steps{margin:0 0 16px;padding-left:20px}
.steps li{margin-bottom:12px;font-size:13.5px}
.codebox{position:relative;margin-top:8px}
.codebox pre{background:var(--graphite);color:#D2D6DC;padding:13px 14px;border-radius:var(--r);overflow:auto;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;margin:0}
.codebox .copy{position:absolute;top:8px;right:8px}
.syncwrap{display:inline-flex;align-items:center;gap:6px;background:#F2F3F5;border:1px solid var(--line);color:var(--muted);
  padding:5px 10px;border-radius:var(--r);font-size:11.5px;font-family:"IBM Plex Mono"}
.syncwrap i{width:7px;height:7px;border-radius:50%;display:block}

/* ---------- printed documents ---------- */
#printArea{display:none}
.doc{background:#fff;color:#000;font-family:"IBM Plex Sans",sans-serif;font-size:12px}
.doc .dhead{display:flex;justify-content:space-between;border-bottom:2px solid #E50112;padding-bottom:8px;margin-bottom:12px}
.doc h2{font-size:22px;letter-spacing:.06em}
.doc .co{font-size:11px;line-height:1.4}
.doc table{width:100%;border-collapse:collapse;margin:10px 0}
.doc th,.doc td{border:1px solid #000;padding:5px 7px;font-size:11.5px}
.doc th{background:#eee;color:#000;text-transform:uppercase;font-size:10.5px}
.doc .sign{display:flex;gap:40px;margin-top:26px;font-size:11px;text-align:center}
.doc .sign div{flex:1}
.doc .sign .ln{margin-top:52px;border-top:1px solid #000;padding-top:3px}
.doc .kv{font-family:"IBM Plex Mono";font-size:11.5px}
.label{width:100mm;border:2px solid #000;margin:0 auto;font-family:"IBM Plex Sans",sans-serif;font-size:11px;background:#fff;color:#000}
.label .lrow{border-bottom:1px solid #000}
.label .lrow:last-child{border-bottom:0}
.label .lcour{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#000;color:#fff}
.label .lbig{font-family:var(--f-disp);font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.label .lawb{font-family:"IBM Plex Mono";font-size:17px;font-weight:600;letter-spacing:.14em;margin-top:2px}
.label .lgrid{display:flex}
.label .lgrid>div{flex:1;padding:8px 10px;font-size:10.5px;line-height:1.4}
.label .lgrid>div:first-child{border-right:1px solid #000;font-size:11.5px}
.label .lk{font-family:var(--f-disp);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#444;margin-bottom:2px}
.label .litem{width:100%;border-collapse:collapse}
.label .litem td{border-top:1px solid #ccc;padding:4px 10px;font-size:10.5px}
.label .lfoot{display:flex;justify-content:space-between;padding:5px 10px;font-size:9px;color:#333}
.label .bars{height:36px;justify-content:center}
.bars{display:flex;gap:1px;height:44px;align-items:flex-end;margin:8px 0 3px}
.bars i{display:block;background:#000;height:100%}
.perf{border-top:1px dashed #000;margin:9px 0}
.previewbox{background:#8E949D;padding:20px;border-radius:var(--r);overflow:auto}
.previewbox .doc{padding:22px;max-width:780px;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.previewbox .label{background:#fff}

@media print{
  body{background:#fff;background-image:none}
  .bgfx{display:none !important}
  .card,.kpi,.modal{background:#fff !important;backdrop-filter:none !important;box-shadow:none !important}
  .shell,#toast,#modalWrap,.gate{display:none !important}
  #printArea{display:block !important}
  #printArea .doc{padding:0}
  @page{size:A4;margin:14mm}
}

<script>
"use strict";
const DBKEY="dispatch:db:v1";
let DB=null, ME=null, UI={page:"dashboard", notifOpen:false, filter:{}, draft:null};

/* ============ util ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp "+(Math.round(n||0)).toLocaleString("id-ID");
const nf=n=>(n||0).toLocaleString("id-ID");
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
function fdate(iso,withTime){ if(!iso)return "—"; const d=new Date(iso);
  const s=d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
  return withTime? s+" "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}) : s; }
function toast(msg,kind){ const t=document.createElement("div"); t.className="tst "+(kind||"");
  t.textContent=msg; $("#toast").appendChild(t); setTimeout(()=>t.remove(),3200); }
function seq(key,prefix){ const d=new Date(); const n=(DB.counters[key]=(DB.counters[key]||0)+1);
  return prefix+"/"+d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(n).padStart(4,"0"); }

/* ============ backend: Supabase Auth + PostgREST ============ */
/* Isi bila ingin kredensial ditanam permanen. Kunci anon memang bersifat publik —
   keamanan sekarang ditegakkan oleh Row Level Security di database, bukan oleh
   menyembunyikan kunci ini. */
const BAKED={url:"", key:""};
/* Site key Cloudflare Turnstile. Kosongkan bila captcha belum diaktifkan di Supabase. */
const TURNSTILE_SITEKEY="";
/* Penanda lingkungan. Kosongkan untuk sistem sungguhan.
   Isi "SANDBOX" (atau "UJI COBA") pada salinan yang dipakai berlatih dan mencoba perubahan —
   seluruh layar akan diberi pita belang agar tidak mungkin tertukar dengan data operasional. */
const ENV_NAMA="";
/* Identitas visual tiap toko. Kunci = kode toko seperti yang Anda isi di menu Toko & Pengguna.
   Warna hanya dipakai untuk penanda identitas (lambang, pita, badge) — tombol tindakan tetap merah
   di semua toko agar bahasa antarmukanya seragam.
   Bagikan alamat berparameter ke tiap toko, contoh: .../RumahDiesel/?toko=PLG */
/*  logo   : alamat gambar (unggah ke bucket bukti-pesanan lalu tempel tautannya,
             atau taruh file di repository GitHub lalu pakai nama filenya saja, mis. "logo-plg.png").
             Kosongkan untuk memakai lambang nozzle bawaan.
    judul  : headline besar di layar masuk toko tersebut.
    sub    : kalimat di bawah headline.
    sparepart : gambar latar layar masuk — nozzle | plunger | piston | gear | filter | turbo | engine  */
/* Identitas toko kini diatur dari menu Toko & Pengguna, tersimpan di database.
   Daftar di bawah hanya cadangan bila kolom di database masih kosong. */
const TOKO_CADANGAN={ nozzle:"nozzle", warna:"#E50112" };
let BRAND=null;    /* identitas perusahaan terpilih sebelum login */
let BRANDS=[];     /* seluruh perusahaan yang boleh mengakses dashboard */
let JALUR=null;    /* "head" atau "gudang" — jalur masuk tim internal */
const JALUR_INFO={
  head:  {nama:"Head Level", sub:"Super Admin & Manajer Toko", warna:"#23262B", ikon:"perisai",
          judul:"Satu Layar untuk<br>Semua Perusahaan<i>.</i>",
          tagline:"Omzet, piutang, master barang, dan pengaturan sistem dari satu tempat."},
  gudang:{nama:"Gudang", sub:"Admin Gudang", warna:"#1F6FB2", ikon:"kotak",
          judul:"Barang Keluar<br>Tepat dan Tercatat<i>.</i>",
          tagline:"Purchase request, penyiapan barang, pengiriman, dan stock opname."}
};
const PARAM_TOKO=(()=>{ try{ return (new URLSearchParams(location.search).get("toko")||"").toUpperCase(); }catch(e){ return ""; } })();

/* toko yang sedang aktif: sesudah masuk pakai data asli, sebelum masuk pakai parameter alamat */
function tokoAktif(){
  if(ME&&ME.storeId&&DB) return store(ME.storeId);
  if(!ME&&JALUR&&JALUR_INFO[JALUR]) return {kode:JALUR.toUpperCase(),nama:JALUR_INFO[JALUR].nama,
    warna:JALUR_INFO[JALUR].warna,logo:"",sparepart:"gear",judulLanding:"",tagline:""};
  return BRAND;
}
const warnaToko=t=>(t&&t.warna)||TOKO_CADANGAN.warna;
/* identitas yang dipakai di kepala dokumen: data toko, jatuh ke data perusahaan bila kosong */
const TPL_BAWAAN={kop:"",kop_tinggi:22,pakai_kop:false,stempel:"",kertas:"A4",margin:14,
  warna:"#E50112",judul_invoice:"INVOICE",judul_proforma:"PERFORMA INVOICE",judul_so:"SALES ORDER",
  ttd_kiri:"Hormat kami",ttd_kanan:"Diterima oleh",
  syarat:"Barang yang sudah dibeli tidak dapat ditukar tanpa persetujuan tertulis.",
  tampil_npwp:true,tampil_spek:true,tampil_ttd:true};
/* Template berlaku berlapis: bawaan sistem -> template global -> template khusus toko. */
function tpl(storeId){
  const st=storeId?store(storeId):null;
  return {...TPL_BAWAAN, ...((DB.template)||{}), ...((st&&st.template)||{})};
}
/* Ukuran kertas dan margin dipasang pada @page saat dokumen dicetak. */
function pasangKertas(t){
  let el=document.getElementById("gayaCetak");
  if(!el){ el=document.createElement("style"); el.id="gayaCetak"; document.head.appendChild(el); }
  el.textContent=`@media print{ @page{ size:${t.kertas==="A5"?"A5":"A4"}; margin:${+t.margin||14}mm } }`;
}
function kopDok(o){
  const st=store(o.storeId)||{}, c=DB.company||{};
  return {
    nama:   st.namaLegal||st.nama||c.nama||"Perusahaan",
    alamat: st.alamat||c.alamat||"",
    telp:   st.telp||c.telp||"",
    email:  st.email||c.email||"",
    npwp:   st.npwp||"",
    logo:   st.logo||"",
    rekening: st.rekening||"",
    footer: st.footerDoc||""
  };
}

const CFGKEY="dispatch:cfg", SESKEY="dispatch:sess";
let CFG=null, SESS=null, SYNC="idle", LASTSYNC=null, POLLER=null, CAPTCHA=null;

function loadCfg(){
  if(BAKED.url&&BAKED.key) return {url:BAKED.url,key:BAKED.key};
  try{ const c=JSON.parse(localStorage.getItem(CFGKEY)||"null"); if(c&&c.url&&c.key) return c; }catch(e){}
  return null;
}
const base=()=>CFG.url.replace(/\/+$/,"");
function authHeader(){
  return {apikey:CFG.key, "Content-Type":"application/json",
    Authorization:"Bearer "+((SESS&&SESS.access_token)||CFG.key)};
}
function pesanRapi(status,teks){
  try{ const j=JSON.parse(teks);
    if(j.message) return j.message;
    if(j.error_description) return j.error_description;
    if(j.msg) return j.msg;
  }catch(e){}
  if(status===401||status===403) return "Anda tidak berhak melakukan tindakan ini.";
  if(status===404) return "Tabel atau fungsi belum dibuat di database.";
  return "Kesalahan server ("+status+").";
}
async function api(path,opt={},ulang){
  const r=await fetch(base()+path,{...opt,headers:{...authHeader(),...(opt.headers||{})}});
  if(r.status===401&&!ulang&&SESS&&SESS.refresh_token){
    if(await perbaruiSesi()) return api(path,opt,true);
  }
  if(!r.ok) throw new Error(pesanRapi(r.status, await r.text().catch(()=>"")));
  if(r.status===204) return null;
  const t=await r.text().catch(()=>"");          /* balasan kosong itu wajar untuk POST/PATCH */
  if(!t.trim()) return null;
  try{ return JSON.parse(t); }catch(e){ return null; }
}
const rest=q=>api("/rest/v1/"+q);
const rpc=(fn,body)=>api("/rest/v1/rpc/"+fn,{method:"POST",body:JSON.stringify(body||{})});

/* --- sesi --- */
async function masuk(email,password,captcha){
  const body={email,password};
  if(captcha) body.gotrue_meta_security={captcha_token:captcha};
  const r=await fetch(base()+"/auth/v1/token?grant_type=password",{method:"POST",
    headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||"Email atau kata sandi salah.");
  SESS=j; try{ localStorage.setItem(SESKEY,JSON.stringify(j)); }catch(e){}
}
async function perbaruiSesi(){
  try{
    const r=await fetch(base()+"/auth/v1/token?grant_type=refresh_token",{method:"POST",
      headers:{apikey:CFG.key,"Content-Type":"application/json"},
      body:JSON.stringify({refresh_token:SESS.refresh_token})});
    if(!r.ok) return false;
    SESS=await r.json(); localStorage.setItem(SESKEY,JSON.stringify(SESS)); return true;
  }catch(e){ return false; }
}
/* --- lupa kata sandi: kirim tautan pemulihan ke email --- */
async function kirimPemulihan(email,captcha){
  const tujuan=location.origin+location.pathname+location.search;
  const body={email};
  if(captcha) body.gotrue_meta_security={captcha_token:captcha};
  const r=await fetch(base()+"/auth/v1/recover?redirect_to="+encodeURIComponent(tujuan),{method:"POST",
    headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){ const j=await r.json().catch(()=>({}));
    throw new Error(j.error_description||j.msg||j.message||"Gagal mengirim tautan pemulihan."); }
}
/* --- tetapkan kata sandi baru, memakai token dari tautan email atau sesi aktif --- */
async function gantiSandi(baru,token){
  const t=token||(SESS&&SESS.access_token);
  if(!t) throw new Error("Sesi tidak valid. Buka ulang tautan dari email.");
  const r=await fetch(base()+"/auth/v1/user",{method:"PUT",
    headers:{apikey:CFG.key,Authorization:"Bearer "+t,"Content-Type":"application/json"},
    body:JSON.stringify({password:baru})});
  if(!r.ok){ const j=await r.json().catch(()=>({}));
    throw new Error(j.error_description||j.msg||j.message||"Gagal mengganti kata sandi."); }
}
/* --- baca token pemulihan dari alamat setelah pengguna mengklik tautan email --- */
function bacaTokenPemulihan(){
  try{
    const h=(location.hash||"").replace(/^#/,"");
    if(!h) return null;
    const q=new URLSearchParams(h);
    if(q.get("error_description")) return {galat:q.get("error_description").replace(/\+/g," ")};
    if(q.get("type")==="recovery"&&q.get("access_token")) return {token:q.get("access_token")};
    return null;
  }catch(e){ return null; }
}
function bersihkanHash(){ try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){ location.hash=""; } }

async function keluarSesi(){
  try{ await fetch(base()+"/auth/v1/logout",{method:"POST",headers:authHeader()}); }catch(e){}
  SESS=null; ME=null; DB=null; clearInterval(POLLER);
  try{ localStorage.removeItem(SESKEY); }catch(e){}
}

/* --- muat seluruh data yang boleh dilihat pengguna ini --- */
async function loadAll(){
  const [stores,profiles,products,stock,orders,moves,notifs,settings,customers,returns]=await Promise.all([
    rest("stores?select=*&order=kode.asc"),
    rest("profiles?select=*&order=nama.asc"),
    rest("products?select=*&order=nama.asc"),
    rest("stock?select=*"),
    rest("orders?select=*&order=tanggal.desc&limit=800"),
    rest("stock_moves?select=*&order=ts.desc&limit=800"),
    rest("notifications?select=*&order=ts.desc&limit=80"),
    rest("app_settings?select=*"),
    rest("customers?select=*&order=nama.asc"),
    rest("returns?select=*&order=tanggal.desc&limit=300")
  ]);
  const uid=SESS.user.id;
  const st={}; stock.forEach(x=>{ (st[x.product_id]=st[x.product_id]||{})[x.lok]=+x.qty; });
  const cfg={}; (settings||[]).forEach(r=>cfg[r.id]=r.data);
  DB={
    stores:stores.map(s=>({id:s.id,kode:s.kode,nama:s.nama,alamat:s.alamat||"",telp:s.telp||"",
      logo:s.logo||"",warna:s.warna||"#E50112",sparepart:s.sparepart||"nozzle",
      judulLanding:s.judul_landing||"",tagline:s.tagline||"",namaLegal:s.nama_legal||"",
      email:s.email||"",npwp:s.npwp||"",rekening:s.rekening||"",footerDoc:s.footer_doc||"",
      watermark:(s.template&&s.template.watermark)||((cfg.template||{}).watermark)||"",
      template:s.template||null})),
    users:profiles.map(u=>({id:u.id,nama:u.nama,role:u.role,storeId:u.store_id,
      aktif:u.aktif!==false,email:u.email||"",user:u.email||u.nama})),
    customers:(customers||[]).map(c=>({id:c.id,kode:c.kode,nama:c.nama,tipe:c.tipe,telp:c.telp||"",
      alamat:c.alamat||"",npwp:c.npwp||"",creditLimit:+c.credit_limit,topDefault:c.top_default,
      status:c.status,catatan:c.catatan||"",saldo:+(c.saldo_kredit||0)})),
    returns:(returns||[]).map(x=>({id:x.id,no:x.no_retur,orderId:x.order_id,storeId:x.store_id,
      customerId:x.customer_id,tanggal:x.tanggal,oleh:x.diajukan_oleh||"",alasan:x.alasan||"",
      items:(x.items||[]).map(i=>({productId:i.product_id,qty:+i.qty,harga:+i.harga})),
      nilai:+x.nilai,skema:x.skema,status:x.status,bukti:x.bukti,
      disetujuiOleh:x.disetujui_oleh,tglSetuju:x.tgl_setuju,catatan:x.catatan||"",log:x.log||[]})),
    products:products.map(p=>({id:p.id,sku:p.sku,nama:p.nama,kat:p.kat||"Umum",sat:p.sat||"pcs",

/* --- pembungkus setiap tindakan yang mengubah data --- */
async function act(fn,sukses){
  setSync("saving");
  try{ await fn(); await loadAll(); render(); if(sukses) toast(sukses,"good"); return true; }
  catch(e){ setSync("ok"); toast(e.message||"Gagal menyimpan.","bad"); render(); return false; }
}
function setSync(s){ SYNC=s; if(s==="ok")LASTSYNC=new Date();
  const el=$("#syncdot"); if(el) el.outerHTML=syncBadge(); }
function syncBadge(){
  const m={ok:["#1F7A4D","Tersambung"],saving:["#A9741A","Menyimpan…"],off:["#E50112","Terputus"],idle:["#A8AEB8","—"]}[SYNC]||["#A8AEB8","—"];
  return `<span id="syncdot" class="syncwrap"><i style="background:${m[0]}"></i>${m[1]}${LASTSYNC&&SYNC==="ok"?" · "+LASTSYNC.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}):""}</span>`;
}
function startPoll(){
  clearInterval(POLLER);
  POLLER=setInterval(async()=>{
    if(document.hidden||$("#modalWrap")||!SESS) return;
    const a=document.activeElement;
    if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    const sebelum=DB?DB.orders.length+"|"+DB.notifs.filter(n=>!n.read).length:"";
    try{ await loadAll();
      if(DB.orders.length+"|"+DB.notifs.filter(n=>!n.read).length!==sebelum) render(); else setSync("ok");
    }catch(e){ setSync("off"); }
  },20000);
}

const SEL_BIL="nav button, .topbar .ttl, .topbar .sub, th, label.f>span, button, a.btn, .tag, .kpi .lb, "
 +".card>.hd h3, .card>.hd h4, .seg button, .tabs button, .empty .big, .mtable td.k, .lvl h4, "

function applyBil(root){
  if(!BIL||!root) return;
  root.querySelectorAll(SEL_BIL).forEach(el=>{
    if(el.closest&&el.closest('[data-nobil]')) return;
    el.childNodes.forEach(n=>{
      if(n.nodeType!==3) return;
      const k=n.nodeValue.trim();
      if(!k||k.length>44||k.indexOf("/")>-1&&ZH[k]===undefined) return;
      const z=ZH[k];
      if(z){ n.nodeValue=n.nodeValue.replace(k,k+" / "+z); return; }
      for(const [pola,ubah] of ZHR){
        const c=k.match(pola);
        if(c){ n.nodeValue=n.nodeValue.replace(k,ubah.apply(null,c)); return; }
      }
    });
  });
}

/* ============ bukti pemesanan ============ */
const BUCKET="bukti-pesanan", MAXFILE=10*1024*1024;
function kompresGambar(file){
  return new Promise((res,rej)=>{
    if(!file.type.startsWith("image/")) return res(file);
    const fr=new FileReader(), img=new Image();
    fr.onerror=()=>rej(new Error("File tidak terbaca."));
    fr.onload=()=>{ img.src=fr.result; };
    img.onerror=()=>rej(new Error("File bukan gambar yang valid."));
    img.onload=()=>{
      const max=1400; let w=img.width, h=img.height;
      const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej(new Error("Gagal memproses gambar.")),"image/jpeg",0.72);
    };
    fr.readAsDataURL(file);
  });
}
const blobToDataURL=b=>new Promise((res,rej)=>{const f=new FileReader();
  f.onload=()=>res(f.result); f.onerror=()=>rej(new Error("Gagal membaca file.")); f.readAsDataURL(b);});
async function unggahBukti(file){
  if(file.size>MAXFILE) throw new Error("Ukuran file maksimal 10 MB.");
  const blob=await kompresGambar(file);
  const ext=blob.type==="application/pdf"?"pdf":(blob.type==="image/jpeg"?"jpg":(file.name.split(".").pop()||"dat"));
  const meta={nama:file.name,tipe:blob.type,ukuran:blob.size,ts:now(),oleh:ME?ME.nama:"-"};
  const path="so/"+Date.now()+"-"+uid().slice(0,6)+"."+ext;
  const r=await fetch(base()+"/storage/v1/object/"+BUCKET+"/"+path,{method:"POST",
    headers:{apikey:CFG.key,Authorization:"Bearer "+((SESS&&SESS.access_token)||CFG.key),
      "Content-Type":blob.type||"application/octet-stream"},body:blob});
  if(!r.ok){ const t=await r.text().catch(()=>"");
    throw new Error(r.status===404?"Bucket bukti-pesanan belum dibuat di Supabase.":"Gagal unggah ("+r.status+") "+t.slice(0,120)); }
  return {...meta,url:base()+"/storage/v1/object/public/"+BUCKET+"/"+path};
}

const ymd=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function rpShort(n){const a=Math.abs(n);
  if(a>=1e9)return "Rp "+(n/1e9).toFixed(1).replace(".",",")+" M";
  if(a>=1e6)return "Rp "+(n/1e6).toFixed(1).replace(".",",")+" jt";
  if(a>=1e3)return "Rp "+Math.round(n/1e3)+" rb";
  return "Rp "+Math.round(n);}
function periodKey(d,per){const x=new Date(d);
  if(per==="bulan")return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");
  if(per==="minggu"){const t=new Date(x);t.setDate(t.getDate()-((t.getDay()+6)%7));return ymd(t);}
  return ymd(x);}
function periodLabel(d,per){const x=new Date(d);
  if(per==="bulan")return BLN[x.getMonth()]+" "+String(x.getFullYear()).slice(2);
  if(per==="minggu")return x.getDate()+" "+BLN[x.getMonth()];
  return x.getDate()+"/"+(x.getMonth()+1);}
function lastPeriods(per,n){const out=[],base=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(base);
    if(per==="bulan"){d.setDate(1);d.setMonth(base.getMonth()-i);}
    else if(per==="minggu"){d.setDate(base.getDate()-i*7);d.setDate(d.getDate()-((d.getDay()+6)%7));}
    else d.setDate(base.getDate()-i);
    out.push({key:periodKey(d,per),label:periodLabel(d,per),v:0,hpp:0,n:0});}
  return out;}
const orderHPP=o=>o.items.reduce((a,it)=>{const p=prod(it.productId);return a+(p?p.beli*it.qty:0)},0);
function revSeries(per){
  const n=per==="hari"?30:12, arr=lastPeriods(per,n), map={};
  arr.forEach(b=>map[b.key]=b);
  DB.orders.filter(o=>o.status!=="BATAL").forEach(o=>{
    const b=map[periodKey(o.tanggal,per)]; if(!b)return;
    b.v+=o.sub; b.hpp+=orderHPP(o); b.n++;});
  return arr;}
function revByStore(days){
  const lim=Date.now()-days*86400000, m={};
  DB.orders.filter(o=>o.status!=="BATAL"&&new Date(o.tanggal).getTime()>=lim).forEach(o=>{
    m[o.storeId]=m[o.storeId]||{v:0,laba:0,n:0};
    m[o.storeId].v+=o.sub; m[o.storeId].laba+=o.sub-orderHPP(o); m[o.storeId].n++;});
  return DB.stores.map(s=>({s,...(m[s.id]||{v:0,laba:0,n:0})})).sort((a,b)=>b.v-a.v);}
function topProducts(days,limit){
  const lim=Date.now()-days*86400000, m={};
  DB.orders.filter(o=>o.status!=="BATAL"&&new Date(o.tanggal).getTime()>=lim).forEach(o=>o.items.forEach(it=>{
    m[it.productId]=m[it.productId]||{qty:0,v:0,laba:0};
    const p=prod(it.productId); m[it.productId].qty+=it.qty; m[it.productId].v+=it.qty*it.harga;
    m[it.productId].laba+=it.qty*(it.harga-(p?p.beli:0));}));
  return Object.keys(m).map(id=>({p:prod(id)||{nama:"—",sku:""},...m[id]}))
    .sort((a,b)=>b.v-a.v).slice(0,limit||6);}

/* --- SVG charts --- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const m=v/e;
  const s=m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10;return s*e;}
function chartBars(items,color,accent){
  const W=760,H=250,PL=76,PR=12,PT=14,PB=38, iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...items.map(i=>i.v))), bw=iw/Math.max(1,items.length);
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=max*(1-i/4);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#E4E7EB"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(v)}</text>`;}
  const step=Math.ceil(items.length/13);
  let b="";
  items.forEach((it,i)=>{const h=ih*(it.v/max),x=PL+i*bw+bw*0.18,w=bw*0.64,y=PT+ih-h;
    const last=i===items.length-1;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,it.v>0?1.5:0).toFixed(1)}" fill="${last&&accent?accent:color}" rx="1"><title>${esc(it.label)} — ${rp(it.v)} · ${it.n} order</title></rect>`;
    if(items.length<=13||i%step===0||last)
      b+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(it.label)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${b}</svg>`;}
function chartLines(labels,series){
  const W=760,H=260,PL=76,PR=12,PT=14,PB=48, iw=W-PL-PR, ih=H-PT-PB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));
  const X=i=>PL+(labels.length<2?iw/2:iw*i/(labels.length-1)), Y=v=>PT+ih-ih*(v/max);
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4;
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#E4E7EB"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(max*(1-i/4))}</text>`;}
  const step=Math.ceil(labels.length/12);
  labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1)
    g+=`<text x="${X(i).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(l)}</text>`;});
  let p="";
  series.forEach(s=>{const d=s.vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    if(s.fill) p+=`<path d="${d} L${X(s.vals.length-1).toFixed(1)} ${PT+ih} L${X(0).toFixed(1)} ${PT+ih} Z" fill="${s.color}" opacity=".10"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.dash?1.8:2.4}" ${s.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${p}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;}
function chartCum(vals,labels){
  const W=760,H=240,PL=76,PR=12,PT=14,PB=38, iw=W-PL-PR, ih=H-PT-PB;
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0), span=niceMax(Math.max(mx,-mn)||1);
  const zero=PT+ih*(span/(span*2)), sc=ih/(span*2), bw=iw/vals.length;
  let g="";
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=span*(1-i/2);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="${Math.abs(v)<1e-6?"#A8AEB8":"#E4E7EB"}"/>
        <text x="${PL-8}" y="${(y+4).toFixed(1)}" text-anchor="end" class="ax">${rpShort(v)}</text>`;}
  let b="";
  vals.forEach((v,i)=>{const h=Math.abs(v)*sc,x=PL+i*bw+bw*0.2,w=bw*0.6,y=v>=0?zero-h:zero;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" fill="${v>=0?"#1F7A4D":"#E50112"}" rx="1"><title>${esc(labels[i])}: ${rp(v)}</title></rect>`;
    if(i%Math.ceil(vals.length/12)===0||i===vals.length-1)
      b+=`<text x="${(PL+i*bw+bw/2).toFixed(1)}" y="${H-PB+16}" text-anchor="middle" class="ax">${esc(labels[i])}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet">${g}${b}</svg>`;}

/* --- kelayakan usaha --- */
function feasibDefaults(){
  const b=revSeries("bulan").slice(-4,-1);
  const avg=b.length?b.reduce((a,x)=>a+x.v,0)/b.length:180000000;
  const hpp=b.length?b.reduce((a,x)=>a+x.hpp,0)/b.length:0;
  const margin=avg>0?Math.round((1-hpp/avg)*1000)/10:25;
  return {investasi:Math.round(avg*2.5/1e7)*1e7||450000000, fixed:Math.round(avg*margin/100*0.55/1e6)*1e6||45000000,
    margin:margin||25, rev0:Math.round(avg/1e6)*1e6||180000000, growth:2,
    horizon:36, disc:12, pajak:22, hariKerja:26};
}
function feasibCalc(f){
  const dm=Math.pow(1+f.disc/100,1/12)-1, cf=[-f.investasi];
  const rows=[];
  let rev=f.rev0;
  for(let m=0;m<f.horizon;m++){
    const laba=rev*f.margin/100, ebt=laba-f.fixed, tax=ebt>0?ebt*f.pajak/100:0, net=ebt-tax;
    rows.push({m,rev,hpp:rev-laba,laba,ebt,net,biaya:(rev-laba)+f.fixed});
    cf.push(net); rev*=1+f.growth/100;
  }
  const npv=cf.reduce((a,c,i)=>a+c/Math.pow(1+dm,i),0);
  const pv=cf.slice(1).reduce((a,c,i)=>a+c/Math.pow(1+dm,i+1),0);
  const cum=[]; let s=-f.investasi; cf.slice(1).forEach(c=>{s+=c;cum.push(s)});
  let payback=null;
  for(let i=0;i<cum.length;i++) if(cum[i]>=0){const prev=i?cum[i-1]:-f.investasi;
    payback=i+(prev<0?(-prev)/(cum[i]-prev):0); break;}
  const npvAt=r=>cf.reduce((a,c,i)=>a+c/Math.pow(1+r,i),0);
  let irr=null;
  if(npvAt(0)>0){let lo=0,hi=1;
    while(npvAt(hi)>0&&hi<10)hi*=2;
    if(npvAt(hi)<=0){for(let i=0;i<160;i++){const mid=(lo+hi)/2; if(npvAt(mid)>0)lo=mid;else hi=mid;} irr=(lo+hi)/2;}}
  const irrY=irr==null?null:(Math.pow(1+irr,12)-1)*100;
  const bepBulan=f.margin>0?f.fixed/(f.margin/100):Infinity;
  const totalRev=rows.reduce((a,r)=>a+r.rev,0), totalNet=rows.reduce((a,r)=>a+r.net,0);
  let verdict,vc,alasan;
  if(npv>0&&irrY!=null&&irrY>f.disc&&payback!=null&&payback<=f.horizon*0.6){verdict="LAYAK DIJALANKAN";vc="layak";
    alasan="NPV positif, IRR di atas biaya modal, dan modal kembali sebelum "+Math.ceil(f.horizon*0.6)+" bulan.";}
  else if(npv>0){verdict="LAYAK BERSYARAT";vc="hati";
    alasan="Proyeksi menguntungkan, tetapi pengembalian modal lambat sehingga sensitif jika omzet meleset.";}
  else {verdict="BELUM LAYAK";vc="tidak";
    alasan="Nilai sekarang arus kas lebih kecil dari investasi. Perlu menaikkan omzet, menaikkan margin, atau memangkas biaya tetap.";}
  return {rows,cum,npv,pv,irrY,payback,bepBulan,bepHari:bepBulan/f.hariKerja,totalRev,totalNet,
    pi:f.investasi>0?pv/f.investasi:0,roi:f.investasi>0?totalNet/f.investasi*100:0,verdict,vc,alasan,dm};
}

function kreditCust(cid){
  const os=DB.orders.filter(o=>o.customerId===cid
    && !["BATAL","MENUNGGU_BAYAR","DITOLAK_MANAJER"].includes(o.status)
    && ["DP","TEMPO"].includes(o.bayarTipe) && sisaTagihan(o)>0);
  const now=Date.now();
  let piutang=0, overdue=0, hari=0;
  os.forEach(o=>{ const s=sisaTagihan(o); piutang+=s;
    if(o.tempoBayar&&new Date(o.tempoBayar).getTime()<now){ overdue+=s;
      hari=Math.max(hari,Math.floor((now-new Date(o.tempoBayar).getTime())/86400000)); } });
  return {piutang,overdue,hari,faktur:os.length,list:os};
}

function splash(t,sub){ $("#app").innerHTML=`<div class="empty" style="padding-top:90px"><div class="big">${esc(t)}</div><p>${esc(sub||"")}</p></div>`; }
(async function boot(){
  if(ENV_NAMA){
    document.body.classList.add("sandbox");
    $("#envbar").outerHTML=`<div class="envbar"><span>${esc(ENV_NAMA)}</span>`
      +`<span>Data di sini bukan data sungguhan</span><span>${esc(ENV_NAMA)}</span></div>`;
    document.title=ENV_NAMA+" — "+document.title;
  }
  splash("Menyambung…");
  const c=loadCfg();
  if(!c){ renderSetup(); return; }
  CFG=c;
  const pem=bacaTokenPemulihan();
  if(pem){ bersihkanHash(); renderResetSandi(pem.token,pem.galat); return; }
  try{
    const j=await api("/rest/v1/store_branding?select=*&order=nama.asc");
    BRANDS=(j||[]).map(b=>({kode:b.kode,nama:b.nama,logo:b.logo||"",warna:b.warna||"#E50112",
      sparepart:b.sparepart||"nozzle",judulLanding:b.judul_landing||"",tagline:b.tagline||""}));
    if(PARAM_TOKO) BRAND=BRANDS.find(b=>b.kode.toUpperCase()===PARAM_TOKO)||null;
  }catch(e){ BRANDS=[]; }
  try{ SESS=JSON.parse(localStorage.getItem(SESKEY)||"null"); }catch(e){ SESS=null; }
  try{ BIL=localStorage.getItem("dispatch:bil")==="1"; }catch(e){}
  if(!SESS){ render(); return; }
  try{ await loadAll(); startPoll(); render(); }
  catch(e){ SESS=null; try{localStorage.removeItem(SESKEY);}catch(x){} render();
    if(!/Sesi|401/.test(e.message)) toast(e.message,"bad"); }
})();

  if(!ME||!DB){
    if(!SESS&&!BRAND&&!JALUR&&BRANDS.length){ $("#app").innerHTML=gerbangView(); pasang3D(); return; }

    + (UI.notifOpen?notifPanel():"");

/* ---------- penyusun berkas ---------- */
function angkaCsv(v){
  if(typeof v==="number") return String(v).replace(".",",");   /* desimal gaya Indonesia */
  const t=String(v==null?"":v);
  return /[";\n]/.test(t) ? '"'+t.replace(/"/g,'""')+'"' : t;
}
function unduhBerkas(isi,nama,tipe){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([isi],{type:tipe}));
  a.download=nama; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function eksporExcel(d){
  const baris=d.baris();
  const isi="\ufeff"+[d.kolom,...baris].map(r=>r.map(angkaCsv).join(";")).join("\r\n");
  unduhBerkas(isi, d.nama+"-"+new Date().toISOString().slice(0,10)+".csv","text/csv;charset=utf-8");
  toast(d.judul+" diekspor — "+nf(baris.length)+" baris.","good");
}

      <div class="co" style="text-align:right">${nf(baris.length)} baris</div></div>
    <table style="font-size:9.5px"><thead><tr>
      ${d.kolom.map((k,i)=>`<th style="${angka(i)?"text-align:right":""}">${esc(k)}</th>`).join("")}

function cekHarga(p,harga){
  if(!p||!(p.jual>0)||!terikatBatas()) return null;
  if(harga>hargaMax(p)) return {jenis:"tinggi",batas:hargaMax(p)};
  if(harga<hargaMin(p)) return {jenis:"rendah",batas:hargaMin(p)};
  return null;
}
const diskonItem=(p,harga)=>(p&&p.jual>0)?Math.round((p.jual-harga)/p.jual*1000)/10:0;
const BATAS_ALERT=10;
/* Batas maksimal diskon per barang. Admin toko dan sales tidak boleh melampauinya;
   Super Admin dan Manajer Toko dikecualikan karena harus ada jalan sah untuk kasus khusus. */
const batasDiskon=()=>{ const v=+(((DB||{}).kredit||{}).diskon_max_l2); return v>0?v:10; };
const terikatBatas=()=>["toko","sales"].includes((ME||{}).role);
const hargaMin=p=>(p&&p.jual>0)?Math.round(p.jual*(1-batasDiskon()/100)):0;
const hargaMax=p=>(p&&p.jual>0)?p.jual:0;
const CJK=/[\u3400-\u4dbf\u4e00-\u9fff\u3040-\u30ff]/;
const adaMandarin=t=>CJK.test(t||"");
/* Entri beraksara Mandarin ditampilkan berdampingan dengan padanan Indonesianya.
   Berlaku untuk semua peran; padanan diisi Super Admin atau Manajer Toko. */
function dwiTeks(asli,padanan,kecil){
  if(!asli) return "—";
  if(!adaMandarin(asli)) return esc(asli);
  return `<span class="zh">${esc(asli)}</span>`
    + (padanan?` <span class="sl">/</span> ${esc(padanan)}`
      :` <span class="tag t-baru" style="font-size:10px">terjemahan belum diisi</span>`)
    + (kecil?"":"");
}
const persenBottom=p=>(p.jual>0&&p.bottom>0)?Math.round((p.jual-p.bottom)/p.jual*1000)/10:0;
/* ---------- Overview pelanggan ----------
   Pelanggan baru = pesanan pertamanya jatuh di periode ini.
   Pelanggan lama = sudah pernah memesan sebelum periode ini.
   Keduanya dibandingkan dari sisi jumlah maupun sumbangan ke omzet,
   supaya terlihat pasar mana yang sebenarnya menggerakkan pendapatan. */
function hitungPelanggan(hari){
  const batas=Date.now()-hari*86400000;
  const sah=DB.orders.filter(o=>o.status!=="BATAL");
  const pertama={};
  sah.forEach(o=>{ if(!o.customerId) return;
    const t=new Date(o.tanggal).getTime();
    if(!pertama[o.customerId]||t<pertama[o.customerId]) pertama[o.customerId]=t; });
  const dalam=sah.filter(o=>new Date(o.tanggal).getTime()>=batas&&o.customerId);
  const akt={};
  dalam.forEach(o=>{ const r=akt[o.customerId]=akt[o.customerId]||{omzet:0,trx:0};
    r.omzet+=o.total; r.trx++; });
  let baru={n:0,omzet:0,trx:0}, lama={n:0,omzet:0,trx:0};
  Object.keys(akt).forEach(id=>{
    const k=(pertama[id]>=batas)?baru:lama;
    k.n++; k.omzet+=akt[id].omzet; k.trx+=akt[id].trx; });
  const totOmzet=baru.omzet+lama.omzet, totN=baru.n+lama.n;
  return {baru,lama,totOmzet,totN,hari,
    pangsaBaru: totOmzet?baru.omzet/totOmzet*100:0,
    pangsaLama: totOmzet?lama.omzet/totOmzet*100:0,
    avgBaru: baru.n?baru.omzet/baru.n:0,
    avgLama: lama.n?lama.omzet/lama.n:0};
}

function revenueBlock(){
  const per=UI.filter.per||"hari";
  const ser=revSeries(per);
  const curr=ser[ser.length-1], prev=ser[ser.length-2]||{v:0};
  const d=prev.v?((curr.v-prev.v)/prev.v*100):0;
  const dCls=d>0.5?"up":d<-0.5?"dn":"fl", dTxt=(d>0?"▲ ":d<0?"▼ ":"■ ")+Math.abs(d).toFixed(1)+"%";
  const win=ser.reduce((a,x)=>a+x.v,0), winHpp=ser.reduce((a,x)=>a+x.hpp,0), winN=ser.reduce((a,x)=>a+x.n,0);
  const marginPct=win?((win-winHpp)/win*100):0;
  const nama={hari:"Hari ini",minggu:"Minggu ini",bulan:"Bulan ini"}[per];
  const sblm={hari:"kemarin",minggu:"minggu lalu",bulan:"bulan lalu"}[per];
  const rentang={hari:"30 hari terakhir",minggu:"12 minggu terakhir",bulan:"12 bulan terakhir"}[per];
  const byStore=revByStore(per==="hari"?30:per==="minggu"?84:365);
  const maxS=Math.max(1,...byStore.map(x=>x.v));
  const top=topProducts(per==="hari"?30:90,6);
  const seg=(v,l)=>`<button class="${per===v?"on":""}" onclick="app.setPer('${v}')">${l}</button>`;
  return `
  <div class="card" style="margin-bottom:14px">
    <div class="hd"><h3>Revenue</h3>
      <span class="hint">${rentang} · di luar PPN &amp; ongkir, pesanan batal tidak dihitung</span>
      <div class="seg" style="margin-left:auto">${seg("hari","Harian")}${seg("minggu","Mingguan")}${seg("bulan","Bulanan")}</div></div>
    <div class="bd">
      <div class="grid g4" style="margin-bottom:16px">
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-disp);font-weight:600">${nama}</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(curr.v)}</div>
          <div class="delta ${dCls}">${dTxt} <span style="color:var(--muted);font-weight:400">vs ${sblm} (${rp(prev.v)})</span></div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-disp);font-weight:600">Total ${rentang}</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(win)}</div>
          <div class="hint">${nf(winN)} order</div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-disp);font-weight:600">Laba kotor</div>
          <div class="mono" style="font-size:25px;font-weight:600;color:var(--ok)">${rp(win-winHpp)}</div>
          <div class="hint">margin ${marginPct.toFixed(1)}% · HPP ${rpShort(winHpp)}</div></div>
        <div><div class="lb" style="font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--f-disp);font-weight:600">Rata-rata per order</div>
          <div class="mono" style="font-size:25px;font-weight:600">${rp(winN?win/winN:0)}</div>
          <div class="hint">${(winN/Math.max(1,ser.length)).toFixed(1)} order per ${per}</div></div>
      </div>
      ${chartBars(ser,"#9AA0A9","#E50112")}
    </div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="hd"><h3>Revenue per toko</h3><span class="hint" style="margin-left:auto">${per==="hari"?"30 hari":per==="minggu"?"12 minggu":"12 bulan"}</span></div><div class="bd">
      ${byStore.map((x,i)=>`<div style="margin-bottom:11px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px">
          <b>${esc(x.s.nama)}</b><span class="mono" style="font-size:12.5px">${rp(x.v)} · laba ${rpShort(x.laba)}</span></div>
        <div style="height:9px;background:#EDF1F4;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${(x.v/maxS*100).toFixed(1)}%;background:${["#E50112","#23262B","#6E747E","#A8AEB8","#C7CBD2"][i]||"#C7CBD2"}"></div></div>
        <div class="hint">${x.n} order · kontribusi ${(win?x.v/byStore.reduce((a,y)=>a+y.v,0)*100:0).toFixed(1)}%</div></div>`).join("")}
    </div></div>
    <div class="card"><div class="hd"><h3>Barang penyumbang omzet terbesar</h3></div>
      <div class="tw"><table><thead><tr><th>Barang</th><th class="r">Qty</th><th class="r">Omzet</th><th class="r">Laba kotor</th></tr></thead><tbody>
      ${top.length?top.map(t=>`<tr><td><b>${esc(t.p.nama)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(t.p.sku)}</div></td>
        <td class="r mono">${nf(t.qty)}</td><td class="r mono">${rp(t.v)}</td><td class="r mono" style="color:var(--ok)">${rp(t.laba)}</td></tr>`).join("")
        :`<tr><td colspan="4"><div class="empty">Belum ada penjualan.</div></td></tr>`}
      </tbody></table></div></div>
  </div>`;
}

function pAnalisis(){
  const f=DB.feasib||feasibDefaults();
  const c=feasibCalc(f);
  const labels=c.rows.map(r=>"B"+(r.m+1));
  const field=(k,l,suf,step)=>`<label class="f"><span>${l}</span>
    <div class="row" style="flex-wrap:nowrap"><input class="i mono" type="number" step="${step||1}" value="${f[k]}" onchange="app.feasSet('${k}',this.value)">
    ${suf?`<span class="hint" style="white-space:nowrap">${suf}</span>`:""}</div></label>`;
  const bepMonth=c.rows.findIndex(r=>r.rev>=c.bepBulan);
  const strukturBiaya=[{l:"HPP barang",v:c.rows[0].hpp,c:"#23262B"},{l:"Biaya tetap",v:f.fixed,c:"#A8AEB8"},
    {l:"Laba bersih",v:Math.max(0,c.rows[0].net),c:"#E50112"}];
  const tb=strukturBiaya.reduce((a,x)=>a+x.v,0)||1;
  const skenario=[-20,-10,0,10,20].map(p=>{const g={...f,rev0:f.rev0*(1+p/100)};const r=feasibCalc(g);
    return {p,npv:r.npv,pb:r.payback,irr:r.irrY,v:r.verdict};});

      <div><h3>${c.verdict}</h3><p>${esc(c.alasan)}</p></div>
      <div style="text-align:right"><div class="hint">NPV ${f.horizon} bulan</div>
        <div class="mono" style="font-size:24px;font-weight:600">${rp(c.npv)}</div></div></div>
  </div>
  <div class="grid" style="grid-template-columns:320px 1fr;gap:14px">
    <div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Asumsi</h3>
        <button class="btn gh sm" style="margin-left:auto" onclick="app.feasReset()">Ambil dari data</button></div><div class="bd">
        ${field("investasi","Investasi awal","Rp",1000000)}
        ${field("rev0","Omzet bulan pertama","Rp",1000000)}
        ${field("growth","Pertumbuhan omzet","% / bulan",0.5)}
        ${field("margin","Margin kotor","%",0.5)}
        ${field("fixed","Biaya tetap per bulan","Rp",1000000)}
        ${field("pajak","Pajak penghasilan","%",1)}
        ${field("disc","Biaya modal (discount rate)","% / tahun",0.5)}
        ${field("horizon","Horizon proyeksi","bulan",6)}
        ${field("hariKerja","Hari kerja per bulan","hari",1)}
        <p class="hint" style="margin:0">Nilai awal diambil dari rata-rata 3 bulan penjualan nyata di sistem. Ubah sesuai rencana Anda — grafik langsung menyesuaikan.</p>
      </div></div>
      <div class="card"><div class="hd"><h3>Indikator kelayakan</h3></div><div class="bd" style="padding:4px 0">
        <table class="mtable"><tbody>
        ${[["NPV (nilai sekarang bersih)",rp(c.npv)],
           ["IRR (per tahun)",c.irrY==null?"—":c.irrY.toFixed(1)+"%"],
           ["Profitability Index",c.pi.toFixed(2)+"×"],
           ["Payback period",c.payback==null?"> "+f.horizon+" bulan":c.payback.toFixed(1)+" bulan"],
           ["ROI total "+f.horizon+" bulan",c.roi.toFixed(0)+"%"],
           ["BEP omzet per bulan",rp(c.bepBulan)],
           ["BEP omzet per hari kerja",rp(c.bepHari)],
           ["Tercapai pada bulan ke-",bepMonth<0?"belum tercapai":bepMonth+1]]
          .map(r=>`<tr><td class="k">${r[0]}</td><td class="v">${r[1]}</td></tr>`).join("")}
        </tbody></table></div></div>
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Proyeksi omzet vs total biaya</h3>
        <span class="hint" style="margin-left:auto">titik potong = break even</span></div><div class="bd">
        ${chartLines(labels,[
          {name:"Omzet",color:"#23262B",vals:c.rows.map(r=>r.rev),fill:true},
          {name:"Total biaya (HPP + tetap)",color:"#E50112",vals:c.rows.map(r=>r.biaya)},

      </div></div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Arus kas kumulatif</h3>
        <span class="hint" style="margin-left:auto">merah = modal belum kembali</span></div><div class="bd">
        ${chartCum(c.cum,labels)}

      <div class="grid g2">

          </tbody></table></div>
          <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Menguji apa yang terjadi bila omzet meleset dari rencana. Bila skenario −20% masih positif, rencana relatif tahan guncangan.</p></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px"><div class="hd"><h3>Proyeksi laba-rugi ringkas</h3>
        <span class="hint" style="margin-left:auto">per 6 bulan</span></div>
        <div class="tw"><table><thead><tr><th>Periode</th><th class="r">Omzet</th><th class="r">HPP</th><th class="r">Laba kotor</th><th class="r">Biaya tetap</th><th class="r">Laba bersih</th></tr></thead><tbody>
        ${Array.from({length:Math.ceil(f.horizon/6)},(_,i)=>{const g=c.rows.slice(i*6,i*6+6);
          const S=k=>g.reduce((a,r)=>a+r[k],0);
          return `<tr><td><b>Bulan ${i*6+1}–${Math.min(i*6+6,f.horizon)}</b></td>
            <td class="r mono">${rp(S("rev"))}</td><td class="r mono">${rp(S("hpp"))}</td>
            <td class="r mono">${rp(S("laba"))}</td><td class="r mono">${rp(f.fixed*g.length)}</td>

        </tbody></table></div>
        <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Model ini menyederhanakan: penyusutan, modal kerja, dan piutang belum dihitung terpisah. Gunakan sebagai alat bantu diskusi, bukan pengganti studi kelayakan formal.</p></div>
      </div>
    </div>
  </div>`;
}

function pInventory(){

  const view=UI.filter.invView||"daftar";
  const hal=UI.filter.invHal||1, PER=60;
  const list=DB.products.filter(p=>!q||[p.nama,p.namaMarket,p.sku,p.spesifikasi,p.posisi,p.kat,p.namaId,p.spekId,p.merek]

  const hh=Math.min(hal,nHal), mulai=(hh-1)*PER, tampil=list.slice(mulai,mulai+PER);

      Bottom = batas harga terendah; di bawahnya pesanan masuk Level 3.
      ${can("lihatBottom")?"Bottom Price dan persennya hanya terlihat oleh Super Admin dan Manajer Toko."
        :"Serial, nama, spesifikasi, stok, harga jual, dan remark dapat dilihat semua peran; perubahannya oleh Super Admin dan Manajer Toko."}
      ${DB.products.some(p=>adaMandarin(p.nama)||adaMandarin(p.spesifikasi))?"Entri beraksara Mandarin ditampilkan berdampingan dengan padanan Indonesianya.":""}
    </div></div>`;
}

  return `<div class="card" style="margin-bottom:14px;border-left:3px solid var(--red)">

    ${t.map(o=>{const sisa=sisaTempo(o);
      return `<tr><td class="mono">${esc(o.noSO)}</td><td>${esc(o.cust.nama)}</td>
      <td style="font-size:12px">${esc(BAYAR[o.bayarTipe]||"—")}
        ${o.bayarTipe==="DP"&&o.status==="MENUNGGU_BAYAR"&&sisa!==null?`<div class="hint" style="color:${sisa<0?"var(--red)":sisa<=3?"var(--warn)":"var(--muted)"}">${sisa<0?"lewat tempo "+(-sisa)+" hari":"jatuh tempo "+sisa+" hari lagi"}</div>`:""}</td>

      <td><div class="row">
        ${o.status==="INVOICE_VALID"

      </div>${o.status==="DITOLAK_MANAJER"&&o.alasanTolak?`<div class="hint" style="color:var(--alert);margin-top:3px">Ditolak: ${esc(o.alasanTolak)}</div>`:""}</td></tr>`}).join("")}
    </tbody></table></div></div>`;
}

    ${list.map(o=>`<tr><td class="mono">${esc(o.noSO)}</td><td>${fdate(o.tanggal)}</td><td>${esc(store(o.storeId).nama)}</td>
      <td>${esc(o.cust.nama)}</td>
      <td style="font-size:11.5px;max-width:230px">${o.items.slice(0,2).map(it=>esc(((prod(it.productId)||{}).nama||"—").slice(0,26))+" <b>×"+it.qty+"</b>").join("<br>")}${o.items.length>2?`<div style="color:var(--muted)">+${o.items.length-2} barang lain</div>`:""}</td>
      ${can("lihatHarga")?`<td class="r mono">${rp(o.total)}</td>`:""}<td>${tag(o.status)}</td>
      <td style="font-size:11.5px">${o.kanal==="MARKETPLACE"
        ?`<b>${esc(o.marketplace)}</b><div class="mono hint">${esc(o.noOrderMp)}</div>`:`<span class="hint">Offline</span>`}</td>
      <td class="mono" style="font-size:11px">${o.noAwb?esc(kurir(o.kurir).k)+"<div style='color:var(--muted)'>"+esc(o.noAwb)+"</div>":"—"}</td>
      <td class="r"><button class="btn gh sm" onclick="app.detail('${o.id}')">Buka</button></td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><div class="big">Belum ada sales order</div><p>${can("buatSO")?"Gunakan menu Buat Sales Order untuk memulai.":"Menunggu order dari toko."}</p></div>`}</div></div>`;
}

  const rows=d.items.map((it,i)=>{const p=prod(it.productId), a=avail(p,d.sumber), kurang=it.qty>a;
    return `<tr><td>

      <div style="font-size:11px;color:${kurang?"var(--alert)":"var(--muted)"};margin-top:3px" class="mono">Tersedia: ${nf(a)} ${esc(p.sat)}${kurang?" · stok kurang":""}</div></td>
      <td style="width:92px"><input class="i" type="number" min="1" value="${it.qty}" onchange="app.itemQty(${i},this.value)"></td>

      <td style="width:186px">${(()=>{const dmin=hargaMin(p), salah=cekHarga(p,it.harga), ds=diskonItem(p,it.harga);

  const sub=d.items.reduce((a,i)=>a+i.qty*i.harga,0);

  const notaLanggar=terikatBatas()&&dNota>batasDiskon();

        <div><span style="display:block;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-family:var(--f-disp);font-weight:600">Bukti pemesanan pelanggan — wajib</span>
        ${d.bukti?`<div class="drop ada"><div class="buktirow">
            ${d.bukti.tipe==="application/pdf"?`<div class="buktithumb pdf">PDF</div>`:`<img class="buktithumb" src="${esc(d.bukti.url)}" alt="bukti">`}

              <div class="hint">${Math.round(d.bukti.ukuran/1024)} KB · terunggah</div></div>
            <button class="btn gh sm" onclick="app.hapusBukti()">Ganti</button></div></div>`

            <div class="hint">Screenshot chat WA, PO pelanggan, atau pesanan marketplace · JPG/PNG/PDF maks 10 MB</div></div>`}
        </div>

    </div></div>
    <div>

        <button class="btn gh sm" style="margin-left:auto" onclick="app.editCustomer('')">+ Baru</button></div><div class="bd">

          const lebih = d.bayarTipe==="DP" && dp>tot;
