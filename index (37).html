/* ---------- Menu Engineering Analysis ----------
   Dua sumbu: jumlah transaksi (popularitas) dan laba kotor per unit (profitabilitas).
   Pembatasnya memakai rata-rata, cara yang lazim dipakai pada metode ini. */
const KUADRAN={
  STAR:   {l:"Stars",       sub:"Laba tinggi · transaksi tinggi", warna:"#1F7A4D", bg:"#F1F8F4",
           saran:"Pertahankan ketersediaan dan mutu. Jangan turunkan harga — di sinilah uang Anda."},
  PLOW:   {l:"Plow Horses", sub:"Laba rendah · transaksi tinggi", warna:"#A9741A", bg:"#FBF8F1",
           saran:"Laris tapi tipis. Naikkan harga sedikit, tekan harga beli, atau jual sepaket dengan barang bermargin tinggi."},
  PUZZLE: {l:"Puzzles",     sub:"Laba tinggi · transaksi rendah", warna:"#23262B", bg:"#F4F5F7",
           saran:"Menguntungkan tapi jarang laku. Tawarkan lebih aktif, perbaiki penempatan rak, atau tinjau harganya."},
  DOG:    {l:"Dogs",        sub:"Laba rendah · transaksi rendah", warna:"#E50112", bg:"#FDECEE",
           saran:"Tidak laku dan tidak menguntungkan. Pertimbangkan hentikan pembelian ulang atau habiskan stoknya."}
};
function dataGrowth(hari){
  const lim=Date.now()-hari*86400000;
  const os=DB.orders.filter(o=>o.status!=="BATAL"&&new Date(o.tanggal).getTime()>=lim);
  const m={};
  os.forEach(o=>o.items.forEach(it=>{
    const pr=prod(it.productId); if(!pr) return;
    const r=m[it.productId]=m[it.productId]||{p:pr,trx:0,qty:0,omzet:0,laba:0};
    r.trx++; r.qty+=it.qty; r.omzet+=it.qty*it.harga;
    r.laba+=it.qty*(it.harga-(pr.beli||0));
  }));
  const rows=Object.values(m);
  if(!rows.length) return {rows:[],avgTrx:0,avgLaba:0,totOmzet:0,totLaba:0};
  const avgTrx=rows.reduce((a,r)=>a+r.trx,0)/rows.length;
  const avgLaba=rows.reduce((a,r)=>a+(r.qty?r.laba/r.qty:0),0)/rows.length;
  rows.forEach(r=>{
    r.labaUnit=r.qty?r.laba/r.qty:0;
    r.k = r.trx>=avgTrx ? (r.labaUnit>=avgLaba?"STAR":"PLOW")
                        : (r.labaUnit>=avgLaba?"PUZZLE":"DOG");
  });
  return {rows,avgTrx,avgLaba,
    totOmzet:rows.reduce((a,r)=>a+r.omzet,0), totLaba:rows.reduce((a,r)=>a+r.laba,0)};
}
function pGrowth(){
  const hari=UI.filter.gHari||90;
  const g=dataGrowth(hari);
  const seg=(v,l)=>`<button class="${hari===v?"on":""}" onclick="app.setGrowth(${v})">${l}</button>`;
  if(!g.rows.length) return `<div class="card"><div class="empty">
    <svg viewBox="0 0 64 64" class="spart spart-empty"><use href="#sp-gear"/></svg>
    <div class="big">Belum cukup data penjualan</div>
    <p>Analisis ini membaca pesanan ${hari} hari terakhir. Setelah ada transaksi, produk akan terkelompok sendiri.</p>
    <div class="seg" style="margin-top:12px">${seg(30,"30 hari")}${seg(90,"90 hari")}${seg(365,"1 tahun")}</div></div></div>`;

  const per=k=>g.rows.filter(r=>r.k===k).sort((a,b)=>b.omzet-a.omzet);
  const kotak=k=>{const d=KUADRAN[k], rs=per(k);
    const omz=rs.reduce((a,r)=>a+r.omzet,0);
    return `<div class="card" style="border-left:3px solid ${d.warna}">
      <div class="hd"><h3 style="color:${d.warna}">${d.l}</h3>
        <span class="tag t-flat">${rs.length} produk</span>
        <span class="hint" style="margin-left:auto">${g.totOmzet?(omz/g.totOmzet*100).toFixed(0):0}% dari omzet</span></div>
      <div class="bd" style="background:${d.bg};padding:10px 14px;border-bottom:1px solid var(--line)">
        <div class="hint" style="margin-bottom:3px">${d.sub}</div>
        <div style="font-size:12.5px">${d.saran}</div></div>
      <div class="tw"><table><thead><tr><th>Barang</th><th class="r">Transaksi</th>
        <th class="r">Qty</th><th class="r">Omzet</th><th class="r">Laba/unit</th></tr></thead><tbody>
      ${rs.slice(0,8).map(r=>`<tr><td><b>${dwiTeks(r.p.nama,r.p.namaId)}</b>
        <div class="mono hint">${esc(r.p.sku)}${r.p.posisi?" · rak "+esc(r.p.posisi):""}</div></td>
        <td class="r mono">${nf(r.trx)}</td><td class="r mono">${nf(r.qty)}</td>
        <td class="r mono">${rp(r.omzet)}</td>
        <td class="r mono" style="color:${r.labaUnit>=0?"var(--ok)":"var(--red)"}">${rp(Math.round(r.labaUnit))}</td></tr>`).join("")
        ||`<tr><td colspan="5"><div class="empty" style="padding:18px"><p>Tidak ada produk di kuadran ini.</p></div></td></tr>`}
      </tbody></table></div>
      ${rs.length>8?`<div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Menampilkan 8 teratas dari ${rs.length} produk.</p></div>`:""}
    </div>`;};

  /* sebaran titik: sumbu X transaksi, sumbu Y laba per unit */
  const maxT=Math.max(...g.rows.map(r=>r.trx)), maxL=Math.max(...g.rows.map(r=>r.labaUnit),1);
  const minL=Math.min(...g.rows.map(r=>r.labaUnit),0);
  const W=760,H=320,PL=74,PR=14,PT=14,PB=40, iw=W-PL-PR, ih=H-PT-PB;
  const X=v=>PL+iw*(maxT?v/maxT:0), Y=v=>PT+ih-ih*((v-minL)/((maxL-minL)||1));
  const titik=g.rows.map(r=>`<circle cx="${X(r.trx).toFixed(1)}" cy="${Y(r.labaUnit).toFixed(1)}" r="4"
    fill="${KUADRAN[r.k].warna}" fill-opacity=".7"><title>${esc(r.p.nama)} — ${r.trx} transaksi, laba/unit ${rp(Math.round(r.labaUnit))}</title></circle>`).join("");
  const sebaran=`<svg viewBox="0 0 ${W} ${H}" class="chart">
    <rect x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="#FAFBFC"/>
    <line x1="${X(g.avgTrx).toFixed(1)}" y1="${PT}" x2="${X(g.avgTrx).toFixed(1)}" y2="${PT+ih}" stroke="#C7CBD2" stroke-dasharray="5 4"/>
    <line x1="${PL}" y1="${Y(g.avgLaba).toFixed(1)}" x2="${W-PR}" y2="${Y(g.avgLaba).toFixed(1)}" stroke="#C7CBD2" stroke-dasharray="5 4"/>
    <text x="${PL+8}" y="${PT+16}" class="axb">Puzzles</text>
    <text x="${W-PR-8}" y="${PT+16}" text-anchor="end" class="axb">Stars</text>
    <text x="${PL+8}" y="${PT+ih-8}" class="axb">Dogs</text>
    <text x="${W-PR-8}" y="${PT+ih-8}" text-anchor="end" class="axb">Plow Horses</text>
    ${titik}
    <text x="${PL}" y="${H-12}" class="ax">0</text>
    <text x="${W-PR}" y="${H-12}" text-anchor="end" class="ax">${nf(maxT)} transaksi</text>
    <text x="${PL-8}" y="${Y(maxL).toFixed(1)}" text-anchor="end" class="ax">${rpShort(maxL)}</text>
    <text x="${PL-8}" y="${Y(minL).toFixed(1)}" text-anchor="end" class="ax">${rpShort(minL)}</text>
  </svg>
  <div class="legend">${Object.keys(KUADRAN).map(k=>`<span><i style="background:${KUADRAN[k].warna}"></i>${KUADRAN[k].l}</span>`).join("")}</div>`;

  return `
  <div class="card" style="margin-bottom:14px">
    <div class="hd"><h3>Sebaran produk</h3>
      <span class="hint">garis putus-putus = rata-rata, itulah pembatas kuadrannya</span>
      <div class="seg" style="margin-left:auto">${seg(30,"30 hari")}${seg(90,"90 hari")}${seg(365,"1 tahun")}</div></div>
    <div class="bd">
      <div class="grid g4" style="margin-bottom:14px">
        <div class="kpi sig"><div class="lb">Produk terjual</div><div class="vl num">${nf(g.rows.length)}</div>
          <div class="ft">dari ${nf(DB.products.length)} di master</div></div>
        <div class="kpi ok"><div class="lb">Total laba kotor</div><div class="vl num">${rp(g.totLaba)}</div>
          <div class="ft">omzet ${rpShort(g.totOmzet)}</div></div>
        <div class="kpi amber"><div class="lb">Rata-rata transaksi</div><div class="vl num">${g.avgTrx.toFixed(1)}</div>
          <div class="ft">pembatas sumbu mendatar</div></div>
        <div class="kpi alert"><div class="lb">Rata-rata laba/unit</div><div class="vl num">${rp(Math.round(g.avgLaba))}</div>
          <div class="ft">pembatas sumbu tegak</div></div>
      </div>
      ${sebaran}
    </div></div>
  <div class="grid g2" style="gap:14px">${kotak("STAR")}${kotak("PLOW")}${kotak("PUZZLE")}${kotak("DOG")}</div>
  <div class="card" style="margin-top:14px"><div class="bd">
    <p class="hint" style="margin:0">Laba per unit dihitung dari harga jual dikurangi harga beli, sehingga barang yang harga belinya belum diisi akan tampak sangat menguntungkan. Periksa harga beli di master barang sebelum mengambil keputusan dari analisis ini.</p>
  </div></div>`;
}

function pKredit(){
  const rows=DB.customers.map(c=>({c,k:kreditCust(c.id)})).filter(x=>x.k.piutang>0)
    .sort((a,b)=>b.k.overdue-a.k.overdue||b.k.piutang-a.k.piutang);
  const tot=rows.reduce((a,x)=>a+x.k.piutang,0), totOd=rows.reduce((a,x)=>a+x.k.overdue,0);
  const now=Date.now();
  const umur=[[0,30,"0–30 hari"],[31,60,"31–60 hari"],[61,90,"61–90 hari"],[91,99999,"di atas 90 hari"]];
  const ember=umur.map(u=>({l:u[2],v:0}));
  const perToko={};
  rows.forEach(x=>x.k.list.forEach(o=>{
    const h=o.tempoBayar?Math.floor((now-new Date(o.tempoBayar).getTime())/86400000):0;
    const i=umur.findIndex(u=>h>=u[0]&&h<=u[1]); if(i>-1) ember[i].v+=sisaTagihan(o);
    perToko[o.storeId]=(perToko[o.storeId]||0)+sisaTagihan(o); }));
  const maxE=Math.max(1,...ember.map(e=>e.v));
  return `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi sig"><div class="lb">Total piutang berjalan</div><div class="vl num">${rp(tot)}</div>
      <div class="ft">${rows.length} pelanggan</div></div>
    <div class="kpi alert"><div class="lb">Tunggakan jatuh tempo</div><div class="vl num">${rp(totOd)}</div>
      <div class="ft">${tot?(totOd/tot*100).toFixed(0):0}% dari total piutang</div></div>
    <div class="kpi amber"><div class="lb">Pelanggan menunggak</div><div class="vl num">${rows.filter(x=>x.k.overdue>0).length}</div>
      <div class="ft">dari ${DB.customers.length} pelanggan</div></div>
    <div class="kpi ok"><div class="lb">Faktur belum lunas</div><div class="vl num">${rows.reduce((a,x)=>a+x.k.faktur,0)}</div>
      <div class="ft">lintas seluruh toko</div></div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><div class="hd"><h3>Umur piutang</h3></div><div class="bd">
      ${ember.map((e,i)=>`<div style="margin-bottom:11px">
        <div class="row" style="justify-content:space-between;margin-bottom:4px"><b>${e.l}</b><span class="mono">${rp(e.v)}</span></div>
        <div style="height:9px;background:#EDF1F4;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${(e.v/maxE*100).toFixed(1)}%;background:${["#1F7A4D","#A9741A","#E50112","#8A0009"][i]}"></div></div>
      </div>`).join("")}
      <p class="hint" style="margin:0">Dihitung dari selisih tanggal jatuh tempo dengan hari ini.</p>
    </div></div>
    <div class="card"><div class="hd"><h3>Piutang per toko</h3></div><div class="bd">
      ${DB.stores.map(st=>{const v=perToko[st.id]||0;
        return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0F3F6">
          <span>${esc(st.nama)}</span><b class="mono">${v?rp(v):"—"}</b></div>`}).join("")}
      <p class="hint" style="margin:10px 0 0">Piutang mengikuti toko yang menerbitkan pesanan, tetapi limitnya dihitung per pelanggan lintas toko.</p>
    </div></div>
  </div>
  <div class="card"><div class="hd"><h3>Rincian per pelanggan</h3></div>
    <div class="tw">${rows.length?`<table><thead><tr><th>Pelanggan</th><th>Tipe</th><th class="r">Limit</th>
      <th class="r">Piutang</th><th class="r">Tunggakan</th><th class="r">Sisa limit</th><th>Faktur</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td><b>${esc(x.c.nama)}</b><div class="mono hint">${esc(x.c.kode)}</div></td>
      <td><span class="tag t-flat">${esc(TIPECUST[x.c.tipe]||x.c.tipe)}</span></td>
      <td class="r mono">${x.c.creditLimit?rp(x.c.creditLimit):"—"}</td>
      <td class="r mono">${rp(x.k.piutang)}</td>
      <td class="r mono" style="${x.k.overdue?"color:var(--alert);font-weight:600":""}">${x.k.overdue?rp(x.k.overdue)+" · "+x.k.hari+" hari":"—"}</td>
      <td class="r mono" style="${x.c.creditLimit&&x.k.piutang>x.c.creditLimit?"color:var(--alert)":""}">${x.c.creditLimit?rp(x.c.creditLimit-x.k.piutang):"tanpa limit"}</td>
      <td style="font-size:12px">${x.k.list.map(o=>`<div><a href="#" onclick="app.detail('${o.id}');return false">${esc(o.noSO)}</a>
        <span class="mono hint">${rp(sisaTagihan(o))}</span>
        <button class="btn gh sm" onclick="app.formPelunasan('${o.id}')">Lunasi</button></div>`).join("")}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><svg viewBox="0 0 64 64" class="spart spart-empty"><use href="#sp-piston"/></svg><div class="big">Tidak ada piutang berjalan</div>
      <p>Semua transaksi kredit sudah lunas.</p></div>`}</div></div>`;
}

function kartuLevel(o){
  return `<div style="background:${o.level>=3?"var(--red-soft)":o.level===2?"#FBF8F1":"#F1F8F4"};
      border-left:3px solid ${o.level>=3?"var(--red)":o.level===2?"var(--warn)":"var(--ok)"};
      padding:10px 12px;font-size:12.5px;border-radius:2px">
    <b>${(LEVELINFO[o.level]||{}).l||("Level "+o.level)}</b>
    <ul style="margin:6px 0 0;padding-left:18px">
      ${(o.alasanLevel||[]).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`;
}

    <p>Pesanan berisiko kredit yang sudah lolos pemeriksaan data akan muncul di sini.</p></div></div>`;

        ${o.items.map(it=>{const pr=prod(it.productId)||{nama:"—",jual:0,bottom:0};
          const bawah=pr.bottom&&it.harga<pr.bottom;
          return `<tr><td>${esc(pr.nama)}</td><td class="r mono">${nf(it.qty)}</td>
          <td class="r mono" style="${bawah?"color:var(--alert);font-weight:600":""}">${rp(it.harga)}${bawah?"<div class='hint' style='color:var(--alert)'>di bawah bottom "+rp(pr.bottom)+"</div>":""}</td>
          <td class="r mono" style="color:var(--muted)">${rp(pr.jual)}</td></tr>`}).join("")}
        <tr><td colspan="3" class="r"><b>Total</b></td><td class="r mono"><b>${rp(o.total)}</b></td></tr>
        </tbody></table></div></div>
      <div>
        <div class="hint" style="margin-bottom:6px">Posisi kredit pelanggan</div>
        <table class="mtable"><tbody>
          ${c?[["Pelanggan",c.nama+" ("+c.kode+")"],["Tipe",TIPECUST[c.tipe]||c.tipe],
             ["Credit limit",c.creditLimit?rp(c.creditLimit):"tanpa limit"],
             ["Piutang berjalan",rp(k.piutang)],
             ["Tunggakan",k.overdue?rp(k.overdue)+" · "+k.hari+" hari":"tidak ada"],
             ["Sisa limit",c.creditLimit?rp(c.creditLimit-k.piutang):"—"],
             ["Jenis pembayaran",BAYAR[o.bayarTipe]||"—"],
             ["Jatuh tempo",o.tempoBayar?fdate(o.tempoBayar):"—"]]
            .map(r=>`<tr><td class="k">${r[0]}</td><td class="v">${esc(r[1])}</td></tr>`).join("")
            :`<tr><td colspan="2">Pelanggan tidak ditemukan.</td></tr>`}
        </tbody></table>
        <div class="hint" style="margin:12px 0 6px">Bukti pembayaran</div>

        <div style="background:#fff;padding:${(+t.margin||14)}mm;max-width:${t.kertas==="A5"?"148mm":"210mm"};margin:0 auto">
          ${pratinjau}</div></div>
      <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">
        Pratinjau memakai data contoh. Ukuran kertas dan margin baru terlihat tepat saat dicetak.</p></div>
    </div>
  </div>`;
}

function pSettings(){
  const aktif=u=>u.aktif!==false;
  return `<div class="grid g2">
    <div class="card"><div class="hd"><h3>Daftar toko</h3>
      <button class="btn pri sm" style="margin-left:auto" onclick="app.editStore('')">Tambah toko</button></div>
      <div class="tw"><table><thead><tr><th>Kode</th><th>Nama toko</th><th>Alamat</th><th>Telepon</th><th></th></tr></thead><tbody>
      ${DB.stores.map(st=>`<tr><td class="mono"><b style="border-left:3px solid ${esc(st.warna||"#E50112")};padding-left:6px">${esc(st.kode)}</b></td>
        <td><div class="row" style="gap:8px">${st.logo?`<img src="${esc(st.logo)}" alt="" style="height:22px;max-width:60px;object-fit:contain">`:""}<b>${esc(st.nama)}</b></div></td>
        <td style="font-size:12px;color:var(--muted)">${esc(st.alamat||"—")}</td>
        <td class="mono" style="font-size:12px">${esc(st.telp||"—")}</td>
        <td class="r"><button class="btn gh sm" onclick="app.editStore('${st.id}')">Ubah</button></td></tr>`).join("")}
      </tbody></table></div>
      <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Kode toko tercetak di label pengiriman dan kolom stok. Alamat dipakai sebagai data pengirim pada paket.</p></div>
    </div>
    <div class="card"><div class="hd"><h3>Pengguna</h3>
      <button class="btn pri sm" style="margin-left:auto" onclick="app.editUser('')">Tambah pengguna</button></div>
      <div class="tw"><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Toko</th><th>Status</th><th></th></tr></thead><tbody>
      ${DB.users.map(u=>`<tr style="${aktif(u)?"":"opacity:.55"}"><td><b>${esc(u.nama)}</b></td>
        <td class="mono" style="font-size:12px">${esc(u.email||"—")}</td>
        <td><span class="tag t-flat">${roleLabel(u.role)}</span></td>
        <td style="font-size:12px">${u.storeId?esc(store(u.storeId).nama):"—"}</td>
        <td><span class="tag ${aktif(u)?"t-lunas":"t-batal"}">${aktif(u)?"Aktif":"Nonaktif"}</span></td>
        <td class="r"><div class="row" style="justify-content:flex-end">
          <button class="btn gh sm" onclick="app.editUser('${u.id}')">Ubah</button>
          ${u.id===ME.id?"":`<button class="btn ${aktif(u)?"dgr":"gh"} sm" onclick="app.toggleUser('${u.id}')">${aktif(u)?"Nonaktifkan":"Aktifkan"}</button>`}
        </div></td></tr>`).join("")}
      </tbody></table></div>
      <div class="bd" style="border-top:1px solid var(--line)"><p class="hint" style="margin:0">Pengguna nonaktif tidak muncul di layar masuk, tetapi riwayat pekerjaannya tetap tersimpan. Akun Anda sendiri tidak bisa dinonaktifkan.</p></div>
    </div>
  </div>`;
}

function pDetail(id){
  const o=order(id); if(!o) return `<div class="card"><div class="empty"><div class="big">Pesanan tidak ditemukan</div></div></div>`;
  const c=cust(o.customerId);
  const steps=[["SO dibuat",o.noSO,o.tanggal],
    ["Performa Invoice",o.noPI?o.noPI+(o.revPI?" Rev. "+o.revPI:""):"",o.tglPI],
    ["Bukti bayar",o.buktiBayar&&o.buktiBayar.length?o.buktiBayar.length+" lampiran":"",o.tglBayar],
    ["Verifikasi manajer",o.dicekOleh||"",o.tglCek],
    ["Keputusan Level 3",o.level>=3?(o.disetujuiFinance||""):"—",o.tglFinance],
    ["Invoice sah",o.invoice?o.invoice.no:"",o.invoice?o.invoice.tgl:null],
    ["Purchase Request",o.noPR||"",o.tglPR],
    ["Disetujui gudang",o.approvedBy||"",o.tglApprove],
    ["Diserahkan ke kurir",o.noAwb?kurir(o.kurir).n+" · "+o.noAwb:"",o.tglKirim]];
  const idx=ORDER_FLOW.indexOf(o.status);
  return `<div class="row" style="margin-bottom:12px"><button class="btn gh sm" onclick="app.go('orders')">← Semua pesanan</button>
    <div style="font-family:'IBM Plex Mono';font-size:17px;font-weight:600">${esc(o.noSO)}</div>${tag(o.status)}
    <div class="row" style="margin-left:auto">
      <button class="btn gh sm" onclick="app.printDoc('so','${o.id}')">Cetak SO</button>
      ${o.noPI?`<button class="btn gh sm" onclick="app.printDoc('pi','${o.id}')">Performa Invoice${o.revPI?" (Rev. "+o.revPI+")":""}</button>`:""}
      ${o.noPI&&["MENUNGGU_BAYAR","DITOLAK_MANAJER"].includes(o.status)&&can("proforma")?`<button class="btn sm" onclick="app.formRevisiPI('${o.id}')">Revisi PI</button>`:""}
      ${o.bukti?`<button class="btn gh sm" onclick="app.lihatBukti('${o.id}')">Bukti pesanan</button>`:""}
      ${o.buktiBayar&&o.buktiBayar.length?`<button class="btn gh sm" onclick="app.lihatBuktiBayar('${o.id}')">Bukti bayar (${o.buktiBayar.length})</button>`:""}
      ${o.noAwb?`<button class="btn gh sm" onclick="app.printDoc('label','${o.id}')">Label kirim</button>
        <button class="btn gh sm" onclick="app.lacakKurir('${o.id}')">Lacak di situs kurir</button>`:""}
      ${o.invoice?`<button class="btn gh sm" onclick="app.printDoc('inv','${o.id}')">Invoice</button>`:""}
      ${["MENUNGGU_BAYAR","DITOLAK_MANAJER"].includes(o.status)&&can("buatSO")?`<button class="btn pri sm" onclick="app.formBayar('${o.id}')">Unggah bukti bayar</button>`:""}
      ${o.status==="CEK_MANAJER"&&can("verifikasi")?`<button class="btn pri sm" onclick="app.setujuiManajer('${o.id}')">${o.level>=3?"Data sesuai — lanjut Level 3":"Setujui"}</button>
        <button class="btn dgr sm" onclick="app.formTolak('${o.id}')">Tolak</button>`:""}
      ${o.status==="CEK_FINANCE"&&can("finance")?`<button class="btn pri sm" onclick="app.formSetujuFinance('${o.id}')">Setujui Level 3</button>
        <button class="btn dgr sm" onclick="app.formTolakFinance('${o.id}')">Tolak</button>`:""}
      ${sisaTagihan(o)>0&&o.invoice&&can("invoice")?`<button class="btn sm" onclick="app.formPelunasan('${o.id}')">Catat pelunasan</button>`:""}
      ${o.status==="INVOICE_VALID"&&can("buatSO")?`<button class="btn pri sm" onclick="app.teruskanPR('${o.id}')">Teruskan ke gudang</button>`:""}
      ${o.status==="PR_GUDANG"&&can("gudang")?`<button class="btn dgr sm" onclick="app.formTolakPR('${o.id}')">Tolak PR</button>
        <button class="btn pri sm" onclick="app.approve('${o.id}')">Setujui PR</button>`:""}
      ${o.status==="APPROVED"&&can("gudang")?`<button class="btn pri sm" onclick="app.formSerah('${o.id}')">Serahkan ke ekspedisi</button>`:""}
      ${o.status==="DISERAHKAN"&&can("gudang")?`<button class="btn pri sm" onclick="app.formResi('${o.id}')">Input nomor resi</button>`:""}
      ${o.status==="DIKIRIM"&&can("buatSO")?`<button class="btn pri sm" onclick="app.selesai('${o.id}')">Pesanan diterima</button>`:""}
      ${["DIKIRIM","SELESAI"].includes(o.status)&&can("buatSO")?`<button class="btn dgr sm" onclick="app.formRetur('${o.id}')">Ajukan retur</button>`:""}
      ${!["DIKIRIM","SELESAI","BATAL"].includes(o.status)&&(can("gudang")||can("verifikasi"))?`<button class="btn dgr sm" onclick="app.batal('${o.id}')">Batalkan</button>`:""}
    </div></div>
  <div style="margin-bottom:12px">${kartuLevel(o)}</div>
  <div class="dispatch" style="margin-bottom:14px">${steps.map((s,i)=>`<div class="st ${s[1]?"done":""} ${i===Math.min(idx,4)&&!s[1]?"now":""}">
    <div class="k">${s[0]}</div><div class="v">${s[1]?esc(s[1]):"menunggu"}</div>
    <div class="v" style="font-size:10.5px">${s[2]?fdate(s[2],1):""}</div></div>`).join("")}</div>
  <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:14px">
    <div class="card"><div class="hd"><h3>Rincian barang</h3></div>
      <div class="tw"><table><thead><tr><th>Barang</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Subtotal</th></tr></thead><tbody>
      ${o.items.map(it=>{const p=prod(it.productId)||{nama:"—",sku:"",sat:""};return `<tr><td><b>${esc(p.nama)}</b><div class="mono" style="font-size:11px;color:var(--muted)">${esc(p.sku)}</div></td>
        <td class="r mono">${nf(it.qty)} ${esc(p.sat)}</td><td class="r mono">${rp(it.harga)}</td><td class="r mono">${rp(it.qty*it.harga)}</td></tr>`}).join("")}
      </tbody><tfoot>
        <tr><td colspan="3" class="r">Subtotal</td><td class="r mono">${rp(o.sub)}</td></tr>
        ${o.ppnAktif?`<tr><td colspan="3" class="r">PPN ${o.ppnPersen}%</td><td class="r mono">${rp(o.ppn)}</td></tr>`:""}
        ${o.ongkirAktif?`<tr><td colspan="3" class="r">Ongkos kirim${o.ekspedisi?" — "+esc(o.ekspedisi):""}</td><td class="r mono">${rp(o.ongkir)}</td></tr>`:""}
        <tr><td colspan="3" class="r"><b>Total</b></td><td class="r mono"><b style="font-size:15px">${rp(o.total)}</b></td></tr>
      </tfoot></table></div>
      ${o.catatan?`<div class="bd" style="border-top:1px solid var(--line)"><b>Catatan:</b> ${esc(o.catatan)}</div>`:""}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><div class="hd"><h3>Informasi</h3></div><div class="bd" style="font-size:13px">
        ${[["Toko pemesan",store(o.storeId).nama],["Dibuat oleh",o.oleh],["Sumber stok",o.sumber==="HQ"?"Gudang Utama":store(o.sumber).nama],
           ["Pelanggan",o.cust.nama],["Telepon",o.cust.telp||"—"],["Alamat",o.cust.alamat||"—"],
           ["Pelanggan (master)",c?c.nama+" · "+c.kode:"—"],
           ["Jenis pembayaran",(BAYAR[o.bayarTipe]||"—")+(o.bayarTipe!=="FULL"?" · ToP "+o.topHari+" hari":"")],
           ["Saldo potongan dipakai",o.pakaiSaldo?rp(o.pakaiSaldo):"—"],
           ["Sudah dibayar",rp(o.terbayar)],["Sisa tagihan",rp(sisaTagihan(o))],
           ["PPN",o.ppnAktif?o.ppnPersen+"% ("+rp(o.ppn)+")":"tidak dikenakan"],
           ["Ongkos kirim",o.ongkirAktif?rp(o.ongkir)+(o.ekspedisi?" · "+o.ekspedisi:""):"tidak dikenakan"],
           ["Nominal DP",o.bayarTipe==="DP"?rp(o.dpNominal):"—"],
           ["Jatuh tempo pelunasan",o.tempoBayar?fdate(o.tempoBayar):"—"],
           ["Diverifikasi manajer",o.dicekOleh||"—"],["No. Purchase Request",o.noPR||"—"],
           ["Total barang",nf(totalQty(o))+" pcs · "+o.items.length+" jenis"],
           ["Kurir",o.kurir?kurir(o.kurir).n:"—"],["No. resi kurir",o.noAwb||"—"],
           ["Disetujui oleh",o.approvedBy||"—"],["No. PO / referensi",o.noRef||"—"],
           ["Bukti pemesanan",o.bukti?"Terlampir ("+o.bukti.nama+")":"Tidak ada"]]
          .map(r=>`<div class="row" style="justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid #F0F3F6">
            <span style="color:var(--muted)">${r[0]}</span><b style="text-align:right">${esc(r[1])}</b></div>`).join("")}
      </div></div>
      <div class="card"><div class="hd"><h3>Riwayat</h3></div><div class="bd">
        <ul class="tl">${o.log.slice().reverse().map((l,i)=>`<li class="${i===0?"hi":""}"><div class="w">${esc(l.judul)}</div>
          <div class="m">${fdate(l.ts,1)} · ${esc(l.oleh)}</div>${l.ket?`<div style="font-size:12px;color:var(--muted)">${esc(l.ket)}</div>`:""}</li>`).join("")}</ul>
      </div></div>
    </div></div>`;
}

function pasang3D(){
  const sh=document.getElementById("gshell"); if(!sh) return;
  const kurangGerak=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const naik=[...sh.querySelectorAll(".rise, .k3, .jl")];
  if(kurangGerak){ naik.forEach(e=>e.classList.add("on")); return; }
  if("IntersectionObserver" in window){
    const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); } }),
      {root:sh, rootMargin:"0px 0px -8% 0px", threshold:.08});
    naik.forEach(e=>io.observe(e));
  } else naik.forEach(e=>e.classList.add("on"));
  const lapis=[...sh.querySelectorAll(".par")];
  let tiket=null;
  sh.addEventListener("scroll",()=>{ if(tiket) return;
    tiket=requestAnimationFrame(()=>{ tiket=null; const y=sh.scrollTop;
      lapis.forEach(e=>{ const k=parseFloat(e.dataset.par||"0");
        e.style.transform="translate3d(0,"+(y*k).toFixed(1)+"px,0)"; }); });
  },{passive:true});
}

function pasangCaptcha(){
  const box=$("#capbox");
  if(!TURNSTILE_SITEKEY||!box||box.dataset.siap) return;
  const jalan=()=>{ const b=$("#capbox");
    if(!window.turnstile||!b||b.dataset.siap) return;
    b.dataset.siap="1";
    try{
      window.turnstile.render(b,{sitekey:TURNSTILE_SITEKEY,callback:t=>{CAPTCHA=t;},
        "expired-callback":()=>{CAPTCHA=null;},
        "error-callback":()=>{ CAPTCHA=null;
          toast("Verifikasi keamanan gagal dimuat. Periksa site key dan domain di Cloudflare Turnstile.","bad"); }});
    }catch(e){ b.dataset.siap=""; toast("Captcha gagal dipasang: "+e.message,"bad"); }
  };
  if(window.turnstile) return jalan();
  if(!document.getElementById("tsjs")){
    const sc=document.createElement("script"); sc.id="tsjs";
    sc.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
    sc.async=true; sc.onload=jalan; document.head.appendChild(sc);
  }
}

function barisFk(o,t){

      nama:teksDok(p.nama,p.namaId)+((t.tampil_spek&&p.spesifikasi)?" — "+teksDok(p.spesifikasi,p.spekId):""),
      qty:it.qty, sat:p.sat||"", harga:it.harga, jumlah:it.qty*it.harga, plat:it.plat||""};});

function nilaiFk(o){

function rekFk(k){

/* Rekening ditampilkan berlabel sesuai kata-kata pada faktur asli tiap toko.
   Bila isian rekening belum tiga baris, teksnya ditampilkan apa adanya. */
function blokRek(r,label,gayaLabel,gayaNilai){
  if(!r.terisi) return "";
  if(!r.berlabel) return `<div style="${gayaNilai||"font-size:10.5px"};white-space:pre-line">${esc(r.mentah)}</div>`;
  const baris=[[label[0],r.bank],[label[1],r.atasNama],[label[2],r.norek]];
  return `<table class="pay" style="width:auto"><tbody>${baris.map(b=>
    `<tr><td style="${gayaLabel||""};padding-right:10px;white-space:nowrap">${esc(b[0])}</td>

}
function dokTema(o,jenis,tOverride){
  const t=tOverride||tpl(o.storeId), k=kopDok(o), st=store(o.storeId)||{};
  const tema=t.tema||"polos";
  if(tema==="polos"||!FK[tema]) return jenis==="inv"?docInvPolos(o,t):docProformaPolos(o,t);
  const judul = jenis==="inv"?(t.judul_invoice||"INVOICE"):(t.judul_proforma||"PERFORMA INVOICE");

/* Judul dokumen selalu satu baris dan selalu muat. Digambar sebagai SVG yang
   menyesuaikan diri dengan lebar kolomnya, jadi sepanjang apa pun judulnya
   ia tidak pernah meluber ke logo di sebelahnya maupun pecah ke baris kedua.
   opt: {serif:true} untuk tema berhuruf serif, {track:n} untuk jarak huruf lebar. */
function jdl(txt,base,rata,opt){
  opt=opt||{};
  const t=(txt||"").trim(), n=Math.max(1,t.length);
  const track=opt.track||0;                      /* satuan viewBox, 100 = 1em */
  const lebarHuruf=opt.serif?62:60;
  const W=Math.round(n*(lebarHuruf+track)), H=100;
  const maksimal=Math.round(base*n*(lebarHuruf+track)/100);
  const tengah=rata==="center";
  const font=opt.serif?"Georgia,'Times New Roman',serif":"Inter,'Helvetica Neue',Helvetica,Arial,sans-serif";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="${tengah?"xMidYMid":"xMinYMid"} meet"
      style="display:block;max-width:${maksimal}px;${tengah?"margin:0 auto;":""}">
      <text x="${tengah?W/2:0}" y="78" text-anchor="${tengah?"middle":"start"}"
        font-family="${font}" font-weight="${opt.serif?700:800}" font-size="92"
        letter-spacing="${track-2}" fill="currentColor">${esc(t)}</text></svg>`;
}

  bacaImpor(input,jenis){
    const f=input.files&&input.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=()=>{ try{ app.pratinjauImpor(String(fr.result),jenis); }
      catch(e){ toast("Berkas tidak terbaca: "+e.message,"bad"); } };
    fr.readAsText(f,"utf-8");
  },
  pratinjauImpor(teks,jenis){
    const pisah=l=>{const out=[];let c="",q=false;
      for(let i=0;i<l.length;i++){const ch=l[i];
        if(ch==='"'){ if(q&&l[i+1]==='"'){c+='"';i++;} else q=!q; }
        else if((ch===";"||ch===",")&&!q){ out.push(c); c=""; }
        else c+=ch; }
      out.push(c); return out.map(x=>x.trim());};
    const baris=teks.replace(/^\ufeff/,"").split(/\r?\n/).filter(x=>x.trim());
    if(baris.length<2){ toast("Berkas kosong atau hanya berisi judul kolom.","bad"); return; }
    const kep=pisah(baris[0]).map(x=>x.toLowerCase());
    const idx=n=>kep.indexOf(n.toLowerCase());
    const data=baris.slice(1).map(l=>pisah(l));
    const ambil=(r,n)=>{const i=idx(n); return i>=0?(r[i]||""):"";};
    const angka=v=>{const t=String(v||"").replace(/[^\d]/g,""); return t?+t:0;};

    let siap=[], salah=[];
    data.forEach((r,n)=>{
      if(jenis==="barang"){
        const sku=ambil(r,"Serial Number").toUpperCase();
        if(!sku) return salah.push([n+2,"Serial Number kosong"]);
        siap.push({sku,nama:ambil(r,"Item Name"),merek:ambil(r,"Merek"),spesifikasi:ambil(r,"Specification"),
          posisi:ambil(r,"Position"),remark:ambil(r,"Remark"),
          ada:!!DB.products.find(p=>p.sku===sku)});
      }else{
        const nama=ambil(r,"Nama");
        if(!nama) return salah.push([n+2,"Nama kosong"]);
        const mitra=(ambil(r,"Jenis Mitra")||"RETAIL").toUpperCase();
        if(!["DISTRIBUTOR","RETAIL","BENGKEL","END_USER","MARKETPLACE"].includes(mitra))
          return salah.push([n+2,"Jenis Mitra tidak dikenal: "+mitra]);
        siap.push({kode:ambil(r,"Kode"),nama,tipe:(ambil(r,"Tipe")||"CASH").toUpperCase(),
          tipe_mitra:mitra,telp:ambil(r,"Telepon"),alamat:ambil(r,"Alamat"),kota:ambil(r,"Kota"),
          provinsi:ambil(r,"Provinsi"),wilayah:ambil(r,"Wilayah"),
          credit_limit:angka(ambil(r,"Credit Limit")),top_default:angka(ambil(r,"ToP"))||30,
          ada:!!DB.customers.find(c=>c.nama.toLowerCase()===nama.toLowerCase())});
      }
    });
    UI.impor={jenis,siap};
    const baru=siap.filter(x=>!x.ada).length, perbarui=siap.length-baru;
    this.closeModal();
    modal("Pratinjau impor "+jenis,
      `<div class="grid g4" style="margin-bottom:14px">
        <div class="kpi ok"><div class="lb">Baris terbaca</div><div class="vl">${nf(siap.length)}</div></div>
        <div class="kpi sig"><div class="lb">Data baru</div><div class="vl">${nf(baru)}</div></div>
        <div class="kpi amber"><div class="lb">Diperbarui</div><div class="vl">${nf(perbarui)}</div></div>
        <div class="kpi alert"><div class="lb">Bermasalah</div><div class="vl">${nf(salah.length)}</div></div></div>
      ${salah.length?`<div style="border-left:3px solid var(--red);background:var(--red-soft);padding:10px 12px;margin-bottom:13px">
        <b style="font-size:12.5px">Baris yang dilewati</b>
        <div style="font-size:12px;margin-top:5px;max-height:120px;overflow:auto">
          ${salah.slice(0,20).map(x=>"Baris "+x[0]+" — "+esc(x[1])).join("<br>")}
          ${salah.length>20?"<br>… dan "+(salah.length-20)+" lagi":""}</div></div>`:""}
      <div class="tw" style="max-height:34vh;overflow:auto"><table><thead><tr>
        <th>#</th>${jenis==="barang"?"<th>Serial</th><th>Nama</th><th>Spesifikasi</th><th>Posisi</th>"
          :"<th>Nama</th><th>Jenis Mitra</th><th>Kota</th><th>Wilayah</th>"}<th>Tindakan</th></tr></thead><tbody>
        ${siap.slice(0,40).map((x,i)=>`<tr><td class="hint">${i+1}</td>
          ${jenis==="barang"?`<td class="mono">${esc(x.sku)}</td><td>${esc(x.nama)}</td>
            <td>${esc(x.spesifikasi)}</td><td class="mono">${esc(x.posisi)}</td>`
            :`<td><b>${esc(x.nama)}</b></td><td>${esc(x.tipe_mitra)}</td>
              <td>${esc(x.kota)}</td><td>${esc(x.wilayah)}</td>`}
          <td><span class="tag ${x.ada?"t-baru":"t-lunas"}">${x.ada?"Perbarui":"Baru"}</span></td></tr>`).join("")}
      </tbody></table></div>
      ${siap.length>40?`<p class="hint" style="margin:9px 0 0">Menampilkan 40 dari ${nf(siap.length)} baris.</p>`:""}
      <p class="hint" style="margin:9px 0 0">Periksa dulu. Setelah disimpan, perubahan langsung berlaku untuk semua pengguna.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button>
       ${siap.length?`<button class="btn pri" onclick="app.simpanImpor()">Simpan ${nf(siap.length)} baris</button>`:""}`);
  },
  async simpanImpor(){
    const im=UI.impor; if(!im||!im.siap.length) return;
    this.closeModal();
    const tabel=im.jenis==="barang"?"products":"customers";
    const kunci=im.jenis==="barang"?"sku":"kode";
    const isi=im.siap.map(x=>{const o={...x}; delete o.ada;
      if(im.jenis==="pelanggan"&&!o.kode) o.kode="CUST/"+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
      return o;});
    try{
      splash("Menyimpan "+nf(isi.length)+" baris…");
      for(let i=0;i<isi.length;i+=200){
        await api("/rest/v1/"+tabel+"?on_conflict="+kunci,{method:"POST",
          headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
          body:JSON.stringify(isi.slice(i,i+200))});
      }
      UI.impor=null; await loadAll(); render();
      toast(nf(isi.length)+" baris "+im.jenis+" tersimpan.","good");
    }catch(e){ render(); toast("Impor gagal: "+e.message,"bad"); }
  },

  unduhOpname(){
    const cols=DB.stores;
    const kepala=["No","Serial Number","Item Name","Specification","Position","Satuan",
      "Stok Gudang Utama",...cols.map(st=>"Stok "+st.nama),"Stok Retur","Total Stok Sistem",

    const baris=DB.products.map((p,i)=>[

      p.pusat,...cols.map(st=>(p.toko||{})[st.id]||0),p.retur||0,totalStok(p),"","",""]);
    const esc=v=>{const t=String(v==null?"":v);
      return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;};
    const isi="\ufeff"+[kepala,...baris].map(r=>r.map(esc).join(";")).join("\r\n");
    const tgl=new Date().toISOString().slice(0,10);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([isi],{type:"text/csv;charset=utf-8"}));
    a.download="stock-opname-"+tgl+".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);

  submitSO(){
    const d=UI.draft;
    if(!d.customerId){ toast("Pilih pelanggan dari Customer Master dulu.","bad"); return; }
    if(d.kanal==="MARKETPLACE"&&(d.noOrderMp||"").trim().length<4){ toast("Isi nomor order marketplace dulu.","bad"); return; }
    if(d.bayarTipe!=="FULL"&&!(+d.topHari>0)){ toast("Isi Terms of Payment dalam hari dulu.","bad"); return; }
    if(terikatBatas()){
      for(const it of d.items){ const pr=prod(it.productId), sl=cekHarga(pr,it.harga);
        if(sl){ toast(sl.jenis==="tinggi"
          ? "Harga "+(pr.nama||"barang")+" melebihi harga normal "+rp(sl.batas)+". Periksa kembali angkanya."
          : "Diskon pada "+(pr.nama||"barang")+" melebihi batas "+batasDiskon()+"%. Harga terendah "+rp(sl.batas)+".","bad");
          return; } }
      const sb=d.items.reduce((a,i)=>a+i.qty*i.harga,0);
      const dk=Math.min(Math.max(0,+d.diskon||0),sb);
      if(sb>0&&dk/sb*100>batasDiskon()){
        toast("Diskon nota melebihi batas "+batasDiskon()+"%. Tertinggi "+rp(Math.floor(sb*batasDiskon()/100))+".","bad"); return; }
    }
    if(!d.items.length){ toast("Tambahkan minimal satu barang.","bad"); return; }
    if(!d.bukti){ UI.buktiErr=true; render(); toast("Bukti pemesanan pelanggan wajib diunggah.","bad"); return; }
    const sub=d.items.reduce((a,i)=>a+i.qty*i.harga,0);
    const disk=Math.min(Math.max(0,+d.diskon||0),sub);
    const ppn=d.ppnAktif?Math.round((sub-disk)*(+d.ppnPersen||0)/100):0;
    const cS=cust(d.customerId), sald=cS?cS.saldo:0;
    const pakai=Math.min(+d.pakaiSaldo||0, sald, sub-disk+ppn+(d.ongkirAktif?(+d.ongkir||0):0));
    const tot=sub-disk+ppn+(d.ongkirAktif?(+d.ongkir||0):0)-pakai;
    if(d.bayarTipe==="DP"&&(+d.dpNominal||0)>tot){
      toast("Nominal DP melebihi total tagihan "+rp(tot)+".","bad"); return; }
    let baru=null;
    act(async()=>{
      baru=await rpc("create_order",{p:{
        store_id:d.storeId, sumber:d.sumber, customer_id:d.customerId, alamat:d.alamat||"",
        kanal:d.kanal, marketplace:d.kanal==="MARKETPLACE"?d.marketplace:"",
        no_order_mp:d.kanal==="MARKETPLACE"?(d.noOrderMp||"").trim():"",
        diskon:disk, pakai_saldo:pakai, ppn_aktif:!!d.ppnAktif, ppn_persen:+d.ppnPersen||0,
        ongkir_aktif:!!d.ongkirAktif, ongkir:d.ongkirAktif?(+d.ongkir||0):0, ekspedisi:d.ekspedisi||"",
        items:d.items.map(i=>({product_id:i.productId,qty:i.qty,harga:i.harga})),
        sub, ppn, ongkir:+d.ongkir||0, total:tot,
        catatan:d.catatan||"", no_ref:d.noRef||"", bukti:d.bukti, jatuh_tempo:+d.jatuhTempo||14,
        bayar_tipe:d.bayarTipe, top_hari:d.bayarTipe==="FULL"?null:(+d.topHari||30),
        dp_nominal:d.bayarTipe==="DP"?(+d.dpNominal||0):0}});
    }).then(ok=>{ if(!ok||!baru)return; UI.draft=null;
      toast("Sales order "+baru.no_so+" tersimpan. Performa Invoice "+(baru.no_pi||"")+" terbit.","good");
      app.detail(baru.id); setTimeout(()=>app.printDoc("pi",baru.id),350); });
  },

  simpanRevisiPI(id){
    this.revSimpanForm();
    const d=UI.rev, alasan=(d.alasan||"").trim();
    if(terikatBatas()){
      for(const it of d.items){ const pr=prod(it.productId), sl=cekHarga(pr,it.harga);
        if(sl){ toast(sl.jenis==="tinggi"
          ? "Harga "+(pr.nama||"barang")+" melebihi harga normal "+rp(sl.batas)+". Periksa kembali angkanya."
          : "Diskon pada "+(pr.nama||"barang")+" melebihi batas "+batasDiskon()+"%. Harga terendah "+rp(sl.batas)+".","bad");
          return; } }
      const sb=d.items.reduce((a,i)=>a+i.qty*i.harga,0);
      const dk=Math.min(Math.max(0,+d.diskon||0),sb);
      if(sb>0&&dk/sb*100>batasDiskon()){
        toast("Diskon nota melebihi batas "+batasDiskon()+"%. Tertinggi "+rp(Math.floor(sb*batasDiskon()/100))+".","bad"); return; }
    }
    this.closeModal();
    act(()=>rpc("revisi_proforma",{p_id:id,p:{
      items:d.items.map(i=>({product_id:i.productId,qty:i.qty,harga:i.harga})),
      catatan:d.catatan||"", ppn_aktif:!!d.ppnAktif, ppn_persen:+d.ppnPersen||0,
      ongkir_aktif:!!d.ongkirAktif, ongkir:+d.ongkir||0, ekspedisi:d.ekspedisi||"",
      diskon:+d.diskon||0, dp_nominal:+d.dpNominal||0, alasan_revisi:alasan}}),"Performa Invoice direvisi.")
      .then(ok=>{ if(ok){ UI.rev=null; setTimeout(()=>app.printDoc("pi",id),350); } }); },

        <p class="hint">Nama resmi, alamat, telepon, NPWP, dan logo toko inilah yang tercetak di Sales Order, invoice, dan label pengiriman.</p>`}`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.saveStore('${id||""}')">Simpan</button>`); },
  tabToko(t,id){ this.simpanTabToko(); UI.tabToko=t; this.closeModal(); this.editStore(id); },
  simpanTabToko(){ UI.tokoDraft=UI.tokoDraft||{};
    [["sKode","kode"],["sNama","nama"],["sAlamat","alamat"],["sTelp","telp"],["sEmail","email"],
     ["sLogo","logo"],["sWarna","warna"],["sSpart","sparepart"],["sJudul","judul_landing"],["sTagline","tagline"],
     ["sLegal","nama_legal"],["sNpwp","npwp"],["sRek","rekening"],["sFooter","footer_doc"]]
      .forEach(([el,k])=>{ const n=$("#"+el); if(n&&n.value!==undefined&&n.value!==null) UI.tokoDraft[k]=n.value; }); },
  async unggahLogo(input){ const f=input.files&&input.files[0]; if(!f)return;
    const el=$("#sLogo"); if(el) el.placeholder="Mengunggah…";
    try{ const b=await unggahBukti(f); if(el){ el.value=b.url; el.placeholder=""; } toast("Logo terunggah.","good"); }
    catch(e){ toast(e.message,"bad"); if(el) el.placeholder=""; } },
  saveStore(id){
    this.simpanTabToko();
    const d=UI.tokoDraft||{}; const lama=id?store(id):{};
    const body={kode:(d.kode!==undefined?d.kode:lama.kode||"").toUpperCase().trim(),
      nama:(d.nama!==undefined?d.nama:lama.nama||"").trim(),
      alamat:d.alamat!==undefined?d.alamat:(lama.alamat||""), telp:d.telp!==undefined?d.telp:(lama.telp||""),
      email:d.email!==undefined?d.email:(lama.email||""), logo:d.logo!==undefined?d.logo:(lama.logo||""),
      warna:(d.warna!==undefined?d.warna:(lama.warna||"#E50112")).trim(),
      sparepart:d.sparepart!==undefined?d.sparepart:(lama.sparepart||"nozzle"),
      judul_landing:d.judul_landing!==undefined?d.judul_landing:(lama.judulLanding||""),
      tagline:d.tagline!==undefined?d.tagline:(lama.tagline||""),
      nama_legal:d.nama_legal!==undefined?d.nama_legal:(lama.namaLegal||""),
      npwp:d.npwp!==undefined?d.npwp:(lama.npwp||""),
      rekening:d.rekening!==undefined?d.rekening:(lama.rekening||""),
      footer_doc:d.footer_doc!==undefined?d.footer_doc:(lama.footerDoc||"")};
    if(!body.nama||!body.kode){ toast("Kode dan nama toko wajib diisi.","bad"); return; }
    if(!/^#[0-9A-Fa-f]{6}$/.test(body.warna)){ toast("Warna harus berformat #RRGGBB.","bad"); return; }
    UI.tokoDraft=null; UI.tabToko="data";
    this.closeModal();
    act(()=>api(id?"/rest/v1/stores?id=eq."+id:"/rest/v1/stores",{method:id?"PATCH":"POST",
      headers:{Prefer:"return=representation"},body:JSON.stringify(body)}),"Data toko tersimpan."); },

  /* --- master pengguna --- */
  editUser(id){ const u=id?DB.users.find(x=>x.id===id):{id:"",nama:"",email:"",role:"toko",storeId:DB.stores[0]&&DB.stores[0].id};
    const roles=[["owner","Super Admin"],["toko","Admin Toko"],["manajer","Manajer Toko"],
      ["finance","Finance"],["gudang","Admin Gudang"],["sales","Sales Admin"]];
    modal(id?"Ubah pengguna":"Tambah pengguna",
      `${id?"":`<div style="background:#FAFAFB;border-left:3px solid var(--silver-6);padding:10px 12px;margin-bottom:14px;font-size:12.5px">
        <b>Buat akunnya dulu di Supabase.</b> Buka Authentication → Users → Add user, isi email dan kata sandi,
        centang Auto Confirm User. Salin <b>User UID</b> yang muncul, lalu tempel di kolom pertama di bawah.</div>
        <label class="f"><span>User UID dari Supabase</span><input class="i mono" id="uId" placeholder="00000000-0000-0000-0000-000000000000"></label>`}
       <div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Nama lengkap</span><input class="i" id="uNama" value="${esc(u.nama)}"></label>
        <label class="f"><span>Email</span><input class="i" id="uEmail" value="${esc(u.email||"")}" placeholder="nama@perusahaan.id"></label></div>
       <div class="grid g2" style="gap:0 14px">
        <label class="f"><span>Peran</span><select class="i" id="uRole">
          ${roles.map(r=>`<option value="${r[0]}" ${u.role===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select></label>
        <label class="f"><span>Toko penempatan</span><select class="i" id="uStore">
          <option value="">— tidak terikat toko —</option>
          ${DB.stores.map(st=>`<option value="${st.id}" ${u.storeId===st.id?"selected":""}>${esc(st.nama)}</option>`).join("")}</select></label></div>
       <p class="hint" style="margin:0">Admin toko wajib dipilihkan toko penempatan; ia hanya akan melihat pesanan tokonya sendiri.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Batal</button><button class="btn pri" onclick="app.saveUser('${id||""}')">Simpan</button>`); },
  saveUser(id){ const g=x=>($("#"+x)||{}).value;
    const nama=(g("uNama")||"").trim(), email=(g("uEmail")||"").trim().toLowerCase(),
      role=g("uRole"), store_id=g("uStore")||null, uid=(g("uId")||"").trim();
    if(!nama){ toast("Nama wajib diisi.","bad"); return; }
    if(role==="toko"&&!store_id){ toast("Admin toko harus dipilihkan toko penempatan.","bad"); return; }
    if(!id&&!/^[0-9a-f-]{36}$/i.test(uid)){ toast("User UID dari Supabase belum benar.","bad"); return; }
    this.closeModal();
    act(()=>api(id?"/rest/v1/profiles?id=eq."+id:"/rest/v1/profiles",{method:id?"PATCH":"POST",
      headers:{Prefer:"return=representation"},
      body:JSON.stringify(id?{nama,email,role,store_id}:{id:uid,nama,email,role,store_id,aktif:true})}),
      "Data pengguna tersimpan."); },
  toggleUser(id){ const u=DB.users.find(x=>x.id===id); if(!u)return;
    if(u.id===ME.id){ toast("Akun sendiri tidak bisa dinonaktifkan.","bad"); return; }
    if(u.aktif&&u.role==="owner"&&DB.users.filter(x=>x.role==="owner"&&x.aktif).length<=1){
      toast("Minimal harus ada satu Super Admin aktif.","bad"); return; }
    act(()=>api("/rest/v1/profiles?id=eq."+id,{method:"PATCH",
      headers:{Prefer:"return=representation"},body:JSON.stringify({aktif:!u.aktif})}),
      "Status pengguna diperbarui."); },

  /* --- mutasi stok --- */
  mvTipeChange(){ const t=$("#mvTipe").value;
    $("#mvLokLabel").textContent = t==="MASUK"?"Masuk ke lokasi": t==="KELUAR"?"Diambil dari lokasi":"Dikirim ke toko"; },
  simpanMutasi(){
    const tipe=$("#mvTipe").value, pid=$("#mvProd").value, qty=Math.max(1,+$("#mvQty").value||0),
      lok=$("#mvLok").value, oleh=$("#mvOleh").value, ket=$("#mvKet").value;
    if(!pid){ toast("Pilih barang dulu.","bad"); return; }
    act(()=>rpc("move_stock",{p_tipe:tipe,p_product:pid,p_qty:qty,p_lok:lok,
      p_oleh:tipe==="TRANSFER"?"HQ":oleh,p_ket:ket||""}),"Mutasi tersimpan. Stok diperbarui."); },

  /* --- kelayakan usaha --- */
  feasSet(k,v){ const f={...(DB.feasib||feasibDefaults())};
    f[k]=Math.max(0,+v||0);
    if(k==="horizon") f.horizon=Math.min(120,Math.max(6,Math.round(f.horizon)));
    DB.feasib=f; render();
    api("/rest/v1/app_settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({id:"feasib",data:f})}).catch(e=>toast(e.message,"bad")); },
  feasReset(){ const f=feasibDefaults(); DB.feasib=f; render();
    api("/rest/v1/app_settings",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({id:"feasib",data:f})}).then(()=>toast("Asumsi disetel ulang dari data penjualan.","good"))
      .catch(e=>toast(e.message,"bad")); },

  /* --- dokumen --- */
  printDoc(kind,id){ const o=order(id); if(!o)return;
    if(kind==="inv"&&!o.invoice){ toast("Invoice belum terbit untuk pesanan ini.","bad"); return; }
    if(kind==="pi"&&!o.noPI){ toast("Performa Invoice belum terbit untuk pesanan ini.","bad"); return; }
    const html = kind==="so"?docSO(o) : kind==="label"?docLabel(o)
      : kind==="pi"?dokTema(o,"pi") : dokTema(o,"inv");
    const nama = kind==="so"?"Sales Order "+o.noSO : kind==="label"?"Label pengiriman "+(o.noAwb||o.noSO)
      : kind==="pi"?("Performa Invoice "+(o.noPI||"")+(o.revPI?" · Rev. "+o.revPI:""))
      : "Invoice "+((o.invoice||{}).no||"");
    pasangKertas(tpl(o.storeId));
    $("#printArea").innerHTML=html;
    modal(nama,`<div class="previewbox">${html}</div>
      <p class="hint" style="margin:12px 0 0">Pilih <b>Simpan sebagai PDF</b> pada dialog cetak untuk menghasilkan file.</p>`,
      `<button class="btn gh" onclick="app.closeModal()">Tutup</button>
       ${kind==="pi"&&["MENUNGGU_BAYAR","DITOLAK_MANAJER"].includes(o.status)&&can("proforma")
         ?`<button class="btn" onclick="app.formRevisiPI('${id}')">Revisi</button>`:""}
       <button class="btn pri" onclick="window.print()">Cetak / simpan PDF</button>`); },
  closeModal(){ $("#modalHost").innerHTML=""; $("#printArea").innerHTML=""; }
};
window.app=app;
document.addEventListener("click",e=>{ if(UI.notifOpen&&!e.target.closest(".notif")&&!e.target.closest(".bell")){ UI.notifOpen=false; render(); } },true);
</script>
</body>
</html>
